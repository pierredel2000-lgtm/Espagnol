input{font-family:inherit;font-size:16px}
#app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:40;background:var(--u,#2a211b);color:#fff;
  background-image:linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:14px 100%;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;transition:background .35s}
.cab-ver{margin-left:auto;align-self:flex-start;font-size:10.5px;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.62);background:rgba(255,255,255,.12);border-radius:6px;padding:3px 7px;white-space:nowrap}
.atras{background:rgba(255,255,255,.18);border-radius:9px;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:#fff}
.cab-txt{flex:1;min-width:0}
.cab-sup{font-size:10px;letter-spacing:.09em;opacity:.72;font-weight:600;text-transform:uppercase}
.cab-tit{font-size:16.5px;font-weight:700;line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lupa{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.lupa.on{background:#fff;color:var(--u,#1d1d1f)}
main{flex:1;padding:16px 14px 44px}
.tarjeta{background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);padding:18px;margin-bottom:12px}
.cabe{margin:-4px 0 16px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra);line-height:0}
.cabe svg{width:100%;height:auto;display:block}
.u-item{position:relative;overflow:hidden}
.u-item::after{content:'';position:absolute;right:-26px;top:-26px;width:104px;height:104px;
  border-radius:50%;background:var(--ac,#c0573b);opacity:.07;pointer-events:none}
.u-item::before{content:'';position:absolute;right:8px;bottom:-30px;width:86px;height:86px;
  pointer-events:none;opacity:.10;background-repeat:no-repeat;background-size:contain;
  background-image:var(--pat,none)}

.intro{font-size:14px;color:var(--suave);margin:0 0 14px}
.u-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--papel);
  border-radius:var(--r);box-shadow:var(--sombra);padding:14px 16px;margin-bottom:10px;transition:transform .12s}
.u-item:active{transform:scale(.985)}
.u-num{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:800;font-size:17px}
.u-txt{min-width:0}
.u-tit{font-weight:700;font-size:16px;line-height:1.3}
.u-sub{font-size:12.5px;color:var(--suave);line-height:1.35;margin-top:2px}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modo{background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);padding:16px 14px;text-align:left;
  display:flex;flex-direction:column;gap:5px;min-height:104px;justify-content:center;transition:transform .12s}
.modo:active{transform:scale(.97)}
.modo .ic{font-size:22px;line-height:1}
.modo .nm{font-weight:700;font-size:14.5px;line-height:1.25;display:block}
.modo .ds{font-size:11.5px;color:var(--suave);line-height:1.3;display:block;margin-top:2px}
.modo.ancho{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0;padding:16px}
.modo.ancho .ic{font-size:24px}
.modo.ancho div.tx{flex:1}
.btn{border-radius:11px;padding:13px 18px;font-weight:650;font-size:15px;background:var(--u,#1d1d1f);
  color:#fff;width:100%;transition:opacity .12s}
.btn:active{opacity:.8}
.btn.sec{background:var(--papel);color:var(--tinta);box-shadow:inset 0 0 0 1.5px var(--linea)}
.fila{display:flex;gap:9px}
/* niveles */
.niv{width:100%;background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);padding:16px 18px;
  text-align:left;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:transform .12s}
.niv:active{transform:scale(.985)}
.niv-p{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:18px;background:var(--fondo)}
.niv-t{font-weight:700;font-size:15.5px;display:block}
.niv-d{font-size:12.5px;color:var(--suave);line-height:1.35;margin-top:2px;display:block}
/* lecciones */
.lec-lista{display:flex;flex-direction:column;gap:9px}
.lec{background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden}
.lec-cab{display:flex;align-items:center;gap:12px;padding:15px 16px;width:100%;text-align:left}
.lec-n{width:26px;height:26px;border-radius:8px;flex-shrink:0;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;background:var(--fondo);color:var(--suave)}
.lec.abierta .lec-n{background:var(--u);color:#fff}
.lec-t{flex:1;font-weight:650;font-size:15px;line-height:1.3}
.lec-sub{font-size:12px;color:var(--suave);font-weight:400;display:block;margin-top:1px}
.lec-fl{color:var(--suave);font-size:13px;transition:transform .25s;flex-shrink:0}
.lec.abierta .lec-fl{transform:rotate(180deg)}
.lec-cuerpo{display:none;padding:15px 16px 18px;border-top:1px solid var(--linea)}
.lec.abierta .lec-cuerpo{display:block}
.lec-cuerpo p{margin:0 0 9px;font-size:14.5px;line-height:1.6}
.lec-cuerpo p:last-child{margin-bottom:0}
.lec-cuerpo i{font-style:italic;color:#3a3a3c}
.lec-cuerpo .nota,.bloq{font-size:13.5px;background:var(--pista);border-left:3px solid var(--pistaln);
  padding:10px 13px;border-radius:0 8px 8px 0;color:#5c4d1f;margin:10px 0;line-height:1.6}
.lec-cuerpo .gris{color:var(--suave);font-size:.84em}
.lec-cuerpo table,.tb{width:100%;border-collapse:collapse;margin:11px 0;font-size:13.5px;
  display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
.lec-cuerpo th,.tb th{background:var(--u);color:#fff;font-weight:650;font-size:11.5px;letter-spacing:.04em;
  padding:7px 9px;text-align:left;text-transform:uppercase;white-space:nowrap}
.lec-cuerpo td,.tb td{padding:7px 9px;border-bottom:1px solid var(--linea);vertical-align:top;line-height:1.45}
.lec-cuerpo tr:nth-child(even) td,.tb tr:nth-child(even) td{background:#fbfaf8}
.et{font-size:10.5px;letter-spacing:.09em;font-weight:700;color:var(--suave);text-transform:uppercase;margin:14px 0 6px}
.ejs{margin:8px 0;padding-left:0;list-style:none}
.ejs li{font-size:14px;line-height:1.6;padding:6px 0 6px 14px;border-left:2px solid var(--linea);margin-bottom:4px}
/* vocabulario */
.voc-fila{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--linea)}
.voc-fila:last-child{border-bottom:none}
.voc-es{font-weight:650;font-size:15px}
.voc-ctx{font-size:11.5px;color:var(--suave);font-style:italic;margin-top:2px}
.voc-izq{min-width:0;flex:1}
.voc-ej{font-size:12.5px;color:var(--tx);opacity:.82;margin-top:3px;line-height:1.4}
.voc-pag{font-size:10.5px;color:var(--suave);margin-left:6px;white-space:nowrap}
.voc-fr{font-size:13px;color:var(--suave);text-align:right;flex-shrink:0;max-width:36%}
.buscador{width:100%;border-radius:11px;padding:12px 15px;background:var(--papel);
  box-shadow:inset 0 0 0 1.5px var(--linea);outline:none;margin-bottom:12px}
/* juegos */
.prog{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.prog-b{flex:1;height:5px;background:var(--linea);border-radius:3px;overflow:hidden}
.prog-f{height:100%;background:var(--u);border-radius:3px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.prog-t{font-size:12px;color:var(--suave);white-space:nowrap;font-variant-numeric:tabular-nums}
.ficha{min-height:190px;border-radius:16px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:28px 22px;text-align:center;background:var(--papel);
  box-shadow:var(--sombra);transition:background .28s,color .28s}
.ficha.vuelta{background:var(--u);color:#fff}
.ficha-et{font-size:10.5px;letter-spacing:.11em;font-weight:700;opacity:.55;text-transform:uppercase}
.ficha-tx{font-size:25px;font-weight:700;line-height:1.28}
.ficha-ctx{font-size:13px;font-style:italic;opacity:.72;margin-top:3px}
.preg{font-size:13px;color:var(--suave);margin:0 0 9px}
.frase{background:var(--papel);border-radius:12px;box-shadow:var(--sombra);padding:18px 20px;
  font-size:18px;line-height:1.65;margin-bottom:14px;font-weight:500}
.frase .fr{display:block;font-size:14px;color:var(--suave);font-style:italic;font-weight:400;margin-top:8px}
.hueco{display:inline-block;min-width:74px;border-bottom:2px solid var(--linea);text-align:center;color:var(--suave)}
.hueco.ok{color:var(--ok);border-color:var(--ok);font-weight:700}
.hueco.no{color:var(--err);border-color:var(--err);font-weight:700}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.op{background:var(--papel);border-radius:11px;box-shadow:inset 0 0 0 1.5px var(--linea);padding:14px 13px;
  font-size:14.5px;font-weight:600;text-align:center;line-height:1.35;transition:transform .1s;
  min-height:52px;display:flex;align-items:center;justify-content:center}
.op:active{transform:scale(.97)}
.op.larga{text-align:left;justify-content:flex-start;font-weight:500;font-size:14px}
.op.bien{background:var(--okbg);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.op.mal{background:var(--errbg);color:var(--err);box-shadow:inset 0 0 0 2px var(--err)}
.campo{width:100%;border-radius:11px;padding:14px 16px;background:var(--papel);
  box-shadow:inset 0 0 0 1.5px var(--linea);outline:none;margin-bottom:12px}
.campo:focus{box-shadow:inset 0 0 0 2px var(--u)}
.campo.bien{background:var(--okbg);box-shadow:inset 0 0 0 2px var(--ok)}
.campo.casi{background:var(--casibg);box-shadow:inset 0 0 0 2px var(--casi)}
.campo.mal{background:var(--errbg);box-shadow:inset 0 0 0 2px var(--err)}
.aviso{border-radius:11px;padding:12px 15px;font-size:14px;margin-bottom:12px;line-height:1.55}
.aviso.bien{background:var(--okbg);color:var(--ok)}
.aviso.casi{background:var(--casibg);color:var(--casi)}
.aviso.mal{background:var(--errbg);color:var(--err)}
.aviso.pista{background:var(--pista);color:#5c4d1f;border-left:3px solid var(--pistaln)}
.btn-salir{display:block;width:100%;margin-top:22px;padding:12px;border-radius:12px;
  background:transparent;color:var(--suave);font-size:13.5px;font-weight:600;
  box-shadow:inset 0 0 0 1.5px var(--linea)}
.btn-salir:active{background:var(--linea)}
.fx-salir{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.14);color:#fff;font-size:14px;line-height:1;z-index:5}
.toque{margin-top:14px;text-align:center;font-size:13.5px;color:var(--suave);
  padding:13px;border:1.5px dashed var(--linea);border-radius:11px;cursor:pointer;
  animation:pulso 2.4s ease-in-out infinite}
.toque:active{background:var(--papel)}
@keyframes pulso{0%,100%{opacity:.55}50%{opacity:1}}
.fd-rango{display:flex;align-items:center;gap:9px;margin:-6px 0 12px}
.fd-rango-b{flex:1;height:4px;background:var(--linea);border-radius:3px;overflow:hidden}
.fd-rango-f{height:100%;background:linear-gradient(90deg,#c9a227,#e0b33a);border-radius:3px;transition:width .6s}
.fd-rango span{font-size:10.5px;color:var(--suave);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.fd-eq{font-size:20px;font-weight:600;opacity:.85}
.tr-fr{font-style:italic;opacity:.9}
.vb-et{display:inline-block;background:var(--azulejo);color:#fff;border-radius:999px;
  padding:6px 14px;font-size:12.5px;font-weight:700;margin-bottom:11px;letter-spacing:.02em}
.vb-nota{font-size:12.5px;color:var(--suave);margin-bottom:9px}
.vb-expl{margin-top:11px;background:#eef4f8;border-left:3px solid var(--azulejo);
  border-radius:0 10px 10px 0;padding:11px 14px;font-size:14px;line-height:1.6;color:#1f4a63}
.vb-tit{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:var(--azulejo);margin-bottom:5px}
.rae-l{display:flex;flex-direction:column;gap:7px}
.rae{display:flex;gap:9px;font-size:13.5px;line-height:1.45;color:var(--tinta)}
.rae-n{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--linea);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;
  color:var(--suave);margin-top:2px}
.mg-r{margin:11px 0 5px;font-weight:650;padding-left:11px;border-left:3px solid var(--oliva,#6b7a45)}
.mg-e{margin:3px 0 3px 14px;color:var(--suave);font-size:14.5px}
.lec-cuerpo p{margin:7px 0;line-height:1.6}
.exp-l{display:flex;flex-direction:column;gap:7px}
.exp{padding-left:11px;border-left:3px solid var(--azafran,#e0a032)}
.exp.fr{border-left-color:var(--azulejo,#2a6f97)}
.exp b{display:block;font-size:14px}
.exp span{display:block;font-size:12.8px;color:var(--suave);line-height:1.4}
.sen-l{display:flex;flex-direction:column;gap:9px}
.sen{padding-left:11px;border-left:3px solid var(--linea)}
.sen.aqui{border-left-color:var(--azulejo);background:#eef4f8;border-radius:0 8px 8px 0;padding:7px 11px}
.sen b{display:block;font-size:14.5px}
.sen span{display:block;font-size:12.8px;color:var(--suave);line-height:1.45;margin-top:2px}
.vb-tr{margin-top:10px;font-size:14.5px;font-style:italic;color:var(--suave)}
.multi{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.multi-f{display:flex;align-items:center;gap:10px}
.multi-n{width:24px;height:24px;border-radius:50%;background:var(--linea);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--suave)}
.multi .campo{margin-bottom:0;flex:1}
.fd-tr{display:block;font-size:14.5px;color:var(--suave);font-style:italic;font-weight:400;margin-top:12px}
.fd-ops.dos{flex-direction:row}.fd-ops.dos .fd-op{flex:1;text-align:center;font-size:17px;padding:20px 10px}
.fd-xp{background:#e0b33a;color:#3a2c00;border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px}
.fd-relampago{box-shadow:0 0 0 2px #e0b33a,var(--sombra)}
.fd-conf{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.25) 0 2px,transparent 3px),
             radial-gradient(circle at 75% 30%,rgba(255,255,255,.2) 0 3px,transparent 4px),
             radial-gradient(circle at 40% 70%,rgba(255,255,255,.18) 0 2px,transparent 3px),
             radial-gradient(circle at 85% 80%,rgba(255,255,255,.22) 0 2px,transparent 3px);
  animation:brilla 2.2s ease-in-out infinite}
@keyframes brilla{0%,100%{opacity:.4}50%{opacity:1}}
.fd-fiesta{position:relative;overflow:hidden}
/* rango y logros */
.rg{background:linear-gradient(160deg,var(--u),#2a2a2c);color:#fff;border-radius:var(--r);
  padding:24px 20px;text-align:center;margin-bottom:16px;box-shadow:var(--sombra)}
.rg-emo{font-size:52px;line-height:1}
.rg-tit{font-size:24px;font-weight:800;margin-top:6px}
.rg-pts{font-size:14px;opacity:.8;margin-bottom:14px}
.rg-b{height:8px;background:rgba(255,255,255,.22);border-radius:5px;overflow:hidden}
.rg-f{height:100%;background:linear-gradient(90deg,#e0b33a,#f5d76e);border-radius:5px;transition:width .6s}
.rg-sig{font-size:12.5px;opacity:.78;margin-top:9px}
.st-g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.st{background:var(--papel);border-radius:12px;box-shadow:var(--sombra);padding:13px 8px;text-align:center}
.st-e{font-size:20px}.st-v{font-size:17px;font-weight:800;margin-top:3px}
.st-t{font-size:10.5px;color:var(--suave);line-height:1.3;margin-top:2px}
.lg-g{display:flex;flex-direction:column;gap:8px}
.lg{display:flex;gap:13px;align-items:center;background:var(--papel);border-radius:12px;
  padding:12px 14px;box-shadow:var(--sombra);opacity:.5}
.lg.ok{opacity:1;box-shadow:inset 0 0 0 1.5px #e0b33a,var(--sombra)}
.lg-e{font-size:24px;width:32px;text-align:center;flex-shrink:0}
.lg-n{font-weight:700;font-size:14.5px}
.lg-d{font-size:12px;color:var(--suave);line-height:1.35}
/* 200 palabras */
.b2{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--linea)}
.b2:last-child{border-bottom:none}
.b2-n{font-size:10.5px;color:var(--suave);width:24px;flex-shrink:0;padding-top:4px;font-variant-numeric:tabular-nums}
.b2-c{flex:1;min-width:0}
.b2-es{font-weight:700;font-size:15px}
.b2-ej{font-size:12.5px;color:var(--suave);font-style:italic;margin-top:2px}
.b2-fr{text-align:right;font-size:13.5px;color:var(--suave);flex-shrink:0;max-width:42%}
.b2-t{display:block;font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:.04em}
.grupo{margin-bottom:22px}
.grupo-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
  color:var(--suave);margin:0 0 9px 4px;display:flex;align-items:center;gap:9px}
.grupo-t::after{content:'';flex:1;height:1px;background:var(--linea)}
.u-item.destacado{background:linear-gradient(135deg,#2a211b,#3f3128)}
.rp-lista{display:flex;flex-direction:column;gap:8px}
.rp{display:flex;gap:11px;align-items:center;background:var(--papel);border-radius:12px;
  padding:12px 13px;box-shadow:var(--sombra)}
.rp.ok{box-shadow:inset 0 0 0 1.5px var(--ok),var(--sombra)}
.rp-c{flex:1;min-width:0}
.rp-q{font-size:13.5px;line-height:1.35;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.rp-r{font-size:12.5px;color:var(--suave);margin-top:2px;font-weight:650}
.rp-b{height:4px;background:var(--linea);border-radius:3px;overflow:hidden;margin-top:6px}
.rp-f{height:100%;background:linear-gradient(90deg,#e0a032,#1a7a45);border-radius:3px;transition:width .5s}
.rp-x{width:34px;height:34px;border-radius:10px;background:var(--fondo);flex-shrink:0;
  font-size:15px;color:var(--suave);display:flex;align-items:center;justify-content:center}
.rp.ok .rp-x{background:var(--okbg);color:var(--ok);font-weight:800}
.rp-paso{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;
  color:var(--azulejo);margin-bottom:9px}
.rp-vacio{text-align:center;padding:46px 20px}
.rp-vacio-e{font-size:52px}
.rp-vacio-t{font-size:19px;font-weight:700;margin-top:10px}
.rp-vacio-d{font-size:14px;color:var(--suave);margin-top:6px;line-height:1.5}
.hoy{background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);padding:15px 17px;margin-bottom:16px}
.hoy-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.hoy-t{font-size:15px;font-weight:800}
.hoy-r{font-size:12.5px;color:var(--suave);font-variant-numeric:tabular-nums}
.hoy-sem{display:flex;justify-content:space-between;margin-bottom:13px}
.dia{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.dia-p{width:19px;height:19px;border-radius:50%;background:var(--linea);display:block;transition:all .3s}
.dia-p.medio{background:#e8c87a}
.dia-p.lleno{background:linear-gradient(135deg,#ff9a3c,#e0392b);box-shadow:0 0 9px rgba(255,120,40,.45)}
.dia-l{font-size:10px;color:var(--suave);font-weight:700}

<script>
const UNIDADES = [{"n": 1, "titulo": "El español y tú", "color": "#d18b1f", "tarea": "Dar consejos para aprender un idioma", "lecciones": [{"t": "Verbos pronominales (reflexivos)", "c": "Se conjugan con los pronombres <b>me, te, se, nos, os, se</b> delante del verbo.<table><tr><th></th><th>LEVANTARSE</th><th>SENTIRSE</th></tr><tr><td>yo</td><td><b>me</b> levanto</td><td><b>me</b> siento</td></tr><tr><td>tú, vos</td><td><b>te</b> levantas / levantás</td><td><b>te</b> sientes / sentís</td></tr><tr><td>él, ella, usted</td><td><b>se</b> levanta</td><td><b>se</b> siente</td></tr><tr><td>nosotros/as</td><td><b>nos</b> levantamos</td><td><b>nos</b> sentimos</td></tr><tr><td>vosotros/as</td><td><b>os</b> levantáis</td><td><b>os</b> sentís</td></tr><tr><td>ellos/as, ustedes</td><td><b>se</b> levantan</td><td><b>se</b> sienten</td></tr></table>"}, {"t": "Verbos irregulares más frecuentes", "c": "<table><tr><th>SER</th><th>ESTAR</th><th>IR</th><th>TENER</th><th>DECIR</th></tr><tr><td>soy</td><td>estoy</td><td>voy</td><td>tengo</td><td>digo</td></tr><tr><td>eres, sos</td><td>estás</td><td>vas</td><td>tienes</td><td>dices</td></tr><tr><td>es</td><td>está</td><td>va</td><td>tiene</td><td>dice</td></tr><tr><td>somos</td><td>estamos</td><td>vamos</td><td>tenemos</td><td>decimos</td></tr><tr><td>sois</td><td>estáis</td><td>vais</td><td>tenéis</td><td>decís</td></tr><tr><td>son</td><td>están</td><td>van</td><td>tienen</td><td>dicen</td></tr></table><p>Cambios vocálicos en la raíz:</p><table><tr><th>O &gt; UE</th><th>E &gt; IE</th><th>E &gt; I</th><th>C &gt; ZC</th></tr><tr><td><b>PODER</b><br>puedo, puedes, puede, podemos, podéis, pueden</td><td><b>QUERER</b><br>quiero, quieres, quiere, queremos, queréis, quieren</td><td><b>PEDIR</b><br>pido, pides, pide, pedimos, pedís, piden</td><td><b>CONOCER</b><br>conozco, conoces, conoce, conocemos, conocéis, conocen</td></tr></table><p class='nota'>Algunos verbos son irregulares solo en la primera persona: <b>hacer</b> (hago), <b>poner</b> (pongo), <b>salir</b> (salgo), <b>saber</b> (sé).</p>"}, {"t": "Hablar de la duración (I)", "c": "<p>• ¿<b>Desde cuándo</b> conoces a Pedro?</p><p>○ <b>Desde</b> el año pasado. / <b>Desde</b> agosto.</p><p>○ <b>Desde hace</b> un año. / <b>Desde hace</b> dos meses.</p><p class='nota'><b>Desde</b> + un momento concreto. <b>Desde hace</b> + una cantidad de tiempo.</p>"}, {"t": "Hablar de dificultades: el verbo COSTAR", "c": "Funciona como <b>gustar</b>: el sujeto es lo que resulta difícil.<table><tr><td>me, te, le,<br>nos, os, les</td><td><b>cuesta</b><br>(mucho / un poco)</td><td>hablar <span class='gris'>(INFINITIVO)</span><br>la gramática <span class='gris'>(SINGULAR)</span></td></tr><tr><td></td><td><b>cuestan</b><br>(mucho / un poco)</td><td>los verbos <span class='gris'>(PLURAL)</span></td></tr></table><p>• ¿Qué es lo que más <b>te cuesta</b>?</p><p>○ A mí <b>me cuesta</b> mucho pronunciar la erre.</p><p>○ No sé, a mí <b>me cuestan</b> mucho los verbos.</p>"}, {"t": "Otros recursos para expresar dificultad", "c": "<p>Para mí, <b>lo más difícil es</b> entender a la gente.</p><p>Pues para mí, <b>lo más difícil son</b> los verbos.</p><p>Para mí, <b>es muy difícil</b> entender películas en español.</p><p>Para mí, <b>son muy difíciles</b> las palabras largas.</p><p><b>Me siento</b> inseguro <b>cuando</b> hablo con nativos.</p><p><b>Lo paso fatal cuando</b> no entiendo las bromas.</p>"}, {"t": "Hacer recomendaciones", "c": "<p>• Necesito aprender más vocabulario.</p><p>○ Pues <b>tienes que</b> / <b>lo mejor es</b> escuchar la radio o ver más la tele.</p><table><tr><td><b>Va (muy) bien</b></td><td>+ infinitivo<br>+ nombres en singular</td></tr><tr><td><b>Van (muy) bien</b></td><td>+ nombres en plural</td></tr></table><p>Para perder el miedo a hablar, <b>va muy bien</b> salir con nativos.</p><p>Y también <b>van muy bien</b> los intercambios.</p>"}, {"t": "Léxico: el aprendizaje de lenguas", "c": "<p><b>hablar</b> (en) una lengua · en público · con nativos/as · con fluidez · correctamente</p><p><b>ver</b> una película (en versión original) · series · vídeos · la televisión</p><p><b>leer</b> revistas · periódicos · textos · novelas · poemas · en voz alta</p><p><b>escribir</b> palabras · textos · mensajes · un diario</p><p><b>escuchar</b> canciones · pódcasts · la radio · audiolibros</p><p><b>hacer</b> juegos de rol · ejercicios de gramática · exposiciones orales · pósters · un intercambio con un/a nativo/a</p><p><b>trabajar</b> solo/a · en grupo · con otra persona</p><p><b>conocer</b> otra cultura · las reglas de gramática</p><p><b>memorizar</b> las palabras · las reglas</p><p><b>tener</b> un buen nivel · <b>dominar</b> un idioma · <b>cometer</b> errores · <b>buscar</b> en el diccionario</p>"}, {"t": "Léxico: sentimientos y emociones", "c": "<p><b>sentirse</b> bien · mal · fatal · frustrado/a · ridículo/a · inseguro/a · raro/a · libre</p><p><b>pasarlo</b> bien · mal · fatal</p><p><b>dar</b> vergüenza · miedo</p><p class='nota'>Funciona como <b>gustar</b> o <b>costar</b>: <i>A mí <b>me da vergüenza</b> salir a la pizarra, pero a Marco no <b>le da</b> nada de vergüenza.</i></p>"}], "vocab": [["hablar una lengua", "parler une langue", "hablar (en) una lengua"], ["hablar en público", "parler en public", "aprendizaje de lenguas", "Me da vergüenza hablar en público.", 157], ["hablar con nativos", "parler avec des natifs", "hablar con nativos/as"], ["hablar con fluidez", "parler couramment", "tener fluidez"], ["hablar correctamente", "parler correctement", "aprendizaje de lenguas"], ["ver una película en versión original", "voir un film en version originale", "ver una película (en V.O.)"], ["ver series", "regarder des séries", "ver series / vídeos"], ["la televisión", "la télévision", "ver la televisión"], ["leer revistas", "lire des magazines", "leer revistas / periódicos"], ["el periódico", "le journal", "leer el periódico"], ["la novela", "le roman", "leer novelas"], ["el poema", "le poème", "leer poemas"], ["leer en voz alta", "lire à voix  corrección gramatical no es lo más importante\".", 16], ["la búsqueda", "la recherche", "buscar en el diccionario"], ["la escritura", "l'écriture", "la escritura y la lectura"], ["la lectura", "la lecture", "la escritura y la lectura"], ["el conocimiento", "la connaissance", "conocer una cultura"], ["la pronunciación", "la prononciation", "pronunciar bien"], ["la repetición", "la répétition", "repetir muchas veces"], ["la traducción", "la traduction", "traducir un texto"], ["imitar", "imiter", "imitar a los nativos"], ["exagerar", "exagérer", "exagerar el acento"], ["el intercambio lingüístico", "l'échange linguistique", "hacer un intercambio"], ["adelantar el reloj", "avancer sa montre", "llegar tarde"]], "huecos": [["Para mí, lo más difícil ___ entender a la gente.", "es", ["es", "son", "está", "están"], "Sujeto singular: 'entender'."], ["___ hace dos años que estudio español.", "Desde", ["Desde", "Hace", "Durante", "Por"], "Desde hace + cantidad de tiempo."], ["¿___ cuándo conoces a Pedro?", "Desde", ["Desde", "Hace", "Para", "Por"], "Preguntar por el inicio de una acción."], ["A mí me ___ mucho los verbos irregulares.", "cuestan", ["cuestan", "cuesta", "gusto", "cuesto"], "El sujeto es 'los verbos' (plural)."], ["Yo ___ muy inseguro cuando hablo con nativos.", "me siento", ["me siento", "me sento", "siento", "me sienta"], "Sentirse: E > IE."], ["Para perder el miedo, ___ muy bien los intercambios.", "van", ["van", "va", "es", "está"], "Nombre plural → van bien."], ["Yo no ___ nada bien las reglas de gramática.", "memorizo", ["memorizo", "memoriza", "memorizas", "memorizamos"], "Primera persona del singular."], ["¿Qué es lo que más te ___ del español?", "cuesta", ["cuesta", "cuestan", "cuestas", "costas"], "'lo que' es singular."]], "reto": [["Conjuga LEVANTARSE en la primera persona del plural (nosotros).", "nos levantamos", "Pronombre nos + forma regular."], ["Conjuga SENTIRSE en la segunda persona del singular (tú).", "te sientes", "Cambio vocálico E > IE."], ["¿Cuál es la forma 'yo' de PODER en presente?", "puedo", "Cambio vocálico O > UE."], ["¿Cuál es la forma 'yo' de CONOCER en presente?", "conozco", "Irregularidad C > ZC solo en la 1.ª persona."], ["¿Cuál es la forma 'yo' de HACER en presente?", "hago", "Irregular solo en la primera persona."], ["¿Cuál es la forma 'yo' de SABER en presente?", "sé", "Forma monosilábica con tilde diacrítica."], ["Completa: 'A mí me da mucha ___ hablar en público.'", "vergüenza", "Sustantivo femenino que usa diéresis."], ["Conjuga PEDIR en la tercera persona del plural.", "piden", "Cambio vocálico E > I."]]}, {"n": 2, "titulo": "Una vida de película", "color": "#c0573b", "tarea": "Escribir una biografía", "lecciones": [{"t": "El pretérito indefinido", "c": "<p>Sirve para hablar de acciones pasadas situadas en un momento determinado del pasado.</p><p>• ¿Alguna vez has viajado sola?</p><p>○ Sí, <b>viajé</b> a Marruecos hace dos años.</p><table><tr><th></th><th>VISITAR</th><th>NACER</th><th>ESCRIBIR</th></tr><tr><td>yo</td><td>visit<b>é</b></td><td>nac<b>í</b></td><td>escrib<b>í</b></td></tr><tr><td>tú, vos</td><td>visit<b>aste</b></td><td>nac<b>iste</b></td><td>escrib<b>iste</b></td></tr><tr><td>él, ella, usted</td><td>visit<b>ó</b></td><td>nac<b>ió</b></td><td>escrib<b>ió</b></td></tr><tr><td>nosotros/as</td><td>visit<b>amos</b></td><td>nac<b>imos</b></td><td>escrib<b>imos</b></td></tr><tr><td>vosotros/as</td><td>visit<b>asteis</b></td><td>nac<b>isteis</b></td><td>escrib<b>isteis</b></td></tr><tr><td>ellos/as, ustedes</td><td>visit<b>aron</b></td><td>nac<b>ieron</b></td><td>escrib<b>ieron</b></td></tr></table><p class='nota'>Las formas de <b>nosotros</b> en -AR e -IR son iguales que las del presente de indicativo. Las conjugaciones -ER e -IR comparten terminaciones.</p>"}, {"t": "Cambios ortográficos", "c": "<p>Los verbos terminados en <b>-zar</b>, <b>-gar</b> y <b>-car</b> cambian en la primera persona:</p><table><tr><td>empe<u>z</u>ar → empe<b>cé</b></td><td>lle<u>g</u>ar → lle<b>gué</b></td><td>publi<u>c</u>ar → publi<b>qué</b></td></tr></table><p>Otros ejemplos: cruzar → crucé · organizar → organicé · tocar → toqué · jugar → jugué · pagar → pagué</p>"}, {"t": "Verbos irregulares", "c": "<p>Todos los verbos con raíz irregular llevan las mismas terminaciones que <b>estar</b>:</p><table><tr><th></th><th>ESTAR</th></tr><tr><td>yo</td><td>estuv<b>e</b></td></tr><tr><td>tú, vos</td><td>estuv<b>iste</b></td></tr><tr><td>él, ella, usted</td><td>estuv<b>o</b></td></tr><tr><td>nosotros/as</td><td>estuv<b>imos</b></td></tr><tr><td>vosotros/as</td><td>estuv<b>isteis</b></td></tr><tr><td>ellos/as, ustedes</td><td>estuv<b>ieron</b></td></tr></table><p><b>Raíces irregulares:</b> tener → tuv- · haber → hub- · venir → vin- · hacer → hic- · poder → pud- · querer → quis- · saber → sup- · decir → dij- · poner → pus- · componer → compus- · obtener → obtuv-</p><p class='nota'>Ojo: él/ella/usted <b>hizo</b>; ellos/ellas/ustedes <b>dijeron</b> (no 'dijieron').</p><table><tr><th></th><th>IR / SER</th></tr><tr><td>yo</td><td>fui</td></tr><tr><td>tú, vos</td><td>fuiste</td></tr><tr><td>él, ella, usted</td><td>fue</td></tr><tr><td>nosotros/as</td><td>fuimos</td></tr><tr><td>vosotros/as</td><td>fuisteis</td></tr><tr><td>ellos/as, ustedes</td><td>fueron</td></tr></table>"}, {"t": "Marcadores temporales del pasado", "c": "<p><b>el</b> martes / año / mes / siglo <b>pasado</b></p><p><b>la</b> semana <b>pasada</b></p><p><b>hace</b> un año / dos meses / tres semanas / cuatro días…</p><p><b>el</b> lunes / martes / 8 de diciembre…</p><p><b>en</b> mayo / 1998 / Navidad / verano…</p><p><i>Claudia Llosa dirigió <b>en 2009</b> la película La teta asustada.</i></p><p><i>Terminó un máster en traducción <b>hace dos años</b>.</i></p><p><i><b>El año pasado</b> viajé a Senegal.</i></p>"}, {"t": "Relacionar acontecimientos del pasado", "c": "<p><i>Se casaron en 2016 y <b>tres años más tarde</b> se divorciaron.</i></p><p><i>Nos conocimos en 2015 y <b>seis meses después</b> nos fuimos a vivir juntos.</i></p><p><i>Ernesto acabó la carrera en julio y <b>al mes siguiente</b> encontró trabajo.</i></p>"}, {"t": "Hablar de la duración (II)", "c": "<p><i>Trabajé como periodista <b>durante</b> dos años.</i></p><p><i>Vivo en España <b>desde</b> febrero.</i></p><p><i>Estudio chino <b>desde hace</b> unos meses.</i></p><p><i>Viví en casa de mis padres <b>hasta</b> los 19 años.</i></p><p><i>Trabajé en un banco <b>de</b> 2006 <b>a</b> 2012 (= <b>desde</b>… <b>hasta</b>…).</i></p><p class='nota'>Si no se indican los dos límites, solo se puede usar la preposición larga: <i>Vivo en España <b>desde</b> febrero</i> (no 'de febrero').</p>"}, {"t": "Léxico: logros y biografías", "c": "<p><b>ganar / recibir / obtener</b> un premio · una medalla</p><p><b>ganar</b> una competición · el Mundial · las elecciones</p><p><b>convertirse en</b> presidente/a · un/a director/a famoso/a · campeón/ona</p><p><b>ser el primero / la primera en</b> ir al espacio · ganar el Premio Nobel</p><p><b>tener</b> éxito</p><p><b>Biografías:</b> nacer · estudiar · hacer amigos/as · encontrar trabajo · empezar a trabajar · ir a vivir con la pareja · trabajar · enamorarse · casarse · separarse / divorciarse · mudarse · tener hijos · cambiar de trabajo / ciudad / país · perder / dejar el trabajo · jubilarse · morir</p>"}, {"t": "Léxico: cine · IR / IRSE · EMPEZAR A", "c": "<p><b>Tipos de películas:</b> un largometraje · un cortometraje · un documental · una película biográfica · basada en una historia real · romántica / histórica / de miedo / de aventuras</p><p><b>Personas:</b> director/a · productor/a · actor / actriz · guionista</p><p><b>Hacer cine:</b> rodar = filmar · dirigir · estrenar · protagonizar · actuar en</p><p><b>IR / IRSE:</b> <i>El domingo <b>fui a</b> una exposición muy interesante.</i> / <i>Llegó a las dos y media hora más tarde <b>se fue</b> (de la reunión).</i> <span class='nota'>Irse = abandonar un lugar.</span></p><p><b>EMPEZAR (A):</b> <i>¿Cuándo <b>empezaste</b> la carrera?</i> / < TAR."], ["¿Cómo se dice que alguien no tiene pelo?", "calvo / calva", "Aspecto físico."], ["Completa: 'Mi hermano y yo nos ___ mucho.'", "parecemos", "Primera persona del plural."]]}, {"n": 4, "titulo": "Hogar, dulce hogar", "color": "#6b7a45", "tarea": "Diseñar y amueblar una vivienda", "lecciones": [{"t": "Expresar gustos y preferencias", "c": "<p>• ¿<b>Te gusta</b> esta lámpara? ○ Sí, pero <b>prefiero</b> esa, la roja.</p><p>• <b>Me gusta</b> vivir en el centro. ○ ¿Ah, sí? Pues yo <b>prefiero</b> vivir en las afueras porque es más tranquilo.</p><p><i>Me gusta este mueble. / Me gustan estos muebles.</i></p><p><i>Me encanta tu piso. / Me encantan estos cuadros.</i></p>"}, {"t": "Preposiciones y adverbios para ubicar", "c": "<p><b>debajo (de)</b> · <b>encima (de)</b> · <b>detrás (de)</b> · <b>delante (de)</b></p><p><b>entre</b> · <b>a la derecha (de)</b> · <b>a la izquierda (de)</b></p><p><b>en el centro (de)</b> · <b>alrededor (de)</b></p><p>• ¿Dónde está la pelota? ○ <b>Detrás de</b> la mesa.</p><p>• ¿La pelota está por aquí? No la veo en la mesa. ○ Está justo <b>detrás</b>.</p><p class='nota'>Con <b>de</b> + sustantivo; sin <b>de</b> cuando el lugar ya se conoce.</p>"}, {"t": "Posesivos tónicos", "c": "<table><tr><td>mi barrio → <b>el mío</b></td><td>mi ciudad → <b>la mía</b></td></tr><tr><td>tu barrio → <b>el tuyo</b></td><td>tu ciudad → <b>la tuya</b></td></tr><tr><td>su barrio → <b>el suyo</b></td><td>su ciudad → <b>la suya</b></td></tr><tr><td>nuestro barrio → <b>el nuestro</b></td><td>nuestra ciudad → <b>la nuestra</b></td></tr><tr><td>vuestro barrio → <b>el vuestro</b></td><td>vuestra ciudad → <b>la vuestra</b></td></tr><tr><td>su barrio → <b>el suyo</b></td><td>su ciudad → <b>la suya</b></td></tr></table><p>• En mi ciudad los alquileres son muy caros. ¿En <b>la tuya</b> también?</p><p>○ Sí, en casi todos los barrios, pero en <b>el mío</b> no porque está lejos del centro.</p>"}, {"t": "Comparar: superioridad", "c": "<table><tr><td><b>CON NOMBRES</b></td><td>Madrid tiene <b>más</b> parques <b>que</b> Barcelona.</td></tr><tr><td><b>CON ADJETIVOS</b></td><td>Madrid es <b>más</b> grande <b>que</b> Barcelona.</td></tr><tr><td><b>CON VERBOS</b></td><td>En Madrid la gente sale <b>más que</b> en Barcelona.</td></tr></table><p class='nota'>Formas especiales: más bueno/a → <b>mejor</b>; más malo/a → <b>peor</b>.</p>"}, {"t": "Comparar: igualdad", "c": "<table><tr><td><b>CON NOMBRES</b></td><td>Esta casa tiene <b>tanto</b> espacio / <b>tanta</b> luz / <b>tantos</b> balcones / <b>tantas</b> habitaciones <b>como</b> la otra.</td></tr><tr><td><b>CON ADJETIVOS</b></td><td>Aquí las casas son <b>tan</b> caras <b>como</b> en mi ciudad.<br>Aquí las casas son <b>igual de</b> caras <b>que</b> en mi ciudad.</td></tr><tr><td><b>CON VERBOS</b></td><td>Aquí la gente sale <b>tanto como</b> en España.</td></tr></table>"}, {"t": "Comparar: inferioridad", "c": "<table><tr><td><b>CON NOMBRES</b></td><td>Mi casa tiene <b>menos</b> balcones <b>que</b> esta.<br>Esta casa <b>no</b> tiene <b>tanto/a/os/as</b> … <b>como</b> la otra.</td></tr><tr><td><b>CON ADJETIVOS</b></td><td>Esta casa es <b>menos</b> luminosa <b>que</b> la otra.<br>Aquí las casas <b>no</b> son <b>tan</b> caras <b>como</b> en mi ciudad.</td></tr><tr><td><b>CON VERBOS</b></td><td>Aquí la gente sale <b>menos que</b> en España.<br>Aquí la gente <b>no</b> sale <b>tanto como</b> en mi ciudad.</td></tr></table>"}, {"t": "Léxico: tipos de vivienda y descripción", "c": "<p><b>Tipos:</b> una casa · una casa adosada · un chalé · una cabaña · un piso / apartamento · un estudio · un ático</p><p><b>Una casa</b> luminosa · acogedora · grande · pequeña · ruidosa · tranquila</p><p><b>Una casa con / sin</b> vistas · terraza · piscina</p><p><b>Da a</b> un parque · una plaza · (el) mar</p><p><b>Está</b> en la costa · en el centro · amueblado/a · bien situado/a</p><p><b>Tiene</b> ascensor · calefacción · mucha luz · aire acondicionado</p>"}, {"t": "Léxico: partes de la casa y materiales", "c": "<p><b>Partes y muebles:</b> el baño · la ducha · la bañera · el váter · el despacho · la cuna · la habitación · la cama · la terraza · la lámpara · el salón · la mesilla de noche · el espejo · el garaje · la lavadora · la nevera · el horno · la mesa · la estantería · la cocina · el sofá · la silla</p><p><b>Materiales:</b> mesa <b>de</b> cristal · cojín <b>de</b> tela · lámpara <b>de</b> metal · armario <b>de</b> madera · silla <b>de</b> plástico · sillón <b>de</b> piel · mesa <b>de</b> piedra · lámpara <b>de</b> papel · mesa <b>de</b> mármol · zapatero <b>de</b> hierro · caja <b>de</b> cartón</p><p>• ¿De qué es esta silla? ○ De metal.</p>"}], "vocab": [["la casa adosada", "la maison mitoyenne", "tipos de vivienda"], ["el chalé", "le pavillon, la villa", "tipos de vivienda"], ["la cabaña", "la cabane", "tipos de vivienda"], ["el piso", "l'appartement", "un piso / apartamento", "¿Qué me recomendáis: un piso o una residencia de estudiantes?", 58], ["el estudio", "le studio", "tipos de vivienda"], ["el ático", "l'appartement en attique", "tipos de vivienda"], ["luminoso/a", "lumineux", "una casa luminosa"], ["acogedor/a", "chaleureux, accueillant", "una casa acogedora"], ["ruidoso/a", "bruyant", "una casa ruidosa"], ["tranquilo/a", "calme", "una casa tranquila"], ["con vistas", "avec vue (con…)", "una casa con vistas"], ["la piscina", "la piscine", "una casa con piscina"], ["dar a", "donner sur", "Da a un parque / al mar."], ["estar en la costa", "être sur la côte", "está en la costa"], ["amueblado/a", "meublé", "está amueblado"], ["bien situado/a", "bien situé", "está bien situado"], ["bien comunicado/a", "bien desservi", "El piso está bien comunicado."], ["el ascensor", "l'ascenseur", "tiene ascensor"], ["la calefacción", "le chauffage", "tiene calefacción"], ["el aire acondicionado", "la climatisation", "tiene aire acondicionado"], ["mucha luz", "beaucoup de lumière", "tiene mucha luz", "Mi casa es bastante grande y tiene mucha luz, pero tu casa es más moderna.", 174], ["el baño", "la salle de bains", "partes de la casa"], ["la ducha", "la douche", "partes de la casa"], ["la bañera", "la baignoire", "partes de la casa"], ["el váter", "les toilettes", "partes de la casa"], ["el despacho", "le bureau (pièce)", "partes de la casa"], ["la cuna", "le berceau", "muebles"], ["la habitación", "la chambre", "partes de la casa", "Aquí está la habitación principal, que da a la terraza.", 64], ["la cama", "le lit", "muebles", "Cuando entras, la cama está justo delante.", 64], ["la lámpara", "la lampe", "muebles", "A mí me gusta mucho la lámpara del salón A, pero no me gusta el cuadro.", 55], ["el salón", "le salon", "partes de la casa", "¡En la nuestra, eso es la cocina y el salón comedor!", 64], ["la mesilla de noche", "la table de nuit", "muebles"], ["el espejo", "le miroir", "muebles"], ["el garaje", "le garage", "partes de la casa"], ["la lavadora", "la machine à laver", "electrodomésticos"], ["la nevera", "le réfrigérateur", "electrodomésticos"], ["el horno", "le four", "electrodomésticos"], ["la estantería", "l'étagère, la bibliothèque", "muebles", "La estantería está a la izquierda de la televisión .", 56], ["el sofá", "le canapé", "muebles", "Mi sofá está un poco viejo y quiero comprarme otro.", 174], ["el sillón", "le fauteuil", "muebles"], ["el armario", "l'armoire", "muebles"], ["el cojín", "le coussin", "cojín de tela"], ["el zapatero", "le meuble à chaussures", "zapatero de hierro"], ["de cristal", "en verre (de…)", "mesa de cristal"], ["de tela", "en tissu (de…)", "cojín de tela"], ["de metal", "en métal (de…)", "lámpara de metal"], ["de madera", "en bois (de…)", "armario de madera"], ["de plástico", "en plastique (de…)", "silla de plástico"], ["de piel", "en cuir (de…)", "sillón de piel"], ["de piedra", "en pierre (de…)", "mesa de piedra"], ["de papel", "en papier (de…)", "lámpara de papel"], ["de mármol", "en marbre (de…)", "mesa de mármol"], ["de hierro", "en fer (de…)", "zapatero de hierro"], ["de cartón", "en carton (de…)", "caja de cartón"], ["debajo de", "sous", "La pelota está debajo de la mesa."], ["encima de", "sur, au-dessus de", "encima de la mesa", "Hay una sil la encima de la mesa.", 56], ["detrás de", "derrière", "Detrás de la mesa.", "Hay un cuadro en la pared, detrás de la televisión.", 56], ["delante de", "devant", "delante de la mesa", "Hay un libro en el suelo, delante de la televisión.", 56], ["entre", "entre", "entre las dos sillas"], ["a la derecha de", "à droite de (a la…)", "a la derecha de la mesa"], ["a la izquierda de", "à gauche de (a la…)", "a la izquierda de la mesa", "La estantería está a la izquierda de la televisión .", 56], ["en el centro de", "au centre de (en el…)", "en el centro de la habitación", "Vivir en las afueras no es caro vivir en el centro de la ciudad .", 175], ["alrededor de", "autour de", "alrededor de la mesa"], ["el alquiler", "le loyer", "Los alquileres son muy caros.", "En mi ciudad, alquilar un piso es muy caro .", 174], ["las afueras", "la banlieue, la périphérie", "vivir en las afueras", "Vivir en las afueras no es caro vivir en el centro de la ciudad .", 175], ["preferir", "préférer", "Prefiero vivir en el centro.", "Pues en mi casa es al revés: mi mujer (preferir) cocinar.", 177], ["el recibidor", "l'entrée (pièce)", "partes de la casa"], ["el dormitorio", "la chambre", "partes de la casa"], ["el frigorífico", "le réfrigérateur", "electrodomésticos"], ["la cafetera", "la cafetière", "electrodomésticos"], ["el equipo de música", "la chaîne hi-fi", "muebles y objetos"], ["el televisor", "le téléviseur", "muebles y objetos"], ["el cuadro", "le tableau", "colgar un cuadro", "A mí me gusta mucho la lámpara del salón A, pero no me gusta el cuadro.", 55], ["la maceta", "le pot de fleurs", "la terraza llena de macetas", "Tiene la terraza llena de macetas.", 177], ["la lámpara de pie", "le lampadaire", "muebles del salón"], ["la mesa de centro", "la table basse", "muebles del salón", "Hay un ordenador en la mesa de centro, el libro.", 56], ["el aire puro", "l'air pur", "vivir en un pueblo"], ["las normas", "les règles", "seguir unas normas"], ["la corriente de energía", "le courant d'énergie", "feng shui"], ["la orientación", "l'orientation", "la orientación de la casa"], ["la pared", "le mur", "al lado de una pared", "Hay un cuadro en la pared, detrás de la televisión.", 56], ["el pasillo", "le couloir", "en los pasillos"], ["el lavabo", "le lavabo", "sobre el lavabo"], ["el tráfico", "la circulation", "una calle con mucho tráfico"], ["la cocina americana", "la cuisine ouverte", "tiene una cocina americana"], ["el trastero", "le débarras", "espacios de la casa"]], "huecos": [["Este apartamento ___ 85 m² y dos terrazas.", "tiene", ["tiene", "es", "está", "hay"], "Descripción con TENER."], ["El piso ___ bien comunicado y muy tranquilo.", "está", ["está", "es", "tiene", "hay"], "ESTAR + bien situado / bien comunicado."], ["Mi casa es más grande que ___ de Pedro.", "la", ["la", "el", "los", "las"], "Sustituye a 'casa' (femenino singular)."], ["Esta casa tiene ___ luz como la otra.", "tanta", ["tanta", "tanto", "tan", "tantas"], "'Luz' es femenino singular."], ["Aquí las casas son ___ caras como en mi ciudad.", "tan", ["tan", "tanto", "tantas", "igual"], "TAN + adjetivo + COMO."], ["La pelota está ___ de la mesa.", "detrás", ["detrás", "detrás que", "atrás", "tras"], "Adverbio + de."], ["En mi ciudad los alquileres son caros. ¿Y en ___?", "la tuya", ["la tuya", "el tuyo", "tu", "tuya"], "Posesivo tónico, sustituye a 'ciudad'."], ["Esta lámpara es ___ metal.", "de", ["de", "en", "a", "por"], "Materiales: DE + material."]], "reto": [["¿Cuál es la forma especial de 'más bueno'?", "mejor", "Comparativo irregular."], ["¿Cuál es la forma especial de 'más malo'?", "peor", "Comparativo irregular."], ["Completa: 'Madrid tiene ___ parques ___ Barcelona.' (superioridad)", "más que", "Con nombres: más + nombre + que."], ["Escribe el posesivo tónico masculino singular de 'nosotros'.", "el nuestro", "el nuestro / la nuestra."], ["¿Qué preposición se usa para decir que la casa mira a un parque?", "a", "Dar a un parque."], ["Completa: 'Aquí la gente sale ___ ___ en España.' (igualdad, con verbo)", "tanto como", "Con verbos: tanto como."], ["¿Cómo se llama el mueble donde se guardan los libros?", "la estantería", "Muebles del salón."], ["Escribe el adjetivo que describe una casa con mucha luz.", "luminosa", "Describir viviendas."]]}, {"n": 5, "titulo": "¿Cómo va todo?", "color": "#4a7c59", "tarea": "Simular situaciones de contacto social con diferentes niveles de formalidad", "lecciones": [{"t": "ESTAR + gerundio", "c": "<p>Cuando queremos especificar que una acción se está desarrollando en el momento preciso en el que estamos hablando, usamos <b>estar</b> + gerundio.</p><p><i>No se puede poner al teléfono, <b>se está duchando</b>.</i> <span class='nota'>(no: 'se ducha')</span></p><table><tr><th></th><th>ESTAR</th><th>+ GERUNDIO</th></tr><tr><td>yo</td><td>estoy</td><td rowspan='6'>trabaj<b>ando</b><br>com<b>iendo</b><br>viv<b>iendo</b></td></tr><tr><td>tú, vos</td><td>estás</td></tr><tr><td>él, ella, usted</td><td>está</td></tr><tr><td>nosotros/as</td><td>estamos</td></tr><tr><td>vosotros/as</td><td>estáis</td></tr><tr><td>ellos/as, ustedes</td><td>están</td></tr></table><p>También se usa para acciones que no se pueden terminar de una vez: <i>Estos días <b>estoy leyendo</b> el Quijote.</i></p><p>Y para señalar que un hábito ha cambiado, que es una fase: <i>Ahora <b>estoy trabajando</b> de camarero en una cafetería.</i></p>"}, {"t": "Gerundios regulares e irregulares", "c": "<table><tr><th>REGULARES</th><th>IRREGULARES</th></tr><tr><td>habl<b>ar</b> → habl<b>ando</b><br>beb<b>er</b> → beb<b>iendo</b><br>escrib<b>ir</b> → escrib<b>iendo</b></td><td>l<u>e</u>er → le<b>yendo</b>*<br>o<u>í</u>r → o<b>yendo</b>*<br>ir → <b>yendo</b>*<br>d<u>e</u>cir → d<b>i</b>ciendo**<br>d<u>o</u>rmir → d<b>u</b>rmiendo**</td></tr></table><p class='nota'>* Si antes de -er o -ir hay una vocal, la terminación del gerundio es -<b>yendo</b>.<br>** Algunos verbos en -ir presentan irregularidad vocálica en la raíz cuando la última vocal de la raíz es <b>e</b> u <b>o</b>: pedir, sentir, seguir, mentir, morir…</p>"}, {"t": "Pedir objetos, acciones y favores", "c": "<p>Dependiendo de la situación, del interlocutor y de la dificultad que implica la petición, usamos una u otra estructura.</p><table><tr><td><b>+ FORMAL<br>+ DIFÍCIL</b></td><td>¿Le / Te importaría prestarme…?<br>¿Me podría traer…?</td></tr><tr><td>↓</td><td>¿Le / Te importa dejarme…?<br>¿Me puede/s ayudar?</td></tr><tr><td><b>− FORMAL<br>− DIFÍCIL</b></td><td>¿Me pasa/s…?</td></tr></table><p><b>Pedir un favor:</b> ¿<b>Le importaría</b> dejarme pasar? · ¿<b>Me podría</b> sujetar esto un momento? · ¿<b>Te importa</b> quedarte mañana con los niños? · ¿<b>Puedes</b> ir al mercado y comprar fruta? · ¿<b>Me ayudas</b> un momento con esta traducción?</p>"}, {"t": "Pedir y conceder permiso", "c": "<p>Para pedir permiso usamos el verbo <b>poder</b> (en presente o en condicional) seguido de infinitivo.</p><p>• ¿<b>Puedo</b> / <b>Podría</b> dejar la bolsa aquí un momento? ○ Sí, sí, claro.</p><p>También podemos usar <b>importar si</b> + presente de indicativo.</p><p>• ¿<b>Te importa si</b> hago una llamada? ○ No, no. En absoluto.</p>"}, {"t": "Dar excusas o justificarse", "c": "<p>Es una norma de cortesía casi obligada explicar o justificar por qué rechazamos una invitación o por qué nos negamos a hacer un favor. Esa justificación se suele introducir con <b>es que</b>.</p><p>• ¿Vienes a cenar el sábado? ○ No puedo. <b>Es que</b> tengo que estudiar.</p><p><b>Es que</b> también sirve para justificar una petición.</p><p><i>¿Puedo cerrar la ventana? <b>Es que</b> entra mucho ruido.</i></p>"}, {"t": "Verbos para pedir: DAR, PASAR, PRESTAR, TENER, PONER", "c": "<p><b>Dar:</b> para pedir algo que no pensamos devolver. <i>¿Me <b>das</b> otro vaso de agua, por favor? — Claro, sin problema.</i></p><p><b>Pasar:</b> para pedir que nos acerquen un objeto. <i>¿Me <b>pasas</b> la chaqueta, por favor? — ¿La roja? Sí, toma.</i></p><p><b>Prestar</b> o <b>dejar:</b> para pedir un objeto ajeno. <i>¿Me <b>prestas</b> / <b>dejas</b> tu coche este fin de semana? — Uy, imposible. Es que lo necesito.</i></p><p><b>Tener:</b> para pedir algo que no sabemos si la persona tiene. <i>¿<b>Tienes</b> un bolígrafo? — Claro, toma.</i></p><p><b>Poner:</b> para pedir algo en un bar o en una tienda de alimentación. <i>¿Me <b>pone</b> un cortado, por favor? — ¡Enseguida!</i></p>"}, {"t": "Léxico: PEDIR y DAR", "c": "<p><b>pedir</b> ayuda · permiso · un favor · dinero · disculpas · información · algo prestado · algo en un bar</p><p><b>dar</b> las gracias · un abrazo · un beso · la mano</p>"}, {"t": "Léxico: situaciones de contacto social", "c": "<p><b>Saludar:</b> ¡Cuánto tiempo! · ¿Qué tal (todo)? · ¿Cómo va (todo)?</p><p><b>Interesarse por la vida de alguien:</b> Y la familia, ¿qué tal? · Y tu / su hermano, ¿cómo está?</p><p><b>Presentar(se):</b> Te / Le presento a… · Este/a es… · Un placer. · Mucho gusto. · Encantado/a (de conocerte / conocerle / conocerla). · Igualmente.</p><p><b>Agradecer y responder:</b> Muchas gracias, de verdad. · Muchísimas gracias. · Te / Se lo agradezco. · De nada. · No hay de qué.</p><p><b>Despedirse:</b> Bueno, pues nada… · Bueno, me tengo que ir. · ¡Recuerdos a tu / su familia! · ¡Saludos a Pedro! · ¡Dale / Dele un beso de mi parte! · ¡Hasta otra! · ¡Nos vemos pronto! · Cuídate. / Cuídese. · Nos llamamos. · Hasta la próxima. · Hablamos.</p>"}], "vocab": [["¿Cómo va todo?", "Comment ça va ?", "saludar"], ["¡Cuánto tiempo!", "Ça fait longtemps !", "saludar"], ["¿Qué tal todo?", "Comment va tout ?", "saludar"], ["Te presento a…", "Je te présente…", "presentar(se)"], ["Le presento a…", "Je vous présente…", "presentar(se) — formal"], ["Un placer", "Enchanté", "presentar(se)"], ["Mucho gusto", "Enchanté", "presentar(se)"], ["Encantado/a", "Enchanté(e)", "Encantado de conocerte."], ["Igualmente", "De même, moi aussi", "responder a una presentación"], ["Te lo agradezco", "Je t'en remercie", "agradecer"], ["Se lo agradezco", "Je vous en remercie", "agradecer — formal"], ["De nada", "De rien (de…)", "responder al agradecimiento"], ["No hay de qué", "Il n'y a pas de quoi", "responder al agradecimiento"], ["Muchísimas gracias", "Merci infiniment", "agradecer"], ["Me tengo que ir", "Je dois y aller", "despedirse", "Bueno, me tengo que ir.", 74], ["Recuerdos a tu familia", "Bon souvenir à ta famille", "despedirse"], ["Saludos a Pedro", "Salue Pedro de ma part", "despedirse"], ["Dale un beso de mi parte", "Embrasse-le/la de ma part", "despedirse"], ["¡Hasta otra!", "À une prochaine !", "despedirse"], ["¡Nos vemos pronto!", "À bientôt !", "despedirse"], ["Cuídate", "Prends soin de toi", "despedirse"], ["Nos llamamos", "On s'appelle", "despedirse"], ["Hasta la próxima", "À la prochaine (hasta…)", "despedirse"], ["Hablamos", "On se parle", "despedirse"], ["De su parte", "De sa part (de…)", "transmitir saludos"], ["dar", "donner", "¿Me das otro vaso de agua?"], ["pasar", "passer (un objet)", "¿Me pasas la chaqueta?", "Pasar: para pedir que nos acerquen un objeto.", 74], ["prestar", "prêter", "¿Me prestas tu coche?", "¿Me prestas la chaqueta azul?", 72], ["dejar", "prêter ; laisser", "¿Me dejas tu coche?", "¿Me puedes dejar tu coche?", 73], ["poner", "servir (dans un bar)", "¿Me pone un cortado?", "No se puede poner al teléfono, se está duchando.", 75], ["pedir ayuda", "demander de l'aide", "pedir ayuda"], ["pedir permiso", "demander la permission", "pedir permiso"], ["pedir un favor", "demander un service", "pedir un favor"], ["pedir dinero", "demander de l'argent", "pedir dinero"], ["pedir disculpas", "présenter ses excuses", "pedir disculpas"], ["pedir información", "demander un renseignement", "pedir información"], ["pedir algo prestado", "emprunter quelque chose", "pedir algo prestado"], ["dar las gracias", "remercier", "dar las gracias"], ["dar un abrazo", "faire une accolade", "dar un abrazo"], ["dar un beso", "faire la bise", "dar un beso"], ["dar la mano", "serrer la main", "dar la mano"], ["¿Le importaría…?", "Cela vous dérangerait-il de… ?", "muy formal"], ["¿Te importa…?", "Ça te dérange de… ?", "menos formal", "¿Te importa si apago el aire acondicionado?", 180], ["¿Me podría…?", "Pourriez-vous me… ?", "formal", "¿Me podría sujetar esto un momento?", 75], ["¿Puedes…?", "Peux-tu… ?", "informal", "¿Puedes ir al mercado y comprar fruta?", 75], ["¿Te importa si…?", "Ça te dérange si… ?", "pedir permiso", "¿Te importa si apago el aire acondicionado?", 180], ["Es que…", "C'est que…", "dar excusas o justificarse", "Esa justificación se suele introducir con es que.", 75], ["En absoluto", "Pas du tout (en…)", "conceder permiso"], ["Sin problema", "Sans problème", "conceder"], ["Enseguida", "Tout de suite", "responder en un bar"], ["Toma", "Tiens", "dar un objeto"], ["el cortado", "le café noisette", "¿Me pone un cortado?"], ["la chaqueta", "la veste", "¿Me pasas la chaqueta?", "¿Me prestas la chaqueta azul?", 72], ["el bolígrafo", "le stylo", "¿Tienes un bolígrafo?"], ["regar las plantas", "arroser les plantes", "pedir un favor"], ["sujetar", "tenir, maintenir", "¿Me podría sujetar esto?", "¿Me podría sujetar esto un momento?", 75], ["devolver", "rendre", "Mañana te los devuelvo."], ["acordarse de", "se souvenir de", "No me acordé de tu cumpleaños."], ["ducharse", "se doucher", "Se está duchando."], ["la goma de borrar", "la gomme", "¿Me prestas la goma?"], ["el caramelo", "le bonbon", "¿Me das un caramelo?"], ["el pistacho", "la pistache", "pedir pistachos"], ["los apuntes", "les notes de cours", "¿Me dejas los apuntes?"], ["la moto", "la moto", "¿Me dejas tu moto?"], ["el ordenador", "l'ordinateur", "¿Puedo usar este ordenador?"], ["el fuego", "le feu ; du feu", "¿Tienes fuego?"], ["el chicle", "le chewing-gum", "el último chicle", "¿Te importa si me como el último chicle?", 184], ["el cartel", "l'affiche", "¿Qué pone en ese cartel?"], ["la estación de tren", "la gare", "la estación más cercana", "¿Podría decirme dónde está la estación de tren más cercana?", 184], ["la caja", "le carton, la boîte", "¿Me ayudas con esta caja?", "¿me ayudas con esta caja?", 184], ["desea", "désire (formule de politesse)", "¿Qué desea?"], ["la tila", "la tisane de tilleul", "tomarse una tila"], ["quejarse", "se plaindre", "no me puedo quejar"], ["el/la desconocido/a", "l'inconnu(e)", "hablar a desconocidos"], ["la recepción", "la réception", "en la recepción del hotel"], ["subir el desayuno", "monter le petit-déjeuner", "a la habitación"], ["bajar la música", "baisser la musique", "¿Te importa bajar la música?", "¿Te importa bajar la música?", 184]], "huecos": [["No se puede poner, ___ duchando.", "se está", ["se está", "se ducha", "está", "se estar"], "ESTAR + gerundio con pronombre delante."], ["Estos días ___ el Quijote. (leer)", "estoy leyendo", ["estoy leyendo", "estoy leendo", "leo", "estoy leído"], "Vocal + -er → -yendo."], ["¿Me ___ un cortado, por favor?", "pone", ["pone", "da", "presta", "pasa"], "PONER para pedir en un bar."], ["¿Me ___ tu coche este fin de semana?", "prestas", ["prestas", "pones", "pasas", "das"], "PRESTAR para pedir un objeto ajeno."], ["No puedo ir. ___ tengo que estudiar.", "Es que", ["Es que", "Porque que", "Como que", "Por que"], "Introducir una excusa."], ["¿Te importa ___ hago una llamada?", "si", ["si", "que", "de", "cuando"], "Importar si + presente de indicativo."], ["Ahora ___ de camarero en una cafetería.", "estoy trabajando", ["estoy trabajando", "trabajaba", "estoy trabajado", "trabajaré"], "Fase temporal: estar + gerundio."], ["Perdona, ¿me ___ la sal?", "pasas", ["pasas", "pones", "prestas", "tienes"], "PASAR: acercar un objeto."]], "reto": [["Escribe el gerundio de DORMIR.", "durmiendo", "Cambio vocálico O > U en la raíz."], ["Escribe el gerundio de DECIR.", "diciendo", "Cambio vocálico E > I en la raíz."], ["Escribe el gerundio de OÍR.", "oyendo", "Vocal antes de -ir → -yendo."], ["Escribe el gerundio de IR.", "yendo", "Irregular."], ["Completa la fórmula más formal: '¿Le ___ prestarme el boli?'", "importaría", "Condicional de importar."], ["¿Qué verbo se usa para pedir algo que no vamos a devolver?", "dar", "¿Me das otro vaso de agua?"], ["Completa: 'Muchas gracias.' → '___ nada.'", "De", "Responder al agradecimiento."], ["Escribe el gerundio de LEER.", "leyendo", "Vocal antes de -er → -yendo."]]}, {"n": 6, "titulo": "Guía del ocio", "color": "#1f7a70", "tarea": "Escribir un artículo sobre las cosas más interesantes del lugar en el que vivimos", "lecciones": [{"t": "El pretérito perfecto", "c": "<table><tr><th></th><th>PRESENTE DE HABER</th><th>+ PARTICIPIO</th></tr><tr><td>yo</td><td>he</td><td rowspan='6'>visit<b>ado</b><br>com<b>ido</b><br>viv<b>ido</b></td></tr><tr><td>tú, vos</td><td>has</td></tr><tr><td>él, ella, usted</td><td>ha</td></tr><tr><td>nosotros/as</td><td>hemos</td></tr><tr><td>vosotros/as</td><td>habéis</td></tr><tr><td>ellos/as, ustedes</td><td>han</td></tr></table><p><b>Participios irregulares más frecuentes:</b></p><table><tr><td>abrir → <b>abierto</b></td><td>morir → <b>muerto</b></td><td>decir → <b>dicho</b></td></tr><tr><td>poner → <b>puesto</b></td><td>romper → <b>roto</b></td><td>escribir → <b>escrito</b></td></tr><tr><td>ver → <b>visto</b></td><td>hacer → <b>hecho</b></td><td>volver → <b>vuelto</b></td></tr></table><p class='nota'>El participio no cambia: la persona se marca con <b>haber</b>. Además, entre el auxiliar y el participio no se puede colocar nada: <i>¿<b>Has ido</b> ya al Reina Sofía?</i> (no: '¿Has ya ido…?'). <i>¿<b>Lo has leído</b>?</i> (no: '¿Has lo leído?').</p>"}, {"t": "Hablar de experiencias en el pasado", "c": "<p>Usamos el pretérito perfecto para hablar de experiencias, sin mencionar cuándo se han realizado.</p><p>• ¿<b>Has estado</b> alguna vez en Roma? ○ En Roma sí, (he estado) dos veces.</p><p>• ¿<b>Has visto</b> la última película de Icíar Bollaín? ○ Pues no. ¿Es buena?</p><p>También lo usamos cuando informamos de un hecho situándolo en un tiempo que tiene relación con el presente.</p><p>• ¿Qué <b>has hecho</b> hoy? ○ Esta mañana <b>he salido</b> a correr y luego <b>he ido</b> a clase.</p><p class='nota'>En algunos lugares de España y de América Latina se utiliza el pretérito indefinido en vez del pretérito perfecto en estos usos.</p><p>Usamos el pretérito indefinido para referirnos a una acción pasada situada en un tiempo terminado, que no llega al presente.</p><p>• ¿Qué <b>hicisteis</b> el sábado? ○ <b>Estuvimos</b> en casa de Armando.</p>"}, {"t": "YA / TODAVÍA NO", "c": "<p>Usamos <b>ya</b> para referirnos al cumplimiento de una acción esperable o previsible.</p><p><i>¿<b>Ya</b> has salido de trabajar?</i></p><p><i><b>Ya</b> he salido de trabajar. ¿Vamos al cine?</i></p><p>Usamos <b>todavía no</b> para referirnos a que no se ha cumplido una acción esperable o previsible.</p><p><i>¿<b>Todavía no</b> has salido de trabajar? Son las doce de la noche…</i></p><p><i><b>Todavía no</b> he salido de trabajar. Mejor vamos al cine mañana, ¿vale?</i></p>"}, {"t": "Hablar de intenciones y proyectos", "c": "<table><tr><td><b>IR A</b> + INFINITIVO</td><td><i>El fin de semana que viene <b>voy a ir</b> a Málaga.</i></td></tr><tr><td><b>QUERER</b> + INFINITIVO</td><td><i>¿Mañana <b>quieres ir</b> a la playa?</i></td></tr><tr><td><b>PENSAR</b> + INFINITIVO</td><td><i>Esta noche Elena y Greta <b>piensan salir</b> a cenar fuera.</i></td></tr></table><p class='nota'>También podemos usar el presente de indicativo para hablar de intenciones y de proyectos que queremos presentar como firmes o decididos: <i>Mañana cenamos en casa de Alicia.</i></p>"}, {"t": "GUSTAR, ENCANTAR y PARECER para valorar", "c": "<table><tr><td>(a mí)<br>(a ti, a vos)<br>(a él/ella/usted)<br>(a nosotros/as)<br>(a vosotros/as)<br>(a ellos/as/ustedes)</td><td>me<br>te<br>le<br>nos<br>os<br>les</td><td>ha gustado / han gustado<br>gustó / gustaron<br><br>ha encantado / han encantado<br>encantó / encantaron<br><br>ha parecido / han parecido<br>pareció / parecieron <span class='gris'>+ adjetivo / sustantivo</span></td></tr></table><p><i>¿<b>Te han gustado</b> las fotos?</i></p><p><i><b>Nos gustó</b> mucho la exposición.</i></p><p><i>A Laura <b>le ha encantado</b> este parque.</i></p><p><i>Esa película <b>nos pareció</b> divertidísima.</i></p><p><i>Los museos de Berlín <b>me parecieron</b> una maravilla.</i></p>"}, {"t": "Frases exclamativas", "c": "<table><tr><td><b>QUÉ</b> + ADJETIVO</td><td>¡<b>Qué</b> guapo / horrible / interesante…!</td></tr><tr><td><b>QUÉ</b> + SUSTANTIVO</td><td>¡<b>Qué</b> maravilla / horror / pena…!</td></tr><tr><td><b>QUÉ</b> + SUSTANTIVO + <b>TAN</b> / <b>MÁS</b> + ADJETIVO</td><td>¡<b>Qué</b> día <b>tan</b> / <b>más</b> estupendo!</td></tr></table>"}, {"t": "Referirse al futuro", "c": "<p><b>esta</b> tarde / noche…</p><p><b>este</b> jueves / viernes / sábado / fin de semana…</p><p><b>mañana</b> · <b>pasado mañana</b></p><p><b>dentro de</b> un año / dos meses / tres semanas…</p><p>el lunes / mes / año… <b>que viene</b></p><p><i><b>Este</b> fin de semana pienso descansar mucho.</i></p><p><i><b>Dentro de</b> seis semanas voy a participar en una carrera solidaria.</i></p>"}, {"t": "Léxico: valorar y actividades de ocio", "c": "<p><b>parecer</b> bonito/a · feo/a · bueno/a · interesante · increíble · espectacular · una maravilla · un horror · un rollo</p><p><b>pasarlo/a</b> bien · genial · fenomenal · mal · fatal</p><p><b>ambiente</b> agradable · acogedor · frío · relajado · cálido · único · cosmopolita · informal</p><p><b>decoración</b> sencilla · anticuada · clásica · moderna · cuidada · original</p><p><b>servicio</b> amable · antipático · eficiente · rápido · lento</p><p><b>precios</b> económicos · buenos · medios · altos · excesivos · ajustados</p><p><b>Culturales:</b> ir al cine / teatro · ir a museos / conciertos · ver series / películas · escuchar música · tocar el violín / la flauta · hacer fotografías · leer · pintar</p><p><b>Deportivas:</b> hacer submarinismo / senderismo · practicar yoga / natación · ir al gimnasio · ir en bici · ir / salir a correr · montar a caballo · jugar al fútbol / baloncesto / voleibol · ver un partido · participar en una carrera / un maratón</p><p><b>Sociales:</b> jugar a los bolos / las cartas · ir a un restaurante · ir a un bar · ir de copas · tomar un café / una cerveza / algo · pasar un rato con amigos/as · salir a cenar / comer fuera · bailar</p>"}], "vocab": [["parecer interesante", "sembler intéressant", "valorar experiencias"], ["parecer increíble", "sembler incroyable", "valorar experiencias"], ["parecer espectacular", "sembler spectaculaire", "valorar experiencias"], ["una maravilla", "une merveille", "Me pareció una maravilla.", "¡Nos pareció una maravilla!", 86], ["un horror", "une horreur", "Me pareció un horror."], ["un rollo", "barbant, rasoir", "Me pareció un rollo.", "Mañana me voy dos meses de vacaciones a un rollo Nueva Zelanda y Austral ia.", 191], ["pasarlo genial", "passer un moment génial", "pasarlo genial / fenomenal"], ["pasarlo fenomenal", "passer un moment formidable", "pasarlo fenomenal"], ["el ambiente", "l'ambiance", "un ambiente agradable", "¿Qué adjetivos y expresiones se usan para describir lugares y su ambiente?", 186], ["relajado/a", "détendu", "un ambiente relajado"], ["cálido/a", "chaleureux", "un ambiente cálido"], ["único/a", "unique", "un ambiente único"], ["cosmopolita", "cosmopolite", "un ambiente cosmopolita"], ["informal", "décontracté", "un ambiente informal"], ["la decoración", "la décoration", "una decoración sencilla"], ["sencillo/a", "simple, sobre", "una decoración sencilla"], ["anticuado/a", "démodé", "una decoración anticuada"], ["cuidado/a", "soigné", "una decoración cuidada", "Pero bueno, una amiga que fue el año pasado me ha dicho también que hay que tener cuidado con los monos.", 190], ["el servicio", "le service", "un servicio amable"], ["amable", "aimable", "un servicio amable"], ["antipático/a", ento!"], ["impresionante", "impressionnant", "una vista impresionante"], ["de un tirón", "d'une traite (de…)", "Lo leí de un tirón."], ["la ceremonia", "la cérémonie", "una ceremonia de premios", "Mañana tengo que asistir a una ceremonia de premios y no me apetece nada.", 191], ["tocar la lotería", "gagner au loto", "Le ha tocado la lotería."], ["la reserva biológica", "la réserve naturelle", "Monteverde"], ["los deportes de aventura", "les sports d'aventure", "hacer deportes de aventura"]], "huecos": [["¿___ has probado la paella valenciana?", "Ya", ["Ya", "Todavía", "Siempre", "Nunca"], "Acción esperable ya cumplida."], ["___ no he visitado el Museo del Prado.", "Todavía", ["Todavía", "Ya", "Siempre", "Antes"], "Acción esperable no cumplida."], ["Este fin de semana ___ a ir al teatro.", "vamos", ["vamos", "voy", "van", "va"], "IR A + infinitivo, primera persona plural."], ["Los museos de Berlín me ___ una maravilla.", "parecieron", ["parecieron", "pareció", "parecí", "parecen"], "Sujeto plural en indefinido."], ["Esta mañana ___ a correr y luego he ido a clase.", "he salido", ["he salido", "salí", "he salida", "salía"], "Tiempo relacionado con el presente."], ["¿Has ___ la última película de Bollaín?", "visto", ["visto", "vido", "veído", "ver"], "Participio irregular de VER."], ["¡Qué día ___ estupendo!", "tan", ["tan", "muy", "más que", "mucho"], "QUÉ + sustantivo + TAN / MÁS + adjetivo."], ["___ de seis semanas voy a participar en un maratón.", "Dentro", ["Dentro", "Después", "Antes", "Durante"], "Dentro de + cantidad de tiempo futura."]], "reto": [["Escribe el participio de ESCRIBIR.", "escrito", "Participio irregular."], ["Escribe el participio de VOLVER.", "vuelto", "Participio irregular."], ["Escribe el participio de ROMPER.", "roto", "Participio irregular."], ["Escribe el participio de PONER.", "puesto", "Participio irregular."], ["Conjuga el pretérito perfecto de VISITAR en la primera persona del plural.", "hemos visitado", "HABER + participio."], ["Completa: 'Esta noche Elena y Greta ___ salir a cenar.' (pensar)", "piensan", "PENSAR + infinitivo, E > IE."], ["¿Cómo se dice 'the day after tomorrow'?", "pasado mañana", "Marcador temporal de futuro."], ["Completa: 'A Laura ___ ha encantado este parque.'", "le", "Pronombre de tercera persona."]]}, {"n": 7, "titulo": "¿Comes de todo?", "color": "#2a6f97", "tarea": "Preparar una cena para una fiesta con toda la clase", "lecciones": [{"t": "Formas impersonales: SE + 3.ª persona", "c": "<p>Cuando no podemos o no nos interesa especificar quién realiza una acción, utilizamos formas impersonales. Se usan para dar instrucciones o para hacer generalizaciones.</p><p><i>Primero, <b>se lavan</b> y <b>se pelan</b> las frutas, y luego…</i></p><p><i>En este restaurante <b>se come</b> muy bien.</i></p><table><tr><td>lavar → <b>se lava/n</b></td><td>calentar → <b>se calienta/n</b></td></tr><tr><td>congelar → <b>se congela/n</b></td><td>asar → <b>se asa/n</b></td></tr><tr><td>pelar → <b>se pela/n</b></td><td>cocer → <b>se cuece/n</b></td></tr><tr><td>echar → <b>se echa/n</b></td><td>hacer → <b>se hace/n</b></td></tr><tr><td>cortar → <b>se corta/n</b></td><td>freír → <b>se fríe/n</b></td></tr></table><p><b>HAY QUE</b> + INFINITIVO: <i><b>Hay que</b> calentar mucho el aceite.</i></p><p>También podemos usar la segunda persona del singular: <i>Mira, <b>pones</b> aceite en una sartén, luego <b>echas</b> un diente de ajo…</i></p>"}, {"t": "Pronombres de objeto directo (OD)", "c": "<p>Aparecen cuando, por el contexto, ya está claro cuál es el OD del verbo.</p><table><tr><th></th><th>SINGULAR</th><th>PLURAL</th></tr><tr><td>masculino</td><td><b>lo</b></td><td><b>los</b></td></tr><tr><td>femenino</td><td><b>la</b></td><td><b>las</b></td></tr></table><p>• ¿Dónde está la miel? ○ <b>La</b> he guardado en el armario.</p><p>• ¿Están buenas las manzanas? ○ No sé, no <b>las</b> he probado.</p><p>• ¿Has traído los libros de cocina? ○ No, <b>los</b> he dejado en casa.</p><p class='nota'>Los pronombres siempre van antes del verbo (<i>la he guardado</i>), pero no con los infinitivos (<i>hay que guardar<b>la</b></i>, <i>hay que poner<b>lo</b></i>). Con infinitivos se escribe en una sola palabra.</p>"}, {"t": "Más sobre los pronombres OD", "c": "<p><b>Lo</b> también puede sustituir a una parte del texto o a <b>esto, eso, aquello, algo</b>…</p><p>• ¿Sabes que van a abrir un restaurante nuevo? ○ Sí, <b>lo</b> he leído en el periódico.</p><p>• ¿Qué es esto? ○ Creo que es un regalo para ti. <b>Lo</b> ha traído Luis.</p><p>También usamos los pronombres cuando el OD está antes del verbo.</p><p><i>El pescado <b>lo</b> he preparado yo, pero la tarta <b>la</b> he comprado.</i></p><p class='nota'>No usamos los pronombres cuando el OD no lleva determinantes (artículos, posesivos, demostrativos): • ¿Quieres verdura? ○ No, no quiero. (no: 'No, no la quiero.')</p>"}, {"t": "Conectores: Y / NI / PERO / ADEMÁS", "c": "<p><b>Y</b> añade un segundo elemento similar al primero.</p><p><i>Es un restaurante muy bonito <b>y</b> muy moderno.</i></p><p><b>Ni</b>: cuando el primer elemento es negativo, añade un segundo elemento también negativo. También es posible usar <b>ni</b> en los dos elementos.</p><p><i><b>No</b> es un restaurante muy bonito <b>ni</b> muy moderno.</i></p><p><i><b>Ni</b> es un restaurante muy bonito <b>ni</b> muy moderno.</i></p><p><b>Pero</b> añade un segundo elemento que presentamos como contrapuesto al primero.</p><p><i>Es un restaurante muy bonito, <b>pero</b> la comida es horrible.</i></p><p><b>Además</b> añade un segundo elemento similar al primero, que lo refuerza.</p><p><i>Es un restaurante muy bonito y, <b>además</b>, los camareros son muy simpáticos.</i></p>"}, {"t": "SOLER + infinitivo", "c": "<p>Usamos <b>soler</b> + infinitivo para hablar de hábitos.</p><p><i>Yo <b>suelo</b> desayunar tostadas con aceite y café.</i></p><p><i>Tú no <b>sueles</b> comer mucho para cenar, ¿no?</i></p><p><i>En mi país la gente <b>suele</b> llevar algo de bebida a las fiestas.</i></p><p><i>No <b>solemos</b> hacer comidas familiares en casa, siempre vamos a un restaurante.</i></p><p class='nota'>SOLER es un verbo con cambio vocálico O &gt; UE: suelo, sueles, suele, solemos, soléis, suelen.</p>"}, {"t": "SER / ESTAR con la comida", "c": "<p>Para hacer una descripción o una valoración de algo, usamos el verbo <b>ser</b>.</p><p><i>Los quesos extremeños <b>son</b> excelentes.</i></p><p>Pero para comentar una experiencia directa, usamos <b>estar</b>.</p><p><i>¡Qué bueno <b>está</b> este queso!</i> (= Lo estoy comiendo ahora.)</p>"}, {"t": "Léxico: pesos, medidas y envases", "c": "<p>1 kg (<b>un kilo</b>) de arroz · 1/2 kg (<b>medio kilo</b>) de azúcar · 1/4 kg (<b>un cuarto de kilo</b>) de café · 200 g (<b>gramos</b>) de harina · 1 l (<b>un litro</b>) de aceite · 1/2 l (<b>medio litro</b>) de agua</p><p><b>Envases:</b> un cartón · una botella · una caja · una bolsa · una lata · un paquete · un bote · una docena · una bandeja</p><p><b>Utensilios:</b> sartén · bol · olla / cazuela · escurridor · tabla de cortar · cucharón · cuchara de madera · cuchillo</p><p><b>Verbos de cocina:</b> pelar · cortar · lavar · echar · añadir · mezclar · licuar / triturar · calentar · cocer / hervir · freír · congelar · batir · asar · servir</p>"}, {"t": "Léxico: hábitos alimentarios", "c": "<p><b>ser</b> vegetariano/a · vegano/a · crudívoro/a · flexitariano/a · celíaco/a</p><p><b>ser alérgico/a a</b> el marisco (al marisco) · la soja · los frutos secos</p><p><b>ser intolerante a</b> el gluten (al gluten) · la lactosa</p><p><b>comer</b> de todo · bien · mal · sano</p><p><b>perder / ganar</b> peso · kilos</p><p><b>comprar</b> al peso · a granel</p><p><b>seguir una dieta</b> sana · mediterránea</p><p><b>una dieta a base de</b> hidratos de carbono · proteínas · frutas y verduras</p><p><b>saltarse</b> una comida</p><p><b>tener</b> hidratos de carbono · proteínas · grasas · calcio · hierro</p><p><b>alimentos</b> frescos · procesados · congelados</p><p class='nota'>* a + el = <b
