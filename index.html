nsumo.", 196], ["airear", "aérer", "airear el vino"], ["la legumbre", "le légume sec", "poner las legumbres en remojo"], ["el vinagre", "le vinaigre", "aceite y vinagre"], ["hacer a la plancha", "cuire à la plancha", "hacer el pescado a la plancha"], ["el embutido", "la charcuterie", "carne y embutidos"], ["los productos lácteos", "les produits laitiers", "grupos de alimentos"], ["el cereal", "la céréale", "los cereales"], ["el condimento", "le condiment", "condimentos y salsas"], ["la bollería industrial", "les viennoiseries industrielles", "no consumir a diario"], ["la ración", "la portion", "cinco raciones al día"], ["ecológico/a", "bio", "productos ecológicos"], ["salado/a", "salé", "El arroz está salado."], ["ligero/a", "léger", "galletas muy ligeras"]], "huecos": [["Primero ___ las patatas y luego se cortan.", "se pelan", ["se pelan", "se pela", "pelan", "se pelando"], "Impersonal con sujeto plural."], ["¿Dónde está la miel? — ___ he guardado en el armario.", "La", ["La", "Lo", "Le", "Las"], "OD femenino singular."], ["¿Has traído los libros? — No, ___ he dejado en casa.", "los", ["los", "las", "les", "lo"], "OD masculino plural."], ["No es un restaurante bonito ___ moderno.", "ni", ["ni", "y", "pero", "además"], "Elemento negativo añadido."], ["Yo ___ desayunar tostadas con café.", "suelo", ["suelo", "solo", "sueles", "soler"], "SOLER: O > UE."], ["¡Qué bueno ___ este queso!", "está", ["está", "es", "tiene", "hay"], "Experiencia directa: ESTAR."], ["Hay que calentar el aceite y luego ___ un diente de ajo.", "echar", ["echar", "echas", "se echa", "echa"], "Tras HAY QUE, infinitivo."], ["Soy alérgico ___ marisco.", "al", ["al", "a el", "del", "en el"], "a + el = al."]], "reto": [["Escribe la forma impersonal de FREÍR en plural.", "se fríen", "SE + tercera persona plural."], ["Escribe la forma impersonal de COCER en singular.", "se cuece", "Cambio vocálico O > UE."], ["Completa: 'Hay que guardar___.' (la miel)", "guardarla", "El pronombre se une al infinitivo."], ["Conjuga SOLER en la primera persona del plural.", "solemos", "Sin cambio vocálico en nosotros."], ["¿Qué conector añade un elemento contrapuesto?", "pero", "Es bonito, pero la comida es horrible."], ["¿Qué conector refuerza añadiendo un elemento similar?", "además", "Y, además, los camareros son simpáticos."], ["Escribe el pronombre OD para 'las manzanas'.", "las", "Femenino plural."], ["¿Cómo se llama el utensilio para escurrir la pasta?", "el escurridor", "Utensilios de cocina."]]}, {"n": 8, "titulo": "Estamos muy bien", "color": "#3a5f9e", "tarea": "Hacer una presentación sobre un mal del siglo XXI", "lecciones": [{"t": "El verbo DOLER", "c": "<table><tr><td>me<br>te<br>le<br>nos<br>os<br>les</td><td><b>duele</b></td><td>la cabeza. <span class='gris'>(nombre en singular)</span></td></tr><tr><td></td><td><b>duelen</b></td><td>las muelas. <span class='gris'>(nombre en plural)</span></td></tr></table><p class='nota'>Funciona como GUSTAR: el sujeto es la parte del cuerpo. Cambio vocálico O &gt; UE.</p>"}, {"t": "SER y ESTAR", "c": "<p><b>SER — identificar, definir y describir</b> (qué / quién es y cómo es algo o alguien)</p><p><i>Carlos <b>es</b> un amigo del colegio. / Sandra <b>es</b> dentista. / Yuri <b>es</b> sueco, pero sus padres <b>son</b> rusos. / <b>Es</b> un chico muy guapo.</i></p><p><b>ESTAR — hablar de cómo está algo o alguien</b></p><p><i>El novio de Tania <b>está</b> un poco raro últimamente: <b>está</b> triste, de mal humor y, además, <b>está</b> muy delgado… / La calle <b>está</b> sucia.</i></p><p><b>ESTAR — indicar la posición</b></p><p><i><b>Estoy</b> muchas horas sentada. / La torre de Pisa <b>está</b> inclinada.</i></p><p><b>ESTAR + gerundio</b></p><p><i>Últimamente <b>estoy</b> durmiendo fatal.</i></p>"}, {"t": "Reglas prácticas de SER / ESTAR", "c": "<p>Los nombres siempre van con <b>ser</b>: <i><b>Es</b> un amigo. / <b>Es</b> Carlos.</i></p><p>Los participios siempre van con <b>estar</b>: <i>La puerta <b>está</b> abierta. / Las ventanas <b>están</b> cerradas.</i></p><p>Los adverbios (<b>bien</b>, <b>mal</b>…) siempre van con <b>estar</b>: <i><b>Está</b> muy bien.</i></p><p>Algunos adjetivos que se usan para describir (con <b>ser</b>), a veces se pueden combinar con <b>estar</b>, para indicar que algo ha sucedido, que las circunstancias han cambiado.</p><p><i>Pepe no <b>es</b> muy guapo… pero se ha cortado el pelo y <b>está</b> más guapo.</i></p><p><i><b>Soy</b> una persona paciente, pero ahora <b>estoy</b> impaciente por saber la nota del examen.</i></p>"}, {"t": "El imperativo afirmativo", "c": "<table><tr><th></th><th>COMPRAR</th><th>COMER</th><th>VIVIR</th></tr><tr><td>tú, vos</td><td>compra, comprá</td><td>come, comé</td><td>vive, viví</td></tr><tr><td>vosotros/as</td><td>comprad</td><td>comed</td><td>vivid</td></tr><tr><td>usted</td><td>compre</td><td>coma</td><td>viva</td></tr><tr><td>ustedes</td><td>compren</td><td>coman</td><td>vivan</td></tr></table><p>La forma <b>tú</b> es igual que la del presente, sin la <b>-s</b> final: compras → <b>compra</b> · comes → <b>come</b> · vives → <b>vive</b></p><p>La forma <b>vosotros/as</b> es igual que el infinitivo, pero acabado en <b>-d</b>: comprar → <b>comprad</b> · comer → <b>comed</b> · vivir → <b>vivid</b></p><p>Las formas <b>usted</b> y <b>ustedes</b> cambian la última vocal: -a se convierte en -e y -e se convierte en -a: compra → <b>compre/n</b> · come → <b>coma/n</b> · vive → <b>viva/n</b></p>"}, {"t": "Imperativos irregulares y pronombres", "c": "<p>Los verbos con irregularidades <b>e &gt; ie</b>, <b>o &gt; ue</b> y <b>e &gt; i</b> en presente las mantienen en las formas de tú, usted y ustedes:</p><p>piensas → <b>piensa</b> · duerme → <b>duerma</b> · piden → <b>pidan</b></p><p><b>Irregulares en la forma TÚ:</b></p><table><tr><td>poner → <b>pon</b></td><td>tener → <b>ten</b></td><td>ser → <b>sé</b></td><td>salir → <b>sal</b></td></tr><tr><td>hacer → <b>haz</b></td><td>venir → <b>ven</b></td><td>ir → <b>ve</b></td><td>decir → <b>di</b></td></tr></table><p>Con el imperativo, los pronombres van <b>después</b> del verbo:</p><p><i><b>Lávate</b> bien los pies e <b>hidrátalos</b> cada día.</i></p><p class='nota'>Con la forma vosotros, si el pronombre es -os, desaparece la -d: <i>Niños, <b>lavaos</b> las manos antes de comer.</i> (no: 'lavados')</p>"}, {"t": "Algunos usos del imperativo", "c": "<p><b>Recomendar y aconsejar</b></p><p><i><b>Ponte</b> protector solar. / <b>Camina</b> 30 minutos al día. / <b>Haz</b> deporte tres veces a la semana. / <b>Vete</b> de vacaciones y <b>relájate</b>.</i></p><p><b>Dar instrucciones</b></p><p><i><b>Ponte</b> la mascarilla y <b>espera</b> dos horas. Luego, <b>lávate</b> bien la cara con agua tibia.</i></p>"}, {"t": "Dar consejos (otras estructuras)", "c": "<table><tr><td rowspan='2'>(<b>Para</b> adelgazar)<br>(<b>Si quiere/s</b> adelgazar,)</td><td><b>CONSEJOS IMPERSONALES</b><br><b>lo mejor es</b> hacer deporte.<br><b>va (muy) bien</b> desayunar fruta.<br><b>van (muy) bien</b> las infusiones.</td></tr><tr><td><b>CONSEJOS PERSONALES</b><br><b>tiene/s que</b> comer menos.<br><b>debe/s</b> hacer más deporte.<br><b>debería/s</b> andar más.<br><b>puede/s</b> hacer una dieta.</td></tr></table>"}, {"t": "Léxico: el cuerpo, enfermedades y ánimo", "c": "<p><b>Partes del cuerpo:</b> el pelo · la cabeza · la cara · el ojo · la nariz · la boca · el cuello · el hombro · el pecho · la espalda · el brazo · el codo · la mano · el vientre / la barriga · la pierna · la rodilla · el tobillo · el pie</p><p><b>tener</b> tos · fiebre · náuseas · migraña · asma · insomnio · (la) gripe · otitis · neumonía · la covid-19 · anemia</p><p><b>tener dolor de</b> cabeza · estómago · garganta · espalda · muelas</p><p><b>doler</b> el pecho · la rodilla · los pies</p><p><b>estar</b> enfermo/a · resfriado/a · mareado/a · pálido/a · afónico/a</p><p><b>Estados de ánimo (estar):</b> enfadado/a · sorprendido/a · contento/a · triste · impaciente · aburrido/a · pensativo/a · estresado/a · asustado/a · nervioso/a · cansa td>ibais</td><td>veíais</td></tr><tr><td>ellos/as, ustedes</td><td>eran</td><td>iban</td><td>veían</td></tr></table><p><i>Cuando <b>éramos</b> niños, <b>vivíamos</b> en un piso del centro. <b>Era</b> muy grande.</i></p>"}, {"t": "Marcadores temporales para el pasado", "c": "<table><tr><td><b>de niño/a</b></td><td><b>de joven</b></td></tr><tr><td><b>a los</b> 15 años</td><td><b>cuando tenía</b> 33 años</td></tr></table><p>• ¿Cómo eras <b>de niño</b>? ○ Era un niño muy normal, creo.</p><p>Para referirnos a una época de la que ya hemos hablado anteriormente:</p><table><tr><td><b>en esa / aquella época</b></td><td><b>entonces</b></td></tr><tr><td><b>en aquellos tiempos</b></td><td><b>antes</b></td></tr></table><p><i>Yo, de niño, leía mucho. Como <b>en aquella época</b> no teníamos televisión en casa…</i></p>"}, {"t": "Marcadores temporales para el presente", "c": "<table><tr><td><b>hoy en día</b></td><td><b>actualmente</b></td></tr><tr><td><b>en estos momentos</b></td><td><b>ahora</b></td></tr></table><p><i>Antes la gente no viajaba mucho porque era caro; <b>hoy en día</b> viajar en avión es mucho más barato.</i></p>"}, {"t": "YA NO / TODAVÍA + presente", "c": "<p>Usamos <b>ya no</b> para expresar la interrupción de una acción o de un estado.</p><p><i><b>Ya no</b> vivo en Madrid.</i> (= Antes vivía en Madrid y ahora no.)</p><p>Usamos <b>todavía</b> para expresar la continuidad de una acción o de un estado.</p><p><i><b>Todavía</b> vivo en Madrid.</i> (= Antes vivía en Madrid y sigo viviendo allí.)</p>"}, {"t": "Argumentar y debatir", "c": "<table><tr><td><b>Presentar una opinión</b><br><i>Yo creo / Pienso que los viajes son mucho mejores hoy en día.</i></td><td><b>Aceptar una opinión</b><br><i>Estoy de acuerdo.</i><br><i>(Sí), es cierto / verdad.</i><br><i>(Sí), claro / evidentemente.</i></td></tr><tr><td><b>Dar un ejemplo</b><br><i>Por ejemplo, antes había menos seguridad en el transporte.</i></td><td><b>Rechazar una opinión</b><br><i>(Bueno), yo no estoy de acuerdo (con eso).</i><br><i>Yo creo que no.</i></td></tr><tr><td><b>Dar un elemento nuevo para reforzar una opinión</b><br><i>Además, era mucho más caro y solo viajaban personas con mucho dinero.</i></td><td><b>Mostrar acuerdo parcial y matizar</b><br><i>Bueno, sí, pero antes eran más emocionantes.</i><br><i>Eso depende.</i><br><i>Ya, pero ahora está todo tan globalizado que ya no puedes conocer la cultura de un lugar.</i></td></tr></table>"}, {"t": "Léxico: épocas y periodos históricos", "c": "<p><b>En el siglo</b> XX · <b>A principios del siglo</b> XX · <b>A mediados del siglo</b> XX · <b>A finales del siglo</b> XX</p><p><b>En los años</b> 20 / <b>En la década de los</b> 20 · <b>En</b> 1939</p><p><b>A principios de</b> los años 50 · <b>A mediados de</b> los años 50 · <b>A finales de</b> los años 50</p><p><b>la antigua</b> Roma / Grecia · <b>el antiguo</b> Egipto · <b>la época de</b> Franco / Carlos V · <b>la época</b> clásica / medieval · <b>el Imperio</b> romano / inca / otomano / chino</p>"}, {"t": "Léxico: historia, sociedad y etapas de la vida", "c": "<p><b>Derechos:</b> el divorcio · la libertad de expresión · los/las presos/as políticos/as · exiliados/as · la igualdad de oportunidades · la igualdad entre hombres y mujeres · la educación · la propiedad · la nacionalidad · el salario · el ocio · la salud</p><p><b>Tipos de gobierno:</b> la democracia · la dictadura · la república · la monarquía</p><p><b>Acciones:</b> aprobar una ley · (i)legalizar un partido político · acoger a exiliados / refugiados · reconocer la oficialidad de un idioma · prohibir películas / libros</p><p><b>Hitos:</b> la invención de la rueda / la imprenta / las vacunas / el telescopio / la pólvora · el descubrimiento del fuego / la electricidad / el ADN / la penicilina · la aparición del turismo / el dinero / los medios de comunicación</p><p><b>Etapas de la vida:</b> un/a bebé · un/a niño/a · un/a adolescente · un/a joven · un/a adulto/a · un hombre / una mujer · un señor / una señora · una persona inales."]]}, {"n": 10, "titulo": "Momentos especiales", "color": "#b0446a", "tarea": "Contar anécdotas personales", "lecciones": [{"t": "Irregulares con cambio vocálico", "c": "<p>Los verbos de la tercera conjugación (<b>-ir</b>) que tienen cambios vocálicos en presente (morir &gt; muero; sentir &gt; siento) presentan también un cambio vocálico en indefinido, pero solo en la <b>tercera persona del singular</b> y en la <b>tercera del plural</b>.</p><table><tr><th></th><th>PEDIR</th><th>SENTIR</th><th>DORMIR</th></tr><tr><td>yo</td><td>pedí</td><td>sentí</td><td>dormí</td></tr><tr><td>tú, vos</td><td>pediste</td><td>sentiste</td><td>dormiste</td></tr><tr><td>él, ella, usted</td><td>p<b>i</b>dió</td><td>s<b>i</b>ntió</td><td>d<b>u</b>rmió</td></tr><tr><td>nosotros/as</td><td>pedimos</td><td>sentimos</td><td>dormimos</td></tr><tr><td>vosotros/as</td><td>pedisteis</td><td>sentisteis</td><td>dormisteis</td></tr><tr><td>ellos/as, ustedes</td><td>p<b>i</b>dieron</td><td>s<b>i</b>ntieron</td><td>d<b>u</b>rmieron</td></tr></table>"}, {"t": "Verbos con raíz irregular", "c": "<table><tr><th></th><th>ESTAR</th></tr><tr><td>yo</td><td>est<b>u</b>ve*</td></tr><tr><td>tú, vos</td><td>estuv<b>iste</b></td></tr><tr><td>él, ella, usted</td><td>estuv<b>o</b>*</td></tr><tr><td>nosotros/as</td><td>estuv<b>imos</b></td></tr><tr><td>vosotros/as</td><td>estuv<b>isteis</b></td></tr><tr><td>ellos/as, ustedes</td><td>estuv<b>ieron</b></td></tr></table><p class='nota'>* En la primera y en la tercera personas, la sílaba tónica no está en la terminación (como en los regulares), sino en la raíz.</p><p><b>Raíces:</b> saber → sup- · tener → tuv- · querer → quis- · poner → pus- · venir → vin- · poder → pud- · hacer → hiz-/hic- · haber → hub-</p><table><tr><th></th><th>SER / IR</th></tr><tr><td>yo</td><td>fui</td></tr><tr><td>tú, vos</td><td>fuiste</td></tr><tr><td>él, ella, usted</td><td>fue</td></tr><tr><td>nosotros/as</td><td>fuimos</td></tr><tr><td>vosotros/as</td><td>fuisteis</td></tr><tr><td>ellos/as, ustedes</td><td>fueron</td></tr></table>"}, {"t": "Pretérito indefinido / imperfecto", "c": "<p>Cuando hablamos de acontecimientos que ocurrieron en el pasado, podemos usar los dos tiempos. Con el <b>pretérito indefinido</b> narramos acontecimientos que hacen avanzar la historia. Con el <b>pretérito imperfecto</b> describimos; la historia se detiene y prestamos atención a lo que pasa alrededor de los acontecimientos.</p><p><i><b>Visitó</b> Madrid por primera vez en 1988. <u>Era verano y hacía mucho calor</u>.</i></p><p><i><u>Mi madre era una cocinera excelente</u>, así que <b>aprendí</b> a cocinar en casa.</i></p>"}, {"t": "ESTAR + gerundio en pasado", "c": "<p><b>Pretérito indefinido + gerundio:</b> cuando nos referimos a un periodo de tiempo delimitado. Muchas veces especificamos la duración o cuándo empieza y cuándo termina esa acción.</p><p><i>Ayer <b>estuve hablando</b> con Paco. ¡Se casa el mes que viene!</i></p><p><i>El martes <b>estuve</b> todo el día <b>pensando</b> en Marta.</i></p><p><i>Carlos <b>estuvo ensayando</b> una canción dos meses.</i></p><p><b>Pretérito imperfecto + gerundio:</b> cuando describimos las circunstancias de un hecho pasado en su desarrollo.</p><p><i><b>Estaba hablando</b> con Paco y, de repente, me dio un regalo.</i></p><p><i>Cuando Marta me llamó, <b>estaba pensando</b> en ella.</i></p><p><i><b>Estaba tocando</b> la batería y por eso no oí tu llamada.</i></p>"}, {"t": "Marcadores para relatar", "c": "<table><tr><td><b>Una vez / Un día / El otro día</b></td></tr><tr><td><b>(Y) entonces / (Y) en ese momento</b></td></tr><tr><td><b>Luego / Más tarde</b></td></tr><tr><td><b>(Un tiempo / Poco…) después</b></td></tr><tr><td><b>De repente</b></td></tr><tr><td><b>Resulta que</b></td></tr></table><p><i><b>El otro día</b> me pasó una cosa increíble. Llegué a casa, abrí la puerta y, <b>entonces</b>, oí un ruido raro. <b>Luego</b>, cuando estaba en la cocina, oí otro ruido y, <b>de repente</b>, llamaron a la puerta…</i></p>"}, {"t": "Hablar de recuerdos y momentos vividos", "c": "<p><b>recordar</b> perfectamente · con todo detalle</p><p><b>un recuerdo</b> intenso</p><p><b>fue (un momento)</b> especial · emocionante · estupendo · formidable · increíble · sorprendente · horrible</p>"}, {"t": "Léxico: acontecimientos históricos", "c": "<p><b>Conflictos:</b> una guerra · una revolución · una rebelión · un atentado · una crisis (política / económica / medioambiental…) · un enfrentamiento · un golpe de Estado · un bombardeo · un asesinato · una manifestación</p><p><b>Catástrofes naturales:</b> un tsunami · un terremoto · un huracán · un incendio · una epidemia · una pandemia</p><p><b>Otros:</b> un accidente (nuclear / de tráfico) · un discurso · un descubrimiento · un invento · un viaje</p>"}, {"t": "Léxico: hablar de emociones", "c": "<p><b>llorar</b> · <b>reír</b> · <b>enfadarse</b> · <b>emocionarse</b></p><p><i>Ayer Noah perdió su trabajo y estaba muy triste. <b>Lloró</b> mucho.</i></p><p><i>Mi amiga Celia es superdivertida. El otro día me contó una de sus anécdotas y <b>me reí</b> muchísimo.</i></p><p><i>Ayer perdí un archivo de mi trabajo. <b>Me enfadé</b> muchísimo.</i></p><p><i>Mi hija me dijo que me quería y <b>me emocioné</b>.</i></p><p><b>pasar / tener</b> miedo · vergüenza · nervios</p><p><b>dar</b> miedo · vergüenza · pena</p><p><b>ponerse</b> nervioso/a · triste · contento/a · rojo/a</p><p><b>llorar</b> de alegría · de emoción · <b>tener</b> un ataque de risa</p><p><b>Reaccionar:</b> ¡Qué emoción! · ¡Qué vergüenza! · ¡Qué nervios! · ¡Qué miedo! · ¡Qué bien! · ¡Qué alegría! · ¡Qué pena!</p>"}], "vocab": [["recordar", "se souvenir de", "recordar perfectamente"], ["con todo detalle", "dans les moindres détails (con…)", "recordar con todo detalle"], ["el recuerdo", "le souvenir", "un recuerdo intenso"], ["intenso/a", "intense", "un recuerdo intenso"], ["emocionante", "émouvant", "fue un momento emocionante"], ["estupendo/a", "formidable", "fue un momento estupendo"], ["formidable", "extraordinai const AUXILIARES = [{"n": "Ser y estar", "fr": "Apéndice del libro · págs. 227-228", "uso": "<p><b>SER</b></p><p><p>Con sustantivos siempre se usa ser, para identificar, definir y describir personas o cosas.<br>· Esta es Laura (identificar)<br>· Laura es traductora. (profesión)<br>· Laura es mi hermana. (relación)<br>· ¿Esto es una silla o un sillón? (identificar)</p><p>También se usa siempre ser con adjetivos o preposiciones que expresan relaciones de posesión, nacionalidad o procedencia.<br>· ¿Este es !!!_ libro o el de Laura?<br>· Tus amigos son de Rusia, ¿verdad?<br>· Esta película es sueca.</p><p>Ytambién usamos ser con adjetivos o preposiciones que expresan características que no dependen de las circunstancias. - materia, sabor, color, tema .. .<br>· El pastel es de chocolate<br>· El jersey que quiero es azul oscuro.<br>· Esta mesa es de madera y la tuya es de metal.<br>· La película es sobre la guerra doscientos veintisiete 227 -tamaño, forma, edad, personalidad ...<br>· El pastel es grande y redondo<br>· Mi hermana es más ¡oven que yo<br>· La casa es bastante antigua.<br>· Es inteligente, pero es demasiado tímido ESTAR</p><p>Con adverbios (bien, mal, cerca, lejos...) y con participios (enfadado, sentado, roto ... ) siempre se usa estar, para indicar... - el lugar donde está algo o alguien (con adverbios o preposiciones).<br>· Tu casa está cerca de la escuela<br>· ¿Estás en casa ahora?, ¿puedo ir1<br>· ¿Dónde están las llaves? - su postura o posición (con participios o preposiciones).<br>· Tu amiga está sentada en esa mesa.<br>· Es mejor estar de pie para cantar<br>· Este cuadro está torcido.<br>· No es bueno beber si estás tumbado - su estado de ánimo o estado físico (con participios o preposiciones).<br>· Hola, ¿cómo estás?<br>· Bien, estuve resfriada, pero ahora estoy mejor.<br>· ¡Qué bien' Estoy muy contenta de verte.<br>· Tu amiga está enfadada porque llegas tarde. Además, está enferma y quiere volver a casa<br>· El ordenador está estropeado, creo que tiene un virus. YMaría está de mal humor _ SER, YTAMBIÉN ESTAR</p><p>Algunos adjetivos que se usan para describir (con ser), a veces se pueden combinar con estar, para indicar que algo ha sucedido, que las circunstancias han camb iado. Entonces, tiene sentido preguntar \"¿qué ha pasado?\", \"¿por qué ahora está así?\".<br>· Pepe está más guapo, ¿verdad? Pues ahora se ha cortado 0 Sí, se ha coitado el pelo y así está mejor el pelo y lleva barba; y está más guapo.<br>· Este pastel está salado, ¿qué has hecho? (= Los pasteles normalmente son dulces).<br>· Soy una persona paciente, pero cuando hago un examen, siempre estoy impaciente porsaber la nota 228 doscientos veintiocho</p>"}, {"n": "Hay o está", "fr": "Apéndice del libro · pág. 223", "uso": "<p>El cuadro de los artículos del apéndice opone las dos formas:</p><p><b>Expresar existencia y ubicación</b><br>· El libro <b>está</b> aquí, en la mesa. <span class='gris'>(artículo determinado: se sabe cuál)</span><br>· <b>Hay</b> un libro en la mesa. <span class='gris'>(artículo indeterminado: se menciona por primera vez)</span><br>· En la mesa <b>hay</b> libros. · En la mesa <b>hay</b> agua. <span class='gris'>(sin artículo)</span></p><p><b>Hay</b> es la forma impersonal de <i>haber</i>: es invariable y no tiene sujeto. <b>Estar</b> sitúa algo que ya conocemos.</p><p>pág. 223</p>"}, {"n": "Conjugación de ser", "fr": "Tablas del libro · pág. 253", "uso": "<p>Gerundio: <b>siendo</b> · Participio: <b>sido</b></p><p>Tal como aparece en las tablas de conjugación del libro. La forma de imperativo de <i>tú</i> es <b>sé</b>, con tilde diacrítica.</p>", "tabla": {"cab": ["", "Presente", "Imperfecto", "Indefinido", "Perfecto", "Imperativo"], "filas": [["yo", "soy", "era", "fui", "he sido", "—"], ["tú, vos", "eres, sos", "eras", "fuiste", "has sido", "sé"], ["él / ella, usted", "es", "era", "fue", "ha sido", "sea"], ["nosotros/as", "somos", "éramos", "fuimos", "hemos sido", "—"], ["vosotros/as", "sois", "erais", "fuisteis", "habéis sido", "sed"], ["ellos/as, ustedes", "son", "eran", "fueron", "han sido", "sean"]]}}, {"n": "Conjugación de estar", "fr": "Tablas del libro · pág. 252", "uso": "<p>Gerundio: <b>estando</b> · Participio: <b>estado</b></p><p>Todas las formas del presente llevan tilde menos <i>estoy</i> y <i>estamos</i>.</p>", "tabla": {"cab": ["", "Presente", "Imperfecto", "Indefinido", "Perfecto", "Imperativo"], "filas": [["yo", "estoy", "estaba", "estuve", "he estado", "—"], ["tú, vos", "estás", "estabas", "estuviste", "has estado", "está"], ["él / ella, usted", "está", "estaba", "estuvo", "ha estado", "esté"], ["nosotros/as", "estamos", "estábamos", "estuvimos", "hemos estado", "—"], ["vosotros/as", "estáis", "estabais", "estuvisteis", "habéis estado", "estad"], ["ellos/as, ustedes", "están", "estaban", "estuvieron", "han estado", "estén"]]}}, {"n": "Conjugación de haber", "fr": "Tablas del libro · pág. 252", "uso": "<p>Gerundio: <b>habiendo</b> · Participio: <b>habido</b></p><p>* <b>hay</b> es la única forma impersonal: se usa sin sujeto y no tiene plural (<i>hay un libro</i>, <i>hay libros</i>). Como auxiliar, la tercera persona es <b>ha</b> (<i>ha comido</i>).</p><p>Haber no tiene imperativo.</p>", "tabla": {"cab": ["", "Presente", "Imperfecto", "Indefinido", "Perfecto", "Imperativo"], "filas": [["yo", "he", "había", "hube", "—", "—"], ["tú, vos", "has", "habías", "hubiste", "—", "—"], ["él / ella, usted", "ha / hay*", "había", "hubo", "ha habido", "—"], ["nosotros/as", "hemos", "habíamos", "hubimos", "—", "—"], ["vosotros/as", "habéis", "habíais", "hubisteis", "—", "—"], ["ellos/as, ustedes", "han", "habían", "hubieron", "—", "—"]]}}, {"n": "Conjugación de tener", "fr": "Tablas del libro · pág. 253", "uso": "<p>Gerundio: <b>teniendo</b> · Participio: <b>tenido</b></p><p>Doble irregularidad en presente: <b>-g-</b> en la primera persona (<i>tengo</i>) y diptongación <b>e &gt; ie</b> en las demás. En indefinido, la raíz es <b>tuv-</b>.</p>", "tabla": {"cab": ["", "Presente", "Imperfecto", "Indefinido", "Perfecto", "Imperativo"], "filas": [["yo", "tengo", "tenía", "tuve", "he tenido", "—"], ["tú, vos", "tienes, tenés", "tenías", "tuviste", "has tenido", "ten, tené"], ["él / ella, usted", "tiene", "tenía", "tuvo", "ha tenido", "tenga"], ["nosotros/as", "tenemos", "teníamos", "tuvimos", "hemos tenido", "—"], ["vosotros/as", "tenéis", "teníais", "tuvisteis", "habéis tenido", "tened"], ["ellos/as, ustedes", "tienen", "tenían", "tuvieron", "han tenido", "tengan"]]}}];

 irr:"<b>La regla del libro</b> (act. 8, pág. 17 y ej. 4, pág. 152): detrás de <b>para</b> va un <u>infinitivo</u>; si el verbo está conjugado, ya no es <i>para</i> sino <b>porque</b>.<br><i>Estudio español <b>para</b> viajar.</i> — infinitivo.<br><i>Estudio español <b>porque</b> tengo amigos allí.</i> — verbo conjugado.<br><br><b>La pareja que engaña:</b><br><i>Lo hago <b>por</b> ti</i> = à cause de toi, pour te faire plaisir.<br><i>Lo hago <b>para</b> ti</i> = c'est toi qui le recevras.<br><br><b>Expresiones fijas:</b> <b>por favor</b> · <b>por eso</b> · <b>por supuesto</b> · <b>por fin</b> · <b>para siempre</b> · <b>para nada</b> · <b>no es para tanto</b>.<br><br><b>Tres escrituras distintas:</b> <i><b>por qué</b></i> pregunta; <i><b>porque</b></i> responde; <i>el <b>porqué</b></i> es un nombre («la raison»)."

 irr:"<b>¿Cuándo se pone <i>y</i>?</b> Solo entre la decena y la unidad, de 31 a 99: <i>treinta <b>y</b> uno, noventa <b>y</b> nueve</i>. Nunca en otro sitio: <i>ciento cinco</i>, no «ciento y cinco».<br>De 16 a 29 la <i>y</i> queda absorbida: <i>dieciséis</i> (= diez y seis), <i>veintiuno</i> (= veinte y uno).<br><br><b>Tildes:</b> <i>diecis<b>é</b>is, veintid<b>ó</b>s, veintitr<b>é</b>s, veintis<b>é</b>is</i>. Desaparecen en composición: <i>doscientos veintidós</i>.<br><br><b>Uno</b> pierde la -o ante nombre masculino: <i><b>un</b> libro</i>, <i>treinta y <b>un</b> años</i>; en femenino, <b>una</b>.<br><br><b>Cien o ciento:</b> <b>cien</b> solo o ante nombre (<i>cien euros</i>); <b>ciento</b> en cuanto sigue otro número (<i>ciento veinte</i>). Las centenas concuerdan: <i>doscient<b>as</b> personas</i>.<br><br><b>Mil</b> es invariable como número (<i>dos mil</i>); <b>millón</b> es un nombre y lleva <b>de</b>: <i>dos <b>millones de</b> habitantes</i>.<br><br><b>Ordinales:</b> primero, segundo, tercero… <i>Primero</i> y <i>tercero</i> se apocopan: <i>el <b>primer</b> día</i>, <i>el <b>tercer</b> piso</i>. A partir de diez se usa el cardinal: <i>el piso <b>doce</b></i>."

 irr:"<b>La preposición forma parte de la perífrasis</b> y no se adivina. Llevan <b>a</b>: <i>ir a, empezar a, volver a, ponerse a</i>. Llevan <b>de</b>: <i>acabar de, dejar de</i>. Llevan <b>que</b>: <i>tener que, hay que</i>. No llevan ninguna: <i>deber, poder, soler</i>.<br><br><b>Ojo con <i>empezar</i>:</b> la preposición solo aparece ante infinitivo. <i>Empezó <b>a</b> trabajar</i>, pero <i>Empezó la carrera</i> (act. 12, pág. 162).<br><br><b>Acabar de</b> cambia de sentido según el tiempo: en presente, «venir de» (<i>Acabo de comer</i>); en indefinido, «finir de» (<i>Acabé de comer a las tres</i>).<br><br><b>Los pronombres tienen dos sitios posibles</b>, sin cambio de sentido: <i><b>Lo</b> voy a hacer</i> o <i>Voy a hacer<b>lo</b></i>; <i><b>Se</b> está duchando</i> o <i>Está duchándo<b>se</b></i> (pág. 226, «Posición de los pronombres»)."
}

const MASGRAM = [{"n": "La acentuación", "fr": "Del apéndice del libro", "uso": "<p>En español, todas las palabras tienen una sílaba más fuerte que las otras: la sílaba tónica. En algunos casos, la vocal de la sílaba tónica lleva un acento gráfico C), pero no siempre: vi-vir, vi-vo, can-ta-mos, can-to, can- tas, can-tás, co-mo, co-me-mos, des-pier-to, des-per-ta-mos, can-ción, te-lé-fo-no ...</p><p>Normalmente, las palabras que solo tienen una sílaba no llevan acento: plan, dos, me, es, son, tres, va, a, y... Pero algunas palabras de una sola sílaba sí se acentúan para diferenciarlas de otras que se escriben igual. Estos son algunos casos: mi (posesivo): Mi madre mí (pronombre personal): A mí me gusta. tu (posesivo): Tu madre tú (pronombre personal) ¿Tú te llamas Marce/o? te (pronombre): ¿Te gusta? té (sustantivo) ¿Quieres té o café? el (artículo) El hijo de Juan él (pronombre personal): Él es de Bélgica que (conjunción): Creo que Jaime está de vacaciones. qué (pronombre interrogativo) ¿Qué quieres? que (pronombre relativo) ¿Este es el cantante que te gusta?</p>"}, {"n": "Reglas de acentuación", "fr": "Del apéndice del libro", "uso": "<p>Para saber si una palabra se escribe con acento gráfico, hay que tener en cuenta dos cosas: en qué letras termina la palabra y la posición de la sílaba tón ica (contando las sílabas desde el fi nal de la palabra). SI LA PALABRA TERMINA EN ... CONTANDO LAS SÍLABAS DESDE EL FINAL, LA SÍLABA TÓNICA ES LA ... 1.<br>· (PALABRAS AGUDAS) 2.<br>· (PALABRAS LLANAS) 3.\" (PALABRAS ESDRÚJULAS) vocal (-a, -e, -i, -o, -u), LLEVA ACENTO: NO LLEVA ACENTO: SIEMPRE LLEVA ACENTO: -as, -es, -is, -os,-us, can-ción, es-tás, a-quí ca-sa, li-bro, a-bro, pon-go, te-lé-fo-no -an, -en, -in, -on, -un pa-ra, a-mi-gos, de-por-tis-ta prác-ti-co Mé-xi-co cualquier otra letra NO LLEVA ACENTO: LLEVA ACENTO: ven-de-dor, co-mer ár-bol, a-zú-car, ál-bum</p>"}, {"n": "Los artículos", "fr": "Del apéndice del libro", "uso": "<p>LOS ARTÍCULOS INDETERMINADOS Y LOS SUSTANTI aquete para usted. 0 Buenos días, B señora García Indicar la profesión<br>· Es el médico del pueblo (=Solo hay<br>· Es un médico muy bueno<br>· Es B médico uno). (= Es médico y es buen médico). Expresar existencia<br>· El libro está aquí, en la mesa.<br>· Hay un libro en la mesa.<br>· En la mesa hay 0 libros y ubicación<br>· En la mesa hay 0 agua Describir personas<br>· Tiene los ~ azules<br>· Lleva un ¡ersey azul<br>· Lleva 0 gafas.<br>· Tiene el pelo largo.<br>· Tiene 0 barba. Hablar de gustos<br>· Me encanta el cine.<br>· Me gustan mucho los deportes. Los días y las horas<br>· Estudio francés los lunes.<br>· Hoy es e lunes.<br>· Son las nueve y media En un objeto directo<br>· ¿Me dejas el coche este fin de semana?<br>· Quiero comprar un coche, pero no<br>· ¿Tienes B coche? (= Solamente tiene un coche). sé cuál elegir...<br>· ¿Prefieres usar 0 ordenador<br>· El café, lo tomo sin azúcar.<br>· ¿Me dejas una bicicleta este fin o escribir con bolígrafo? de semana? (=Tiene dos o más,<br>· ¿Tomas 0 !!_ o 0 café? necesitas una, cualquiera). doscientos veintitrés 223</p>"}, {"n": "El artículo neutro «lo»", "fr": "Del apéndice del libro", "uso": "<p>Usamos el artícu lo neutro lo sin nombre (no hay nombres neutros en español) para genera lizar, para referirnos a todas las cosas, masculinas y femeninas.<br>· Odio los libros antiguos y las películas antiguas - Odio todo lo o antiguo.(= Las cosas antiguas, en general).<br>· La gramática es complicada y el vocabulario es difícil, pero lo 0 peor son los verbos. (= La peor de todas las cosas).</p><p>Usamos lo que para referirnos a frases o a algo que no sabemos qué es.<br>· A veces eres demasiado directo, ¿no crees? 0 Bueno, digo lo que pienso (= Las cosas que pienso).</p>"}, {"n": "Los demostrativos", "fr": "Del apéndice del libro", "uso": "<p>En español usamos tres series de demostrativos (este, ese y aquel), para disting uir entre algo que está aq uí, cerca de la persona que habla (este), dealgo que está ahí (ese), cerca de la persona que escucha, y dealgo que está allí(aquel), lejos de la conversación: CERCA DE QUIEN HABLA: CERCA DE QUIEN ESCUCHA: LEJOS DE LA CONVERSACIÓN: ESTÁ AQUÍ ESTÁ AHÍ ESTÁ ALLÍ este (libro) ese (libro) aquel (libro) esta (libreta) esa (libreta) aquella (libreta) estos (libros) esos (libros) aquellos (libros) estas (libretas) esas (libretas) aquellas (libretas) esto 0 eso 0 aquello 0 E:ste está e\" fra\"cés. ciE:se ta111bié\"? No, este \"°<br>· pero aquellos sí. 224 doscientos vei nticuatro</p><p>Los demostrativos funcionan como determinantes definidos y se usan de una manera parecida a el, la, los, las:<br>· Me encanta esta ciudad. Sí, a mí tambié\",<br>· Este lunes quiero ir a Guadalajara pero estas · )<br>· }la, e5ff1 fa.'fflacia cerca de mi casa. 1 1/.a;1 la fa.'fflac/a cerca de mi casa. \"º me 9usta\":.-/\" /</p><p>La diferencia es que los artículos determinados el, la, los, las se interpretan en general y, en cambio, los demostrativos seleccionan un individuo en particular (una cosa, persona ... ) que se elige entre otros del mismo tipo porque está cerca o lejos de la persona que habla y se puede señalar.<br>· Las sandalias son muy cómodas, ¿verdad?(= Todas las sandalias en general). 0 Normalmente sí, pero estas son bastante incómodas (= L as sandalias que lleva, unas en particular); ¿esas son más cómodas?(= Las sandalias que tú llevas).<br>· Este jersey es bastante bonito (=lo tengo en las manos), pero aquel (=El que está allí) es más elegante. El DEMOSTRATIVO NEUTRO: ESTO, ESO, AQUELLO</p><p>Además de las formas de masculino y de femenino, existen formas neutras (esto, eso y aquello), que no van nunca con sustantivo (no hay sustantivos neutros en español). Estas formas sirven para referirse a algo que no sabemos qué es.<br>· ¿Eso e qué es: una camiseta larga o un vestido corto?</p><p>También sirven para referirse a cosas que son de tipos diferentes sin usar sus nombres concretos. <br><b>⚠ Atención</b> <br>· ¿Qué compramos para cenar: esto e o eso?(= Pollo o pasta) Nunca se usan demos-</p><p>Cuando no sabemos o no queremos decir a qué ti po de cosa pertenece algo, preguntamos con trativos neutros para qué y respondemos con un demostrativo neutro (esto / eso / aquello). referirse a personas:</p><p>Cuando tenemos que elegir una cosa entre dos o más del mismo tipo, preguntamos con cuál / qué+ sustantivo y respondemos con este/a/os/as. .iQuédesea? ) iAh! .IU\"a madale\"a? .ICuál quiere? E:sta. La más gra\"de. ) doscientos veinticinco 225</p>"}, {"n": "Los posesivos", "fr": "Del apéndice del libro", "uso": "<p>Los posesivos se utilizan para identificar algo o a alguien relacionándolo con una persona: el / la poseedor/a. La relación puede ser fami liar (mi madre), social (mis compañeros de clase), de posesión (mi coche) o de otro tipo (mi barrio).</p><p>Los posesivos varían según quién es el / la poseedor/a (yo-+ mi casa, tú-+ tu casa ... ) y concuerdan en género y en número con lo poseído (nuestra casa, sus libros, etc.). POSEEDOR OBJETO POSEÍDO Masculino singular: Femenino singular: Masculino plural: Femenino plural: libro. casa._ libros ... casas ... (yo) mi libro mi casa mis libros mis casas (tú, vos) tu libro tu casa tus libros tus casas (él/ ella, usted) su libro su casa sus libros sus casas (nosotros/ nosotras) nuestro libro nuestra casa nuestros libros nuestras casas (vosotros/ vosotras) vuestro libro vuestra casa vuestroslibros vuestras casas (ellos I ellas, ustedes) su libro su casa sus libros sus casas :----- E:sta es nuestra casa. / E:stas son nuemas hijas. Yestos son nuemos gato1 /</p><p>Los posesivos su / sus se pueden referir a diferentes personas (él, ella, usted, ellos, ellas, ustedes). Por eso, solo los usamos cuando no existe posibilidad de confusión.<br>· Esos son Guillermo y su novia, Julia<br>· Señora Castro, ¿es este su ordenador?</p><p>Si no queda claro el / la poseedor/a, utilizamos de+ nombre:<br>· Esta es la casa de Manuel y esa, la de Jorge.</p><p>No usamos los posesivos cuando nos referimos a partes del propio cuerpo (el pronombre ya indica quién es el / la poseedor/a).<br>· Me duele la cabeza. lJHefe ffli eaheta.<br>· Me quiero cortar el pelo. 0Hiel'6 é8rfür ffli pef.e</p><p>Tampoco los usamos para hablar de otros objetos propios (pasaporte, coche, llaves de casa, ordenador. .. ) cuando, por el contexto, está muy claro quién es el / la propietario/a.<br>· He aparcado el coche cerca del restaurante.<br>· ¿Tienes el pasaporte?Lo vas a necesitar.<br>· Traed el ordenador a clase. 226 doscientos veintiséis</p><p>También usamos posesivos sin un sustantivo a continuación, pero entonces tienen otra forma. POSEEDOR OBJETO POSEÍDO Masculino singular: Femenino singular: Masculino plural: Femenino plural: libro. casa._ libros ... casas ... (yo) mío mía míos mías (tú, vos) tuyo tuya tuyos tuyas (él/ ella, usted) suyo suya suyos suyas (nosotros/as) nuestro nuestra nuestros nuestras (vosotros/as) vuestro vuestra vuestros vuestras (ellos/ ellas, ustedes) suyo suya suyos suyas</p><p>Estos posesivos se usan en tres contextos. - Para dar y para pedir información sobre a quién pertenece algo. E:s mía. Mira, la mía tiene una JE:sa bolsa es tuya o es mía? etiqueta aquí.<br>· ¡Qué lío' ¿Esta bolsa es tuya o es mía? 0 ¿E s roja? Pues es mía - Usamos el, la, los, las + 0 + posesivo cuando no queremos repetir el sustantivo.<br>· Estos no son mis zapatos. ¡Son los e tuyos' - Usamos el artículo indefinido / cuantificador+ sustantivo+ posesivo cuando nos referimos solo a algunas de las cosas poseídas por esa persona, no a todas.<br>· Vienen a cenartus amigos (= Esos amigos que ya se sabe quiénes son).<br>· Vienen a cenardos amigos tuyos. (= Dos amigos que yo no sé - o no quiero decir- quiénes son).<br>· Vienen a cenar dos amigos. o ¿Tuyos o míos?</p>"}, {"n": "La comparación", "fr": "Del apéndice del libro", "uso": "<p>Para comparar, usamos las estructuras siguientes: COMPARAR NOMBRES COMPARAR VERBOS más+ nombre(+ que .. .) verbo + más (+ que .. .) SUPERIORIDAD<br>· Mi casa tiene más habitaciones (que la de mi hermana)<br>· Mi casa me gusta más (que la de mi hermana) tanto/a/os/as+ nombre(+ como.. .) verbo tanto (+ como... )<br>· En mi barrio hay tantos coches como en este.<br>· En verano estudio tanto como en invierno. IGUALDAD<br>· En mi barrio hay tanto tráfico como en este.<br>· En mi barrio hay tantas tiendas como en este<br>· En mi barrio hay tanta gente como en este menos + nombre(+ que.. .) verbo + menos (+ que.. .)<br>· Vivimos en un barrio con menos coches (que este)<br>· En verano cocino menos (que en invierno). no... tanto/a/os/as+ nombre (+ como...) INFERIORIDAD<br>· En nuestro barrio no hay tantos coches (como en este). no + verbo tanto (+ como .. .)<br>· En nuestro barrio no hay tanto tráfico (como en este)<br>· En verano no cocino tanto (como en invierno).<br>· En nuestro barrio no hay tantas tiendas (como en este).<br>· En nuestro barrio no hay tanta gente (como en este). 1 COMPARAR ADJETIVOS COMPARAR ADVERBIOS más+ adjetivo(+ que...) más+ adverbio(+ que .. .) SUPERIORIDAD<br>· Mi habitación es más luminosa (que la de mi hermana)<br>· Ahora leo en español más rápido (que antes).<br>· Este piso es mejor (que el mío)<br>· Cocino mejor(que mi padre) tan+ adjetivo(+ como...) tan+ adverbio(+ como...)<br>· Mi casa es tan grande como la tuya.<br>· Tú lees en español tan [ápido como yo.</p>"}, {"n": "Igualdad", "fr": "Del apéndice del libro", "uso": "<p>igual de+ adjetivo(+ que...) igual de+ adverbio(+ que...)<br>· Mi casa es igual de grande (que la tuya)<br>· Tú lees en español igual de rápido (que yo) menos+ adjetivo (+ que...) menos + adverbio(+ que...)<br>· Vivimos en un barrio menos ruidoso (que este)<br>· A/ice lee en español menos rápido (que yo)</p>"}, {"n": "Inferioridad", "fr": "Del apéndice del libro", "uso": "<p>no... tan + adjetivo (+ como.. .) no... tan + adverbio (+ como.. .)<br>· Nuestro barrio no es tan ruidoso (como este)<br>· A/ice no lee en español tan rápido (como yo). doscientos veintinueve 229</p><p>Algunos adjetivos y adverbios tienen formas comparativas especiales. <br><b>⚠ Atención</b>  más grande -+ mayor más bien -+ mejor más pequeño/a -+ menor más mal -+ peor Mayor (que) suele usarse, sobre todo, para más bueno/a -+ mejor indicar \"mayor edad\"; parael tamaño físico de algo usamos más grande. más malo/a -+ peor<br>· Antonio es mayor que Andrés (= tiene más<br>· Mi hermana es mayor que yo. años), pero Andrés es más alto, más gordo ...<br>· Soy un año menor que tú. más grande.<br>· Yo cocino mejor que ttí.<br>· Este restaurante es peor que el de tu calle.<br>· Yo cocino mejor que Lo/a<br>· En los hoteles siempre duermo peor que en casa.</p>"}, {"n": "Los superlativos", "fr": "Del apéndice del libro", "uso": "<p>Los superlativos definen un lugar, una persona o una cosa como el lugar, la persona o la cosa que tiene el grado máximo de una cua li dad (más grande, más pequeño... ) dentro de un conjunto.<br>· Esta es la habitación más luminosa de la casa.<br>· Es la mejor habitación de la casa.</p>"}, {"n": "Los pronombres personales", "fr": "Del apéndice del libro", "uso": "<p>Los pronombres personales son las palabras que usamos para referirnos a la persona o personas que hablan, la persona o personas que escuchan o a personas o cosas que no están en la conversación.<br>· Yo soy profesora.<br>· Siempre me levanto a las 7 h.<br>· ¿Ustedes son chilenos?<br>· El té, lo tomo siempre con un poco de leche<br>· ¿Vos sabés dónde hay una farmacia?<br>· ¿Conoces a Marta? Me voy de vacaciones con ella<br>· Ellas no han visto las fotos del viaje<br>· Me gusta la playa</p><p>La forma de los pronombres personales cambia segú n el lugar que ocupan en la oración y según su función. LAS PERSONAS QUE ESCUCHAN. LAS FÓRMULAS DE TRATAMIENTO - Usted. Usamos este pronombre como forma de respeto o para marcar distancia social. En general, se usa con personas mayores (especialmente, desconocidas) y en relaciones profesionales. Sirve para dirigirse a una persona, pero tanto las formas verbales como los pronombres de objeto directo, indirecto o reflexivos son los mismos que se usan para la tercera persona del singular(usted se levanta, ella se levanta; Austed ~ conozco, ¿verdad?,Aél ~ conozco, ¿verdad?). - Tú y vos. Usamos estas formas para hablar con una persona, sin marcas especiales de respeto. Según la zona geográfica se usa uno u otro. - Ustedes. Se usa para dirigirse a varias personas. Las formas verbales y los pronombres de objeto directo, indirecto o reflexivos son los mismos que se usan para la tercera persona del plural (ustedes se levantan, ellas se levantan).</p><p>Vosotros/as. Este pronombre se usa únicamente en España y se utiliza para dirigi rse a varias personas en situaciones informales. En España, ustedes es una forma de respeto y se usa de manera similar a usted. 230 doscientos treinta LOS PRONOMBRES PERSONALES EN FUNCIÓN DE SUJETO</p><p>En español, la terminación del verbo concuerda con el sujeto, por eso los pronombres persona les que tienen esa función se usan poco.<br>· Esta es mi clase, ye estudio Matemáticas Nosotras estudiamos Yo estudio Geología y ellas,<br>· Perdona,¿\"' tienes hora? Biología, Jy vosotras? Física.</p><p>Los pronombres de sujeto se utilizan solo cuando queremos destacar una persona, para compa rar o contrastar con otras.<br>· Yo tengo dieciocho años ¿Yvosotros7<br>· Yo tengo diecinueve y él tiene veinte</p><p>También se usan, en la tercera persona, si se habla de más de una persona y puede haber confusión.<br>· Juan y Julia han vivido en Rusia, pero él no habla ruso. 1.' pers. singular yo<br>· Yo vivo en Barcelona, ¿y tú? 2.' pers. singular tú / vos, usted<br>· Mi reloj no funciona, ¿tú tienes hora?/ ¿vos tenés hora?/ ¿usted tiene hora7 3.' pers. singular él / ella<br>· Él es argentino y ella, española. 1.' pers. plural nosotros / nosotras<br>· ¿Tú vas a la fiesta? Nosotras no vamos; no tenemos tiempo. 2.' pers. plural vosotros / vosotras, ustedes<br>· ¿Ustedes trabajan aquí?/¿Vosotros trabajáis aquí? 3.' pers. plural ellos / ellas<br>· Ellos son argentinos y ellas, espaiiolas LOS PRONOMBRES PERSONALES EN LOS VERBOS PRONOMINALES</p><p>Algunos verbos, como llamarse, levantarse o ducharse, se construyen siempre con los pronombres me, te, se, nos, os, se (además del pronombre de sujeto). Son los llamados verbos pronom inales. 1.' pers. singular me (yo) me levanto 2.' pers. singular te / se (tú) te levantaste / (vos) te levantaste / (usted) se levantó 3.' pers. singular se (ella) se levantaba 1.' pers. plural nos (nosotras) nos levantamos 2.' pers. plural os / se (vosotros) os levantáis / (ustedes) se levantan Claudia hoy se ha despertado muy pronto. 3.' pers. plural se (ellos) se levantan LOS PRONOMBRES PERSONALES DE OBJETO DIRECTO {OD) EN LOS VERBOS TRANSITIVOS</p><p>Otros verbos, los transitivos, expresan lo que el sujeto hace a un objeto o a otra persona (el objeto directo, 0D).<br>· El año pasado pintamos el salón, lo pintamos de color verde 0 Ayer Ana vio a Juan en la calle, lo llamó, pero él no la vio Claudia ha tenido que despertar a Dani. Siempre lo despierta porque es muy dormilón. doscientos treinta y uno 231</p><p>Usamos los pronombres personales de objeto directo (lo, la, los, las) cuando, por el contexto, ya está claro cuál es el 0D de un verbo y nolo queremos repetir.<br>· ¿Tienes el pasaporte? o Sí, lo llevo en la maleta. Ylas tarjetas de crédito, ¿las tienes tú7</p><p>Normalmente no se usa el pronombre y el 0D en una misma frase. Solo se usan las dos cosas si el 0D está antes del verbo: 0D, pronombre+ verbo .. .<br>· iLB tieHes elpa5a,pa,..te? 0 Sf, Je Ueva e.' fJB5-afJBffe eH .ta fflaktn.<br>· Ylas tarjetas de crédito. ¿las tienes tú7 FEMENINO MASCULINO SINGULAR la lo PLURAL las los<br>· Me gusta mucho este abrigo. Lo llevo siempre.<br>· Me gustan mucho estos zapatos. Los llevo siempre.<br>· El libro, lo necesito para mi clase.<br>· Los libros, los necesito para mi clase.<br>· Me gusta mucho esta chaqueta La llevo siempre.<br>· Me gustan mucho estas sandalias. Las llevo siempre.<br>· La libreta, la necesito para mi clase.<br>· Las libretas, las necesito para mi clase. LOS PRONOMBRES PERSONALES EN FUNCIÓN DE OBJETO INDIRECTO (01) CON VERBOS COMO GUSTAR</p><p>Algunos verbos, como gustar y encantar, que expresan sentimientos y opiniones respecto a cosas, personas o actividades, tienen una estructura especial.</p><p>La persona que tiene esa opinión o experimenta ese sentimiento se expresa mediante un pronombre de 01 (me, te, le, nos, os, les) y con a+ nombre / pronombre:<br>· A mí no me gusta este plato ¿A ti te gusta 7 o A mí tampoco, pero a María le encanta</p><p>La cosa o actividad que provoca ese sentimiento es el sujeto y concuerda con el verbo.<br>· No me gusta el golf, pero me encantan los deportes de equipo. SUJETO SUJETO (A mí) me el cine. (NOMBRES EN SINGULAR) (Ati, vos) te gusta ir al cine. (VERBOS) (Aél) / (A ella) / (A usted) le (A nosotros)/ (A nosotras) nos (Avosotros)/ (A vosotras) os las películas de amor. gustan (NOMBRES EN PLURAL). (A ellos) / (A ellas)/ (A ustedes) les AJuan - - le encanta - el mar. -</p><p>En estos verbos, el pronombre de 01 es obligatorio yse usa siempre. En cambio, el uso OI SUJETO de a+ pronombre tónico (a mí, a ti / vos, a él / ella / usted, a nosotros/as, a vosotros/as, a ellos/as / ustedes) no es obligatorio.<br>· Pablo es muy aventurero, a él le encanta viajarsolo.<br>· ¿Qué aficiones tenéis? 0 A mí me encanta el teatro ¿Ya ti7 A fflÍ eReaRki el tea~\"O i Ya ~;2 232 doscientos treinta y dos LOS PRONOMBRES PERSONALES EN FUNCIÓN DE OBJETO INDIRECTO (OI) CON VERBOS COMO DAR</p><p>Algunos verbos, como dar, prestar o pedirfuncionan de manera que el sujeto transfiere un objeto a otra persona. La persona que recibe ese objeto es el 01, y se expresa mediante un pronombre de 01 (me, te, le, nos, os, les) y a+ nombre / pronombre:<br>· Le presté mi coche a Juan para el fin de semana.<br>· ¿Me das un vaso de agua? (Amí) me<br>· No me diste el dinero de la entrada. (A ti) te<br>· ¿Te puedo pedir una cosa? (A él) / (A ella) / (A usted) le<br>· Le pediré el dinero (a Ana I a él I a usted) (A nosotros)/ (A nosotras) nos<br>· Carmen nos prestó su casa este verano. (A vosotros)/ (A vosotras) os<br>· Si queréis, os presto mi coche. Martín le da un vaso de agu a su hija (A ellos) / (A ellas) / (A ustedes) les<br>· Alos chicos no les daré más chocolate.</p>"}, {"n": "Pronombres personales detrás de preposición", "fr": "Del apéndice del libro", "uso": "<p>Después de las preposiciones (a, de, con, en, para, por... ), se usa una forma especial de los pronombres, llamados pronombres tónicos.<br>· ~ mí me encanta el cine, ¿y a ti? <br><b>⚠ Atención</b>  l' pers. mi singular (conmigo)<br>· ¿Esto es para mí? ¡Gracias! Con la preposición con, decimos conmigo<br>· El lunes comes con ella, pero el sábado cenas conmigo y contigo. ti (contigo)<br>· ¿~ ti I vos te gusta el cine?/ ¿~ usted le gusta el cine? 2.' pers. vos<br>· Esto es para ti I para vos / para usted singular JVie11es eonmigo<br>· El lunes como con ella, pero el sábado ceno contigo. ovas eon él? Voy eontigo. usted<br>· ¿~ ella le gusta el cine? 3.' pers. él, ella<br>· El regalo es para él singular<br>· El sábado cenamos con ella.<br>· A nosotros nos gusta el cine, ¿y a ti? l' pers. nosotros, plural nosotras<br>· ¿Esto es~ nosotras?¡Gracias 1<br>· El sábado Alicia cena con nosotros. vosotros, 2.' pers. vosotras<br>· ¡Feliz cumpleaños1 Esto es para ustedes I vosotras plural<br>· No tenemos coche.¿Podemos ir con ustedes / vosotros7 ustedes<br>· ¿~ ellas les gusta el cine? 3.ª pers. plural ellos, ellas<br>· ¿Están aquí tus padres7 Esto es para ellos<br>· Hoy cenamos con ellos. doscientos treinta y tres 233</p>"}, {"n": "Posición de los pronombres", "fr": "Del apéndice del libro", "uso": "<p>Los pronombres se colocan siempre delante del verbo conjugado.<br>· Me despierto pronto<br>· Me gusta leer</p><p>En las perífrasis como tener que + infinitivo, querer+ infinitivo, poder+ infinitivo, saber + infinitivo o estar+ gerund
