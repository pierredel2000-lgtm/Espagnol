o te llamas?<br>· ¿Sobre~ trató la conferencia?<br>· ¿Cómo se escribe \"ventana\"? 0 Sobre reciclaje.<br>· ¿Hasta cuándo te quedas? por qué<br>· ¿Por qué estudias ruso? 0 Hasta el martes.<br>· ¿Para cuántas personas es el paste/?</p><p>Las preguntas de respuesta cerrada (que se responden con 0 Para ocho como máximo. sí o no) se forman igual que las frases enunciativas; simplemente cambia la entonación.<br>· Edu va mucho a la playa<br>· ¿Edu va mucho a la playa7 234 doscientos treinta y cuatro QUÉ YQUÉ+ SUSTANTIVO, CUÁL / CUÁLES</p><p>Para preguntar por un tipo de cosa, sin concretar ni hacer referencia a un sustantivo, usamos qué.<br>· ¿Qué compro para la fiesta? 0 Bebidas o patatas fritas.<br>· ¿Qué es el atún7 0 Un pescado.</p><p>También usamos qué para pregunta r por actividades.<br>· ¿Qué quieres hacer esta tarde? o Podemos iral cine, ¿no7</p><p>Cuando queremos preguntar por una cosa en particular, dentro de un conjunto (sabemos qué tipo de cosa es), usamos qué+ sustantivo o cuál / cuáles.<br>· ¿Qué zapatos te gustan más. los negros o los blancos? 0 Los negros. <br><b>⚠ Atención</b>  En algunas variantes también se dice cuál /<br>· ¿Cuál es tu apellido? cuáles + sustantivo: o Goicoechea<br>· ¿Cuáles zapatos te gustan más7<br>· ¿Cuál es la moneda de México? o El peso, ¿no 7</p>"}, {"n": "Situar en un lugar", "fr": "Del apéndice del libro", "uso": "<p>~ ~ ~ Debajo (de ... ) Encima (de ... ) Detrás (de ...) Delante (de.. .) fFf1 ~~ A la derecha (de... ) A la izqu ierda (de... ) Al lado (de.. .) Entre .. . y.. . ~-fr @ En el centro (de .. .) Alrededor(de ...) En medio (de .. .) Dentro (de... )<br>· ¿Pongo las flores encima de la mesa o al lado de la ventana?<br>· Encontré la pelota debajo de la cama doscientos treinta y cinco 235<br>· El libro que buscas está entre el diccionario y la libreta<br>· Deja el pastel dentro de la nevera, entre las dos botellas de leche.<br>· Hay árboles alrededor de la casa</p><p>Cuando ya se ha mencionado o está claro el punto de referencia puede no decirse de+ sustantivo.<br>· ¿Ves la mesa7 Tu bolso está debajo<br>· ¿Dónde pondremos el cuadro?, ¿a la derecha de la ventana o a la izquierda?</p><p>Pero siempre hay que indicar el punto de referencia con entre. Mí ropa está en el armario, creo que tu abrigo está entre esa ropa.(. _}1:1 ahl'iyo eslá eRfff!)</p><p>La manera más sencilla de situar algo en un lugar es usar en.<br>· El plato está en la mesa. (= Encima de la mesa).<br>· El plato está en el cajón. (= Dentro del cajón). 1<br>· Tu regalo está en esa caja (= Dentro de esa caja).<br>· El perro está en la alfombra (= Encima de la alfombra).</p><p>Con superficies en las que solo hay un lugar posible para situar algo (el suelo, el techo, la pared, la ca lle.. .), usamos en.<br>· La alfombra está en el suelo ba alf6fflhl'a e,;tá eREiffla í'Jel s1,ie.lo<br>· La lámpara está en el techo. la láFRfJiJf.él eG~ @RéFRa / 9eBaje 9c.' tec};¡e_<br>· El cuadro está en la pared. f,' cuael,'8 est-á eNc.'H1a l a.' la€HJ He la tJare€Í.</p>"}, {"n": "Distancia", "fr": "Del apéndice del libro", "uso": "<p>(unos) 20 minutos Está a (unos) 200 metros muy lejos de aquí. bastante lejos de la universidad. un poco lejos Está bastante cerca muy cerca aquí al lado. aquí mismo<br>· La casa está cerca de la playa.<br>· La casa está lejos de la ciudad.<br>· La casa está a 5 minutos de la playa.<br>· La casa está a 300 metros del árbol.</p>"}, {"n": "Movimiento", "fr": "Del apéndice del libro", "uso": "<p><br>· Todos los domingos vamos de casa a la playa.<br>· Me gusta pasear por la playa<br>· Cuando vamos hasta la playa pasamos por el bosque 236 doscientos treinta y seis</p>"}, {"n": "Situar en el tiempo", "fr": "Del apéndice del libro", "uso": "<p>Situar una acción en una hora, un día, un mes o un año a+ hora (de la mañana/ tarde/ noche)<br>· Me levanto a las ocho de la mañana.<br>· Hicimos una pausa para comer a la una. al mediodía<br>· Cerrábamos la tienda al mediodía.<br>· No voy a trabajar por la tarde. por + parte del día<br>· Me levanté tarde por la mañana<br>· Prefiero estudiar por la noche el + día de la semana [(día del mes) de+ mes]<br>· Vamos a hacer el examen el jueves.<br>· Terminan las clases el viernes 6 de junio el + día del mes (de + año)<br>· Llegué a Barcelona el 3 de agosto de 2019 en + mes/ estación/ año<br>· Mi cumpleaños es en abril, en primavera.<br>· La historia empezó en 2010 en + mes (de año)<br>· Nació en noviembre de 2003. Delimitar un periodo de tiempo<br>· Trabajamos de 9ha 18 h. [de + inicio]+ [a+ fin]<br>· Trabajé de lunes a domingo para acabar este proyecto.<br>· Estudiamos español de septiembre a enero.<br>· Trabajamos desde las 9h hasta las 18 h<br>· Trabajé desde el lunes hasta el domingo para acabar [desde + inicio (las + hora / el+ día/ mes _.)]+[hasta + fin (las+ este proyecto. hora / el+ día I mes.. )]<br>· Estudiamos español desde septiembre hasta enero.<br>· Estuvimos juntas desde las 9h del lunes 1Ode marzo hasta las 12 h del domingo 17h</p><p>Es posible decir solamente el inicio o solamente el final de un periodo, pero entonces hay que usar desde o hasta.<br>· Trabajo hasta las 20 h; si quieres, después vamos a cenar l+abafe a /.a5 ~g /;,<br>· Estoy en Barcelona desde el lunes y todavía no he ido a la playa &amp;ifey eR Ba,\"€8.!eRa del hJRe5. Delimitar un periodo de tiempo hasta ahora</p><p>Cuando hablamos de periodos de tiempo que llegan hasta el momento actual, no expresamos el fin del periodo, sino solamente el inicio con desde o desde hace. desde+ inicio (las+ hora / el + día/ mes _.)<br>· Te estoy esperando desde las ocho. desde+ inicio (hace+ cantidad de tiempo)<br>· Tengo una gata desde enero.<br>· Trabajamos aquí desde hace tres meses. doscientos treinta y siete 237 Relacionar una acción o un momento del tiempo con otro: anterioridad y posterioridad &lt;i Q) \\ 1 /4~1 - 1 if .r -~ t~ n t. o /' ~ :, (cantidad de tiempo) antes de + infinitivo<br>· Desayuno antes de ducharme (cantidad de tiempo) después de + infinitivo<br>· Salgo de casa 15 minutos después de ducharme. verbo + (cantidad de tiempo) antes<br>· Salgo de casa a las 7:30 h. Desayuno 30 minutos antes. verbo + (cantidad de tiempo) después / más tarde<br>· Desayuno a las 7 hy me ducho más tarde. (cantidad de tiempo) antes, + verbo<br>· Salgo de casa a las 7:30 h, pero, 30 minutos antes, desayuno. (cantidad de tiempo) después / más tarde,+ verbo<br>· Desayuno a las 7 hy, más tarde, me ducho.<br>· Desayuné un café. Luego me duché. luego + verbo<br>· Me duché y luego salí de casa. <br><b>⚠ Atención</b>  También podemos situar en el tiempo con cuando+ verbo conjugado:<br>· Me siento insegura cuando hablo con nativos.<br>· Canto ópera cuando me ducho. Situar una acción respecto al momento que hablamos<br>· Mañana vamos a ir a la playa, ¿quieres venir?<br>· El examen termina dentro de diez minutos.<br>· Terminé la carrera hace tres años<br>· Fui al dentista la semana pasada, pero tengo que volver dentro de un mes<br>· El mes que viene empieza el verano<br>· Mañana entregamos el trabajo y pasado mañana tenemos el examen<br>· La próxima semana tengo una entrevista de trabajo muy importante<br>· Ahora me duele la cabeza, porque hoy he trabajado demasiadas horas. 238 doscientos treinta y ocho SITUAR UNA ACCIÓN EN UN PERIODO DEL PASADO: ENTONCES, ANTES Otras expresiones sitúan los hechos en un periodo del pasado: entonces, antes.<br>· Julio M se casó en 2009 El cantante, que actualmente vive en Míamí, entonces vivía en España.<br>· Antes era más fácil encontrar un buen trabajo. SITUAR UNA ACCIÓN EN UN TIEMPO QUE NO INCLUYE EL MOMENTO ACTUAL: ESE AÑO, AQUELLA SEMANA, EN AQUELLOS TIEMPOS<br>· ¿Te acuerdas de las vacaciones de 20157 0 Sí, aquel año fuimos a París<br>· En aquella época la gente vivía mejor que en esta SITUAR UNA ACCIÓN EN UN PERIODO AMPLIO QUE INCLUYE EL MOMENTO ACTUAL: ACTUALMENTE, HOY EN DÍA Algunas expresiones hablan de un periodo que incluye ahora, pero se interpreta como un tiempo más amplio hoy en día, actualmente.<br>· El cantante, que actualmente vive en Míamí, está pasando unos días en España.<br>· Hoy en día es difícil encontrar un buen trabajo SITUAR UNA ACCIÓN EN UN TIEMPO QUE INCLUYE EL MOMENTO ACTUAL: ESTE AÑO, ESTA SEMANA, EN ESTE MOM ENTO<br>· Este mes he tenido mucho trabajo<br>· ¿Alguien sabe dónde está Marcos? 0 Está de vacaciones esta semana.<br>· En este momento no puedo hablar, estoy en clase</p>"}, {"n": "La frecuencia", "fr": "Del apéndice del libro", "uso": "<p>una vez el día<br>· Me lavo los dientes tres veces al día. dos veces la semana<br>· Tengo clase cuatro veces a la semana. a tres veces ... el mes<br>· Voy al gimnasio una vez al mes varias veces el año<br>· Visito a mí familia varias veces al año Siempre<br>· Siempre hago los deberes por la noche. Casi siempre<br>· Estudio por la noche casi siempre. Muya menudo<br>· Muy a menudo pregunto dudas a mi profesor. A menudo<br>· Hacemos exámenes a menudo. Normalmente<br>· Normalmente me despierto pronto. A veces<br>· A veces me levanto de mal humor. doscientos treinta y nueve 239 ___ no + verbo __casi nunca<br>· No como pescado casi nunca. casi nunca + verbo<br>· Casi nunca como pescado. ___ no + verbo... nunca<br>· No llevo el ordenador a clase nunca nunca + verbo<br>· Nunca llevo el ordenador a clase.</p>"}, {"n": "Los conectores", "fr": "Del apéndice del libro", "uso": "<p>AÑADIR INFORMACIÓN: Y/ ADEMÁS / NI / TAMBIÉN / TAMPOCO</p><p>Para sumar dos o más elementos del mismo tipo dentro de una frase, utilizamos y.<br>· En mi barrio hay un teatro y dos cines <br><b>⚠ Atención</b> <br>· Para comer, quiero una ensalada y un bocadillo.(= Ensalada+ bocadillo). Cuando la palabra que sigue a y comienza con</p><p>Para señalar que sumamos más elementos, pero en otra frase, i o hi, en vez de y usamos e. usamos también. lgnacio yJavier pero Javiere lgnacio<br>· En mi barrio hay un teatro y dos cines. También hay dos escuelas<br>· Para comer, quiero una ensalada y un bocadillo. También quiero un zumo de naranja.</p><p>Para indicar que una persona coincide con otra (en su opinión, <br><b>⚠ Atención</b>  sus acciones, etc.), usamos también. Para indicar que una persona no coincide<br>· A mí me gusta el cine europeo, ¿y a ti7 con otra (en su opinión, sus acciones, etc.), 0 A mí también. usamos no:<br>· Paola siempre hace los deberes.<br>· A míme gusta el cine europeo, ¿y a ti7 0 Yo también. 0 A mí no. Solo me gusta el cine americano.</p><p>Además añade un segundo elemento similar al primero, que lo refuerza.<br>· Paola siempre hace los deberes.<br>· Es un restaurante muy bonito y, además, los camareros son muy simpáticos. 0 Yo no. Yo los hago a veces. 2 ,2s 9 ,19 Este supermercado es muy bueno y, además, no es muy caro.</p><p>Para sumar dos o más elementos negativos del mismo tipo dentro de una frase, utilizamos ni.<br>· En mi barrio no ~ (ningún) teatro ni cines.<br>· Para comer no quiero carne ni pescado. 240 doscientos cuarenta</p>"}, {"n": "Tampoco, la conjunción «o», pero y en cambio", "fr": "Del apéndice del libro", "uso": "<p><b>TAMPOCO</b></p><p>Para señalar que sumamos más elementos negativos, pero en otra frase, usamos tampoco.<br>· En mi barrio no hay cines; tampoco hay teatros.<br>· Para comer no quiero carne ni pescado. Tampoco quiero huevos.</p><p>Para indicar que una persona coincide con otra (en su opinión, sus acciones, etc.) en una frase negativa, usamos tampoco.<br>· A mí no me gusta el cine europeo, ¿y a ti? ○ A mí tampoco.<br>· Paola no hace nunca los deberes. ○ Yo tampoco.</p><p><b>⚠ Atención</b><br>Para indicar que una persona tiene una opinión diferente, que no está de acuerdo con la negación, usamos sí:<br>· A mí no me gusta el cine europeo, ¿y a ti? ○ A mí sí, me encanta.<br>· Paola nunca hace los deberes. ○ Yo sí. Los hago siempre.</p><p><b>LA CONJUNCIÓN O</b></p><p>Se utiliza para presentar alternativas, opciones de las que hay que elegir solo una.<br>· ¿Prefieres carne o pescado? ○ Carne para mí, gracias.<br>· Podemos ir al cine o a cenar… ○ ¿Pueden ser las dos cosas? Primero vamos al cine y después cenamos.</p><p><b>⚠ Atención</b><br>Cuando la palabra que sigue a o comienza con o- / ho-, en vez de o usamos u: No sé si quiere este u otro.</p><p><b>PERO, EN CAMBIO</b></p><p>Pero se utiliza para introducir una información nueva en la frase que, de alguna manera, contradice las expectativas de la información anterior.<br>· Soy japonesa, pero hablo español con mi familia.<br>· Come mucho, pero está muy delgado.<br>· Este supermercado es muy bueno, pero es muy caro.</p><p>En cambio se usa para señalar que la información que se da en una frase es muy diferente o contraria a la información de la frase anterior.<br>· Mi hermana y yo somos muy diferentes. Yo tengo el pelo muy negro y corto; en cambio, ella lo tiene rubio y largo.</p><p>pág. 241</p>"}, {"n": "Los verbos: conjugaciones", "fr": "Del apéndice del libro", "uso": "<p>En el verbo se pueden distinguir dos elementos: la raíz y la terminación. En la raíz está el significado del verbo. En la terminación está la información de tiempo y persona: estudi- (raíz) + -ar (terminación).</p><p>En español existen tres conjugaciones, que se distinguen por las terminaciones del infinitivo: -ar (primera conjugación), -er (segunda conjugación) e -ir (tercera conjugación).</p><p>pág. 242</p>"}, {"n": "Presente de indicativo", "fr": "Del apéndice del libro", "tabla": {"cab": ["", "CANTAR", "LEER", "VIVIR"], "filas": [["(yo)", "canto", "leo", "vivo"], ["(tú, vos)", "cantas, cantás", "lees, leés", "vives, vivís"], ["(él / ella, usted)", "canta", "lee", "vive"], ["(nosotros/as)", "cantamos", "leemos", "vivimos"], ["(vosotros/as)", "cantáis", "leéis", "vivís"], ["(ellos / ellas, ustedes)", "cantan", "leen", "viven"]]}, "uso": "<p>Las distintas personas del presente de indicativo se pronuncian de manera diferente: en algunas, la sílaba tónica está en la raíz; en otras, en la terminación.</p><p>La terminación de la primera persona del singular es igual en las tres conjugaciones: -o.</p><p>Las terminaciones de los verbos de la segunda y de la tercera conjugación son muy similares. Son iguales, excepto en las formas vos, nosotros/as y vosotros/as, que son las formas en las que la sílaba tónica está en la terminación.</p><p>La mayoría de las irregularidades del presente de indicativo están en la raíz del verbo (quiero, puedes, tienen) y solo en las personas en las que la sílaba tónica está en la raíz: yo, tú, usted, él / ella, ustedes y ellos / ellas. La mayoría de las irregularidades se dan en la segunda (-er) y en la tercera conjugación (-ir).</p><p><b>USOS DEL PRESENTE DE INDICATIVO</b></p><p>Hablar de hechos actuales.<br>· ¡Estoy aquí! · Sé conducir. · Mi casa es bastante grande.</p><p>Hablar de hábitos o acciones que hacemos con regularidad.<br>· Voy al gimnasio los lunes y los miércoles.</p><p>Pedir cosas y acciones.<br>· ¿Me trae una cerveza, por favor?</p><p>Dar instrucciones.<br>· Bajas las escaleras, giras a la derecha y ahí está la biblioteca.</p><p>pág. 242</p>"}, {"n": "Irregularidades en presente", "fr": "Del apéndice del libro", "tabla": {"cab": ["", "CERRAR", "PODER", "JUGAR", "PEDIR"], "filas": [["(yo)", "cierro", "puedo", "juego", "pido"], ["(tú, vos)", "cierras, cerrás", "puedes, podés", "juegas, jugás", "pides, pedís"], ["(él / ella, usted)", "cierra", "puede", "juega", "pide"], ["(nosotros/as)", "cerramos", "podemos", "jugamos", "pedimos"], ["(vosotros/as)", "cerráis", "podéis", "jugáis", "pedís"], ["(ellos / ellas, ustedes)", "cierran", "pueden", "juegan", "piden"]]}, "uso": "<p><b>Diptongación: e &gt; ie, o &gt; ue</b></p><p>Muchos verbos de las tres conjugaciones que tienen una e o una o en la sílaba tónica de la raíz tienen esta irregularidad en presente. Solo son irregulares las personas con e y o tónicas: yo, tú, usted, él / ella, ustedes y ellos / ellas.</p><p><b>Cierre vocálico: e &gt; i</b></p><p>El cambio de e por i se produce en muchos verbos de la tercera conjugación (-ir) en los que la última vocal de la raíz es e, como pedir o seguir.</p><p><b>-g- en la primera persona del singular</b></p><p>Existe un grupo de verbos que colocan una g en la primera persona del singular: salir → salgo, poner → pongo, valer → valgo.</p><p>Esta irregularidad también se puede combinar con cambios en las vocales (e &gt; ie, e &gt; i) en las otras personas, como en tener (tengo, tienes), venir (vengo, vienes) o decir (digo, dices).</p><p><b>-zc- en la primera persona del singular</b></p><p>Los verbos terminados en -acer, -ecer, -ocer y -ucir también son irregulares en la primera persona del singular: conocer → conozco, producir → produzco, conducir → conduzco.</p><p>págs. 243-244</p>"}, {"n": "Pretérito perfecto", "fr": "Del apéndice del libro", "tabla": {"cab": ["", "PRESENTE DE HABER", "+ PARTICIPIO"], "filas": [["(yo)", "he", "cantado"], ["(tú, vos)", "has", "cantado"], ["(él / ella, usted)", "ha", "leído"], ["(nosotros/as)", "hemos", "leído"], ["(vosotros/as)", "habéis", "vivido"], ["(ellos / ellas, ustedes)", "han", "vivido"]]}, "uso": "<p>El pretérito perfecto se forma con dos verbos: el presente de haber (he, has, ha…), que concuerda con el sujeto, y el participio (cantado, bebido, vivido). El participio es igual en todas las personas.</p><p>Haber y el participio siempre van juntos, no se puede colocar nada entre ellos. Los pronombres y la negación se colocan siempre antes de haber.<br>· No he ido a América nunca.<br>· ¿La última película de Cuarón? La he visto.</p><p><b>⚠ Atención</b><br>Los adverbios se pueden colocar antes del verbo o después, pero nunca entre haber y el participio:<br>· Siempre he vivido aquí. / He vivido aquí siempre.</p><p>Usamos el pretérito perfecto para referirnos a experiencias de la vida (acciones o acontecimientos ocurridos en un momento pasado no definido): no es importante cuándo ha pasado, solo que ha pasado.<br>· Nunca he estado en Gijón, ¿y tú? ○ No, nunca.<br>· ¿Has visto alguna vez un oso panda? ○ Sí, en China.<br>· ¿Todavía no has terminado de comer? ○ Ya he acabado mi plato.</p><p>En algunos lugares de España se usa el pretérito perfecto para informar de un hecho situándolo en un tiempo que tiene relación con el presente, que llega hasta ahora.<br>· ¿Qué has hecho hoy? ○ Esta mañana he salido a correr y luego he ido a clase.</p><p>pág. 244</p>"}, {"n": "El participio", "fr": "Del apéndice del libro", "uso": "<p>El participio se forma agregando las terminaciones -ado a la raíz de los verbos de la primera conjugación (-ar) e -ido a la de los verbos de la segunda (-er) y de la tercera conjugación (-ir): cantar → cantado, beber → bebido, vivir → vivido.</p><p><b>Hay algunos participios irregulares:</b><br>abrir → abierto · decir → dicho · escribir → escrito · hacer → hecho · morir → muerto · poner → puesto · ver → visto · volver → vuelto · romper → roto · cubrir → cubierto · freír → frito / freído · resolver → resuelto · ir → ido</p><p>págs. 244, 250</p>"}, {"n": "Pretérito indefinido", "fr": "Del apéndice del libro", "tabla": {"cab": ["", "HABLAR", "BEBER", "ESCRIBIR"], "filas": [["(yo)", "hablé", "bebí", "escribí"], ["(tú, vos)", "hablaste", "bebiste", "escribiste"], ["(él / ella, usted)", "habló", "bebió", "escribió"], ["(nosotros/as)", "hablamos", "bebimos", "escribimos"], ["(vosotros/as)", "hablasteis", "bebisteis", "escribisteis"], ["(ellos / ellas, ustedes)", "hablaron", "bebieron", "escribieron"]]}, "uso": "<p>El pretérito indefinido se usa para relatar acciones pasadas, ocurridas en un momento concreto del pasado.<br>· Anoche cené con unos amigos.<br>· Hace dos semanas descubrí un restaurante genial.<br>· Mi hija nació en 2015.</p><p><b>CAMBIOS ORTOGRÁFICOS: CA/QUE; ZA/CE; GA/GUE…</b></p><p>Para conjugar en pretérito indefinido los verbos que terminan en -car, -gar, -guar y -zar hay que tener en cuenta las reglas ortográficas. Recuerda que, a veces, un mismo sonido (/k/, /g/…) puede escribirse con diferentes letras.<br>acercar → acerqué · llegar → llegué · averiguar → averigüé · almorzar → almorcé</p><p><b>CAMBIOS ORTOGRÁFICOS: VOCAL + I + VOCAL &gt; VOCAL + Y + VOCAL</b></p><p>En español, una i que no lleva acento y está entre otras dos vocales se pronuncia como una consonante y se escribe y. Por eso, cuando un verbo en -er o -ir termina en vocal, en la tercera persona del singular y en la tercera del plural la i se convierte en y.<br>oír → oyó / oyeron · caer → cayó / cayeron · huir → huyó / huyeron · construir → construyó / construyeron</p><p>pág. 245</p>"}, {"n": "Irregularidades en el pretérito indefinido", "fr": "Del apéndice del libro", "tabla": {"cab": ["", "PEDIR", "DORMIR", "IR / SER"], "filas": [["(yo)", "pedí", "dormí", "fui"], ["(tú, vos)", "pediste", "dormiste", "fuiste"], ["(él / ella, usted)", "pidió", "durmió", "fue"], ["(nosotros/as)", "pedimos", "dormimos", "fuimos"], ["(vosotros/as)", "pedisteis", "dormisteis", "fuisteis"], ["(ellos / ellas, ustedes)", "pidieron", "durmieron", "fueron"]]}, "uso": "<p><b>Cierre vocálico en la raíz: e &gt; i, o &gt; u</b></p><p>Esta irregularidad solo afecta a algunos verbos de la tercera conjugación (-ir) que también tienen irregularidades vocálicas en presente (dormir → duermo; sentir → siento; pedir → pido). Estos verbos cambian e por i y o por u en la tercera persona del singular y en la tercera del plural del pretérito indefinido.</p><p><b>Cambio de raíz y terminaciones irregulares</b></p><p>Hay un grupo de verbos que tienen una raíz diferente en pretérito indefinido. Todos tienen las mismas terminaciones irregulares (-e, -iste, -o, -imos, -isteis, -ieron), independientemente de la conjugación a la que pertenezcan.<br>-AR: andar → anduv- · estar → estuv-<br>-ER: poder → pud- · poner → pus- · querer → quis- · saber → sup- · tener → tuv- · hacer → hic- / hiz- · traer* → traj-<br>-IR: venir → vin- · conducir* → conduj- · decir* → dij-</p><p>* En la tercera persona del plural, la i desaparece (condujeron, dijeron, trajeron…). Todos los verbos terminados en -ucir se conjugan así (producir → produje, deducir → deduje, reducir → reduje…).</p><p><b>⚠ Atención</b><br>En los verbos regulares, la sílaba tónica de la primera y de la tercera persona del singular es la última. En cambio, en los verbos irregulares, es la penúltima:<br>ha-blé / co-mí, pero es-tu-ve / di-je<br>ha-bló / co-mió, pero es-tu-vo / di-jo</p><p><b>Verbos ir y ser</b><br>Los verbos ir y ser tienen la misma forma en pretérito indefinido.</p><p>pág. 246</p>"}, {"n": "Pretérito imperfecto", "fr": "Del apéndice del libro", "tabla": {"cab": ["", "HABLAR", "BEBER", "VIVIR", "SER", "IR", "VER"], "filas": [["(yo)", "hablaba", "bebía", "vivía", "era", "iba", "veía"], ["(tú, vos)", "hablabas", "bebías", "vivías", "eras", "ibas", "veías"], ["(él / ella, usted)", "hablaba", "bebía", "vivía", "era", "iba", "veía"], ["(nosotros/as)", "hablábamos", "bebíamos", "vivíamos", "éramos", "íbamos", "veíamos"], ["(vosotros/as)", "hablabais", "bebíais", "vivíais", "erais", "ibais", "veíais"], ["(ellos / ellas, ustedes)", "hablaban", "bebían", "vivían", "eran", "iban", "veían"]]}, "uso": "<p>Casi no hay irregularidades en el pretérito imperfecto, a excepción de los verbos ser, ir y ver.</p><p>Usamos el pretérito imperfecto para describir personas, objetos o situaciones del pasado.<br>· Ayer vi a Marta a las 10. Estaba cansada y llevaba la ropa del trabajo.<br>· La casa de mis abuelos era enorme y tenía muchas habitaciones.</p><p>También describimos con pretérito imperfecto las circunstancias que rodean a un acontecimiento del pasado.<br>· Como estábamos cansados, volvimos pronto a casa.<br>· Ayer no tenía ganas de estar en casa y me fui al cine.</p><p>Usamos este tiempo también para hablar de costumbres en el pasado.<br>· De niño, siempre iba a visitar a mis abuelos al campo.<br>· En mi época de estudiante, dormía muy poco.<br>· De joven, en verano, me levantaba muy tarde e iba directamente a la playa.</p><p>págs. 246-247</p>"}, {"n": "Relatar en pasado", "fr": "Del apéndice del libro", "uso": "<p>Un relato es una sucesión de hechos que contamos utilizando el pretérito indefinido o el pretérito perfecto. Hacemos avanzar la historia con cada nuevo hecho que presentamos.<br>· Aquel día Juan no oyó el despertador y se despertó media hora tarde. Salió de casa sin desayunar y tomó un taxi. Por suerte, consiguió llegar a tiempo al aeropuerto.</p><p>En cada hecho podemos «detener la acción» y «mirar» las circunstancias que lo rodean. Para ello, usamos el pretérito imperfecto.<br>· Aquel día Juan estaba muy cansado y no oyó el despertador, así que se despertó media hora tarde. Como no tenía tiempo, salió de casa sin desayunar y tomó un taxi. Por suerte, no había mucho tráfico y consiguió llegar al aeropuerto a tiempo.</p><p>pág. 247</p>"}, {"n": "El imperativo", "fr": "Del apéndice del libro", "tabla": {"cab": ["", "COMPRAR", "COMER", "VIVIR", "SER", "IR"], "filas": [["(tú, vos)", "compra, comprá", "come, comé", "vive, viví", "sé", "ve"], ["(vosotros/as)", "comprad", "comed", "vivid", "sed", "id"], ["(usted)", "compre", "coma", "viva", "sea", "vaya"], ["(ustedes)", "compren", "coman", "vivan", "sean", "vayan"]]}, "uso": "<p>El imperativo afirmativo en español tiene cinco formas: tú, vos, vosotros/as (más informal), usted y ustedes (más formal).</p><p>Las formas tú y vos del imperativo son iguales que en el presente sin la -s final: compras → compra; comes → come; vives → vive.</p><p>La forma vosotros del imperativo es igual que el infinitivo, pero acabado en -d y no en -r: estudiar → estudiad; comer → comed; cerrar → cerrad.</p><p>Las formas usted y ustedes son como las del presente, pero cambiando la vocal de la conjugación: estudia → estudie / estudien; come → coma / coman; escribe → escriba / escriban.</p><p><b>⚠ Atención</b><br>Los verbos que en presente de indicativo tienen las irregularidades e &gt; ie, o &gt; ue y e &gt; i mantienen esas irregularidades en las formas tú, usted y ustedes del imperativo: piensas → piensa, piense; duermes → duerme, duerma; pides → pide, pida.</p><p><b>Hay ocho verbos que tienen un imperativo irregular para la forma tú:</b><br>poner → pon · hacer → haz · venir → ven · ir → ve · salir → sal · tener → ten · decir → di · ser → sé</p><p><b>Para saber más</b><br>Los verbos que son irregulares en la primera persona del presente de indicativo (poner → pongo, hacer → hago, decir → digo…) presentan esa misma irregularidad en las formas de imperativo usted y ustedes: ponga/n, haga/n, salga/n, tenga/n, venga/n, diga/n, traiga/n, conozca/n.</p><p><b>⚠ Atención</b><br>En los verbos pronominales, cuando combinamos la forma de vosotros con el pronombre -os desaparece la -d final: Niños, sentaos y tomaos la sopa.</p><p>Con el imperativo afirmativo, los pronombres van después del verbo y forman una sola palabra.<br>· ¿Me pones un café? Y ponme también una tostada.<br>· Devuélveme las llaves y vete.</p><p><b>Usos:</b> dar instrucciones (Retire el plástico protector y coloque el aparato sobre una superficie estable); conceder permiso (¿Puedo entrar un momento? ○ Sí, claro. Pasa, pasa); ofrecer algo (Toma, prueba estas galletas. Están buenísimas); y aconsejar (Ponte el traje azul, ¿no? Te queda muy bien).</p><p>págs. 247-248</p>"}, {"n": "El gerundio", "fr": "Del apéndice del libro", "uso": "<p>TRABAJAR: trabajando · COMER: comiendo · ESCRIBIR: escribiendo</p><p>El gerundio se forma añadiendo la terminación -ando a los verbos en -ar y la terminación -iendo a los verbos en -er / -ir.</p><p>Son irregulares los gerundios de los verbos en -ir cuando la última vocal de la raíz es e u o (pedir, sentir, seguir, decir, reír, freír, mentir, dormir, morir…):<br>dormir → durmiendo · sentir → sintiendo · pedir → pidiendo</p><p>Cuando la raíz de los verbos en -er o en -ir acaba en vocal, la terminación del gerundio es -yendo:<br>traer → trayendo · construir → construyendo</p><p><b>⚠ Atención</b><br>Con el gerundio, los pronombres se colocan después del verbo, formando una sola palabra.<br>· Puedes mejorar tu español relacionándote con nativos.</p><p><b>Para saber más</b><br>Usamos el gerundio para explicar cómo se hace una acción.<br>· ¿Cómo consigues estar tan joven? ○ Pues haciendo ejercicio todos los días y comiendo sano.</p><p>pág. 249</p>"}, {"n": "Estar + gerundio", "fr": "Del apéndice del libro", "tabla": {"cab": ["", "ESTAR", "+ GERUNDIO"], "filas": [["(yo)", "estoy", "trabajando"], ["(tú, vos)", "estás", "trabajando"], ["(él / ella, usted)", "está", "comiendo"], ["(nosotros/as)", "estamos", "comiendo"], ["(vosotros/as)", "estáis", "viviendo"], ["(ellos / ellas, ustedes)", "están", "viviendo"]]}, "uso": "<p>Usamos estar + gerundio cuando queremos especificar que la acción se está desarrollando en este momento preciso en el que estamos hablando.<br>· No te puede oír ahora, está escuchando música en su cuarto.<br>· No puede ponerse al teléfono, se está duchando.</p><p>También usamos estar + gerundio para expresar que una actividad ha empezado, pero no ha terminado, aunque no esté realizándose justo en este momento.<br>· ¿Qué libro me recomiendas? ○ Pues ahora estoy leyendo uno de terror muy bueno. (= Ahora mismo no está leyendo, pero empezó el libro y todavía no lo ha terminado.)</p><p>pág. 249</p>"}, {"n": "Se impersonal", "fr": "Del apéndice del libro", "uso": "<p>En español, podemos expresar impersonalidad (no concretar quién realiza la acción del verbo o expresar que todo el mundo lo hace así) de varias maneras. Una de ellas es con la construcción se + verbo en tercera persona.<br>· En español, se puede expresar la impersonalidad con se + verbo en tercera persona del singular. (= En general, todo el mundo puede expresarla así).<br>· El presente se utiliza mucho en español. (= En general, todo el mundo lo usa mucho).<br>· La tortilla española se hace con patatas, huevos y cebollas. (= En general, todo el mundo la hace así).<br>· En España se cena muy tarde. (= En general, todo el mundo cena muy tarde).</p><p>pág. 249</p>"}, {"n": "Tablas de conjugación", "fr": "Del apéndice del libro", "uso": "<p>El libro cierra el apéndice con las tablas completas de conjugación (págs. 250-253).</p><p><b>Modelos regulares:</b> estudiar (-ar), comer (-er), vivir (-ir).</p><p><b>Verbos irregulares recogidos en las tablas:</b><br>actuar · adquirir · andar · averiguar · buscar · caer · coger · colgar · comenzar · conducir · conocer · contar · dar · decir · dirigir · distinguir · dormir · enviar · estar · fregar · haber · hacer · incluir · ir · jugar · leer · llegar · mover · oír · pensar · perder · poder · poner · querer · reír · reunir · saber · salir · sentir · ser · servir · tener · traer · utilizar · valer · vencer · venir · ver</p><p>Cada tabla del libro da, para cada verbo, el gerundio, el participio y las seis personas del presente, del pretérito imperfecto, del pretérito indefinido, del pretérito perfecto y del imperativo afirmativo. Puedes consultar cualquiera de estas formas con el analizador de verbos de la app.</p><p>págs. 250-253</p>"}];

const sinTildes=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');

// distance de Levenshtein
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);
  for(let i=1;i<=m;i++){cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];}
  return prev[n];
}

const variantes=r=>String(r).split('/').map(x=>x.replace(/\(.*?\)/g,'').trim()).filter(Boolean);

// renvoie {e:'bien'|'casi'|'mal', nota:''}
function evaluar(dado, esperado, estricto){
  const d=String(dado).trim();
  if(!d) return {e:'mal',nota:''};
  const dn=limpia(d);
  const vs=variantes(esperado);
  // 1. correspondance exacte, accents compris
  for(const v of vs){
    if(sinTildes(d.toLowerCase().trim())===sinTildes(v.toLowerCase()) && d.toLowerCase().trim()===v.toLowerCase())
      return {e:'bien',nota:''};
  }
  // 2. correcte mais accents manquants ou en trop
  for(const v of vs){
    if(limpia(d)===limpia(v)){
      if(estricto) return {e:'mal',nota:'La forma correcta lleva tilde: <b>'+v+'</b>. En el nivel difícil las tildes cuentan.'};
      return {e:'casi',nota:'Correcto, pero ojo con la tilde: se escribe <b>'+v+'</b>.'};
    }
  }
  // 3. pronom réfléchi oublié ou ajouté
  for(const v of vs){
    const vp=limpia(v), sinPron=vp.replace(/^(me|te|se|nos|os) /,'');
    if(dn===sinPron && vp!==sinPron)
      return {e:'casi',nota:'Falta el pronombre: es un verbo pronominal, <b>'+v+'</b>.'};
    if(limpia(dn.replace(/^(me|te|se|nos|os) /,''))===vp && dn!==vp)
      return {e:'casi',nota:'Sobra el pronombre: aquí basta con <b>'+v+'</b>.'};
  }
  // 4. article défini oublié ou ajouté (noms)
  for(const v of vs){
    const vp=limpia(v), sinArt=vp.replace(/^(el|la|los|las|un|una) /,'');
    if(dn===sinArt && vp!==sinArt)
      return {e:'casi',nota:'Bien, aunque en el libro aparece con artículo: <b>'+v+'</b>.'};
    if(dn.replace(/^(el|la|los|las|un|una) /,'')===vp && dn!==vp)
      return {e:'casi',nota:'Bien, aunque aquí no hace falta el artículo: <b>'+v+'</b>.'};
  }
  // 5. faute de frappe légère
  for(const v of vs){
    const vp=limpia(v);
    const dist=lev(dn,vp);
    const umbral = vp.length<=4?0 : vp.length<=8?1 : 2;
    if(dist>0 && dist<=umbral && !estricto)
      return {e:'casi',nota:'Casi: hay una errata. La forma correcta es <b>'+v+'</b>.'};
  }
  // 6. bon mot, mauvaise terminaison (même radical)
  for(const v of vs){
    const vp=limpia(v);
    if(vp.length>4 && dn.length>4 && vp.slice(0,Math.min(4,vp.length-2))===dn.slice(0,Math.min(4,vp.length-2)) && !estricto)
      return {e:'mal',nota:'La raíz es correcta, pero la terminación no. Se dice <b>'+v+'</b>.'};
  }
  return {e:'mal',nota:''};
}

// Impératifs irréguliers de la 2ᵉ personne
const IMPERATIVOS={pon:"poner",haz:"hacer",ven:"venir",sal:"salir",ten:"tener",

function pronominal(k){ // sépare un pronom réfléchi collé ou détaché

function desconjugar(palabra){
  let k=limpia(palabra);

  if(enc && enc[1].length>2) candidatas.push(enc[1]);

    if(VERBN[c]) return {...VERBN[c],tiempo:'infinitivo',refl:refl||c!==k};
    if(VERBN[c+'se']) return {...VERBN[c+'se'],tiempo:'infinitivo',refl:true};
    if(IMPERATIVOS[c]){ const inf=IMPERATIVOS[c];
      if(VERBN[limpia(inf)]) return {inf,fr:VERBOS[inf],tiempo:'imperativo, 2.ª pers. sing.',refl:refl||c!==k}; }

          tiempo:/^(tendr|pondr|vendr|saldr|podr|sabr|querr|habr|har|dir|valdr)/.test(r)?'futuro o condicional':'indefinido (raíz irregular)',refl};
      }
    }
    const orig=String(palabra).toLowerCase().replace(/^(me|te|se|nos|os)\s+/,'');
    for(const [des,tiempo,tipo] of DESINENCIAS){
      const d=limpia(des);

      // así «siento» (presente) no se confunde con «-ó» del indefinido

      if(!/[áéíóú]/.test(des) && /[áéíóú]/.test(orig.slice(-des.length))) continue;
      if(!d || !c.endsWith(d) || c.length<=d.length) continue;

        // (no se aplica si ya hemos quitado un pronombre: daría falsos positivos)
        if(c===k) DIPTONGOS.forEach(([a,b])=>{

          if(i>0) pruebas.push(raiz.slice(0,i)+b+raiz.slice(i+a.length)+t);
        });
        // changements orthographiques : busqu- → busc-, lleg- → lleg-, empec- → empez-
        pruebas.push(raiz.replace(/qu$/,'c')+t, raiz.replace(/gu$/,'g')+t,
                     raiz.replace(/c$/,'z')+t, raiz.replace(/zc$/,'c')+t, raiz.replace(/g$/,'j')+t,

/* ═══════════ Descomposición de formas con pronombre ═══════════ */
const PRON={me:["me","à moi / me, moi"],te:["te","à toi / te, toi"],se:["se","réfléchi : à soi / se"],
 nos:["nos","à nous / nous"],os:["os","à vous / vous"],lo:["lo","le (COD masculin) ou cela"],
 la:["la","la (COD féminin)"],los:["los","les (COD masculin)"],las:["las","les (COD féminin)"],
 le:["le","lui (COI)"],les:["les","leur (COI)"]};
const ORDEN=["nos","os","me","te","se","los","las","les","lo","la","le"];

// Separa un verbo de los pronombres pegados al final
function descomponer(palabra){
  const k0=limpia(palabra);
  // se prueban todas las divisiones posibles: 1 o 2 pronombres
  const cortes=[];
  for(const p1 of ORDEN){
    if(k0.length>p1.length+1 && k0.endsWith(p1)){
      const r1=k0.slice(0,k0.length-p1.length);
      cortes.push({base:r1,pron:[p1]});
      for(const p2 of ORDEN){
        if(r1.length>p2.length+1 && r1.endsWith(p2))
          cortes.push({base:r1.slice(0,r1.length-p2.length),pron:[p2,p1]});
      }
    }
  }
  // se prueba primero la división más completa (dos pronombres)
  cortes.sort((a,b)=>b.pron.length-a.pron.length);
  for(const c of cortes){
    const b=c.base;
    let v=VERBN[b]?{...VERBN[b],tiempo:'infinitivo'}
        : IMPERATIVOS[b]&&VERBN[limpia(IMPERATIVOS[b])]
          ?{inf:IMPERATIVOS[b],fr:VERBOS[IMPERATIVOS[b]],tiempo:'imperativo'}
        : desconjugar(b);
    if(!v) continue;
    let forma=null, cuando='';
    if(v.tiempo==='infinitivo'){
      forma='infinitivo';
      cuando='Le pronom se soude à l\'infinitif quand celui-ci dépend d\'un autre verbe ou d\'une tournure : <i>hay que guardar<b>lo</b></i>, <i>quiero ver<b>te</b></i>, <i>voy a decír<b>selo</b></i>. On peut aussi le placer devant le verbe conjugué, sans rien changer au sens : <i><b>lo</b> hay que guardar</i>, <i><b>te</b> quiero ver</i>.';
    } else if(v.tiempo==='gerundio'){
      forma='gerundio';
      cuando='Le pronom se soude au gérondif : <i>está duchándo<b>se</b></i>. Avec <i>estar + gerundio</i>, il peut aussi passer devant l\'auxiliaire : <i><b>se</b> está duchando</i> — les deux tournures sont correctes et équivalentes.';
    } else if(/imperativo|subjuntivo/.test(v.tiempo) || /presente, 3\.ª pers\. sing\./.test(v.tiempo)
              || /presente, 2\.ª pers\. pl\./.test(v.tiempo)) {
      // con pronombre pegado, una forma así solo puede ser imperativo
      forma='imperativo afirmativo';
      cuando='À l\'impératif <b>affirmatif</b>, le pronom se soude obligatoirement au verbe : <i>láva<b>te</b></i>, <i>dí<b>melo</b></i>, <i>pon<b>te</b> la mascarilla</i>. À l\'impératif <b>négatif</b>, c\'est l\'inverse : il passe devant et reste détaché — <i>no <b>te</b> laves</i>, <i>no <b>me lo</b> digas</i>.';
    } else continue;
    return {verbo:v.inf, base:b, pron:c.pron, forma, cuando, fr:v.fr};
  }
  return null;
}

/* ═══════════ Notes contextuelles ═══════════ */
// Analyse la phrase pour préciser l'emploi du mot cliqué
function notaContexto(pal, frase){
  if(!frase) return null;
  const p=limpia(pal), f=' '+limpia(frase)+' ';
  const sig=(f.split(' '+p+' ')[1]||'').trim().split(' ')[0]||'';
  const R=[];
  if(p==='es'||p==='son'||p==='soy'||p==='eres'||p==='era'||p==='eran'||p==='fue'||p==='somos')
    R.push('Aquí es el verbo <b>SER</b>. Marca lo que algo <i>es</i> de manera estable: identidad, profesión, descripción o materia — no un estado pasajero.');
  if(p==='esta'||p==='estan'||p==='estoy'||p==='estas'||p==='estaba'||p==='estamos'||p==='estuve'||p==='estuvo'){
    if(/ando |iendo |yendo /.test(f.split(' '+p+' ')[1]||''))
      R.push('Aquí <b>ESTAR</b> forma la perífrasis <b>estar + gerundio</b>: la acción está ocurriendo en ese momento.');
    else if(/^(en|a|cerca|lejos|dentro|encima|debajo|detras|delante|aqui|alli|ahi)$/.test(sig))
      R.push('Aquí <b>ESTAR</b> indica la <b>localización</b>: dónde se encuentra algo o alguien.');
    else
      R.push('Aquí <b>ESTAR</b> indica un <b>estado</b> — cómo está algo o alguien en este momento, y no cómo es de manera permanente.');
  }
  if(p==='he'||p==='has'||p==='ha'||p==='hemos'||p==='habeis'||p==='han')
    R.push('Aquí es el auxiliar <b>HABER</b>: forma el pretérito perfecto con el participio que viene justo después. No se traduce solo.');
  if(p==='hay') R.push('Forma impersonal de <b>HABER</b>: «il y a». Solo existe en singular, aunque lo que siga esté en plural.');
  if(p==='hace'&&/\b(anos|meses|dias|semanas|tiempo)\b/.test(f))
    R.push('Aquí <b>hace</b> no significa «fait» sino «il y a»: mide el tiempo transcurrido desde un momento pasado.');
  if(p==='lo'){
    if(/^(mas|mejor|peor|unico|importante|dificil|facil)$/.test(sig))
      R.push('Aquí <b>lo</b> es el artículo neutro: <i>lo más difícil</i> = «le plus difficile». Sustantiva un adjetivo.');
    else R.push('Aquí <b>lo</b> es el pronombre de objeto directo masculino o neutro: sustituye a algo ya mencionado.');
  }
  if(p==='se'){
    if(/^(lava|lavan|pela|pelan|corta|cortan|come|hace|hacen|echa|echan|frie|frien|cuece|cuecen|bate|baten|mezcla|mezclan|produjo|produjeron|aprobo|restablecieron)$/.test(sig))
      R.push('Aquí <b>se</b> es impersonal o pasivo reflejo: no se dice quién hace la acción. <i>Se pelan las patatas</i> = «on épluche les pommes de terre».');
    else R.push('Aquí <b>se</b> es el pronombre reflexivo o recíproco de tercera persona: la acción recae sobre el propio sujeto, o es mutua.');
  }
  if(p==='que'&&/^(que|cual|quien|bien|pena|maravilla|horror|emocion|verguenza|miedo|alegria|nervios|dia|guapo|bonito)$/.test(sig))
    R.push('Aquí <b>qué</b> es exclamativo y lleva tilde: <i>¡Qué maravilla!</i>');
  if(p==='como'&&/ tan | tanto | igual /.test(f))
    R.push('Aquí <b>como</b> cierra una comparación de igualdad: <i>tan… como</i>, <i>tanto… como</i>.');
  if(p==='ya'&&/ no /.test(f.split(' '+p+' ')[1]||' '))
    R.push('Aquí forma <b>ya no</b>: marca que algo ha dejado de ocurrir.');
  if(p==='mas'&&/ que /.test(f)) R.push('Aquí <b>más… que</b> forma un comparativo de superioridad.');
  if(p==='menos'&&/ que /.test(f)) R.push('Aquí <b>menos… que</b> forma un comparativo de inferioridad.');
  if(p==='por'&&/ que /.test(f)) R.push('Cuidado: <b>por qué</b> (separado, con tilde) pregunta la causa; <b>porque</b> (junto) la explica.');
  if(p==='desde'&&/ hace /.test(f.split(' '+p+' ')[1]||''))
    R.push('Aquí forma <b>desde hace</b> + duración: «depuis deux mois». Con un momento concreto sería solo <i>desde</i>.');
  return R.length?R.join('<br><br>'):null;
}

// ¿La traducción de una palabra suelta revela la respuesta entera?
const VIDES_FR=new Set(['le','la','les','un','une','des','de','du','au','aux','à','en','et','ou','se','sa','son','ses','qui','que']);
function contenido(s){
  return limpia(s).split(' ').filter(w=>w.length>2 && !VIDES_FR.has(w));
}
function revela(frComp, frResp){
  if(!frComp||!frResp) return false;
  const comp=new Set(contenido(frComp));
  if(!comp.size) return false;
  return frResp.split('/').map(x=>contenido(x)).filter(a=>a.length)
    .some(r=>r.every(w=>comp.has(w)));
}

/* ═══════════ Recherche d'un mot ═══════════ */
function buscar(pal, estricto, sinVoc){
  const k=limpia(pal);
  if(!k) return null;
  // la forma exacta con tilde manda: «sé» no es «se», «tú» no es «tu»
  const x=String(pal).toLowerCase().trim();
  if(typeof DICX!=='undefined' && DICX[x]){
    // una entrada que solo describe una forma verbal no debe tapar al nombre
    if(!(NOMBRES[k] && /imperativo|pers\./i.test(DICX[x].cat||'')))
      return {...DICX[x],tipo:'dic',pal};
  }
  if(x!==k && typeof GENX!=='undefined' && GENX[x]) return {tipo:'gen',pal,fr:GENX[x].fr};
  if(x===k && typeof GENX!=='undefined' && GENX[x] && !DICN[k] && !NOMBRES[k] && !EXPRN[k])
    return {tipo:'gen',pal,fr:GENX[x].fr};
  if(x===k && typeof GENX!=='undefined' && GENX[x] && DICN[k] && DICN[k].clave!==x)
    return {tipo:'gen',pal,fr:GENX[x].fr};
  // la tilde puede marcar una forma verbal: «pasó» no es «paso», «entré» no es «entre»
  if(x!==k && !(typeof NOMBRES!=='undefined' && NOMBRES[k] && limpia(NOMBRES[k].es||'').split(' ').pop()===x)){
    const vt=desconjugar(pal);
    if(vt && vt.tiempo!=='infinitivo')
      return {tipo:'verbo',pal,fr:vt.fr,inf:vt.inf,tiempo:vt.tiempo,refl:vt.refl};
  }
  if(EXPRN[k]) return {tipo:'expr',pal,fr:EXPRN[k]};
  // si la entrada gramatical es solo una forma verbal y el nombre existe, manda el nombre
  if(DICN[k] && NOMBRES[k] && /imperativo|pers\./i.test(DICN[k].cat||''))
    return {...NOMBRES[k],tipo:'nom',pal};
  if(DICN[k]) return {...DICN[k],tipo:'dic',pal};
  // un nom isolé : on donne sa forme avec article et son genre
  if(NOMBRES[k]) return {...NOMBRES[k],tipo:'nom',pal};
  // l'entrée de vocabulaire ne vaut que si elle correspond au mot entier
  if(!sinVoc && IDX[k] && !IDX[k].parcial) return {...IDX[k],tipo:'voc',pal};
  // un infinitivo del diccionario gana al fragmento de una expresión
  if(typeof VERBN!=='undefined' && VERBN[k] && (!IDX[k] || IDX[k].parcial))
    return {tipo:'verbo',pal,fr:VERBN[k].fr,inf:VERBN[k].inf,tiempo:'infinitivo'};
  if(GENN[k] && (x===k || limpia(GENN[k].clave||'')===k && (GENN[k].clave||'')===x))
    return {tipo:'gen',pal,fr:GENN[k].fr};
  if(GENN[k] && x!==k){
    // «entré» no es «entre»: primero se prueba el análisis verbal
    const vx=desconjugar(pal);
    if(vx) return {tipo:'verbo',pal,fr:vx.fr,inf:vx.inf,tiempo:vx.tiempo,refl:vx.refl};
    return {tipo:'gen',pal,fr:GENN[k].fr};
  }
  if(estricto) return null;
  // una forma conjugada simple manda sobre una descomposición dudosa
  const vb0=desconjugar(pal);
  if(!vb0 && typeof descomponer!=='undefined'){
    const d0=descomponer(pal);
    if(d0) return {tipo:'verbo',pal,fr:d0.fr,inf:d0.verbo,tiempo:d0.forma,refl:true};
  }
  if(vb0 && vb0.tiempo!=='infinitivo')
    return {tipo:'verbo',pal,fr:vb0.fr,inf:vb0.inf,tiempo:vb0.tiempo,refl:vb0.refl};
  // formes dérivées : pluriel, genre
  const vs=[k.replace(/ces$/,'z'),k.replace(/ones$/,'on'),k.replace(/nes$/,'n'),k.replace(/res$/,'r'),
    k.replace(/les$/,'l'),k.replace(/des$/,'d'),k.replace(/ses$/,'s'),k.replace(/yes$/,'y'),
    k.replace(/es$/,''),k.replace(/s$/,''),k.replace(/as$/,'a'),k.replace(/os$/,'o'),
    k.replace(/a$/,'o'),k.replace(/as$/,'o'),k.replace(/os$/,'a'),k.replace(/a$/,''),k.replace(/o$/,'')]
    .filter((v,i,a)=>v&&v!==k&&a.indexOf(v)===i);
  for(const v of vs){
    if(v===k||!v) continue;
    if(DICN[v]) return {tipo:'dic',pal,...DICN[v],base:DICN[v].base||DICN[v].clave};
    if(NOMBRES[v]) return {...NOMBRES[v],tipo:'nom',pal,plural:v!==k};
    if(!sinVoc && IDX[v] && !IDX[v].parcial) return {tipo:'voc',pal,...IDX[v],base:v};
  }
  // antes de dar el sentido de una expresión, se prueba el singular o el masculino
  for(const v of vs){ if(v!==k && GENN[v]) return {tipo:'gen',pal,fr:GENN[v].fr,base:v} }
  if(!sinVoc && IDX[k]) return {tipo:'voc',pal,...IDX[k]};
  if(!sinVoc) for(const v of vs){ if(v!==k && IDX[v]) return {tipo:'voc',pal,...IDX[v],base:v} }
  // un nombre propio nunca se analiza como verbo
  if(PROPN.has(k)) return {tipo:'propio',pal,fr:'Nombre propio — no se traduce.'};
  if(FORMAS_X[k]){ const [inf,t]=FORMAS_X[k];
    const fr=(VERBN[limpia(inf.split(' ')[0])]||{}).fr||'';
    return {tipo:'verbo',pal,fr,inf,tiempo:t}; }
  // formas con pronombre pegado: dímelo, duchándose, espéreme…
  if(typeof descomponer!=='undefined'){
    const dd=descomponer(pal);
    if(dd) return {tipo:'verbo',pal,fr:dd.fr,inf:dd.verbo,tiempo:dd.forma,refl:true};
  }
  // superlativo absoluto: carísimo → caro
  const sup=k.match(/^(.+?)(isimo|isima|isimos|isimas)$/);
  if(sup){
    const raiz=sup[1].replace(/qu$/,'c').replace(/gu$/,'g').replace(/c$/,'z');
    for(const term of ['o','a','e','',]){
      const base=raiz+term;
      const hit=DICN[base]||NOMBRES[base]||GENN[base]||IDX[base];
      if(hit&&hit.fr) return {tipo:'sup',pal,fr:'très '+hit.fr,base,cat:'superlativo absoluto'};
    }
  }
  // dernier recours : analyser la forme verbale
  const vb=desconjugar(pal);
  if(vb) return {tipo:'verbo',pal,fr:vb.fr,inf:vb.inf,tiempo:vb.tiempo,refl:vb.refl};
  // dictionnaire général
  if(GENN[k]) return {tipo:'gen',pal,fr:GENN[k].fr};
  for(const v of vs){ if(v!==k && GENN[v]) return {tipo:'gen',pal,fr:GENN[v].fr,base:v} }
  if(PROPN.has(k)) return {tipo:'propio',pal,fr:'Nombre propio — no se traduce.'};
  return null;
}

// El determinante que precede decide entre nombre y verbo
const DETERM=new Set(['el','la','los','las','un','una','unos','unas','mi','tu','su','mis','tus','sus',
'nuestro','nuestra','nuestros','nuestras','vuestro','vuestra','vuestros','vuestras','este','esta',
'estos','estas','ese','esa','esos','esas','aquel','aquella','aquellos','aquellas','del','al','otro',
'otra','otros','otras','mucho','mucha','muchos','muchas','poco','poca','pocos','pocas','algun','alguna',
'algunos','algunas','todo','toda','todos','todas','cada','dos','tres','cuatro','cinco','varios','varias',
'cuanto','cuantos','cuantas','tanto','tantos','tantas','cualquier','ningun','ninguna','sin','con','de','en','por','para']);
// se comparan con tilde: «tú marcas» es verbo, «tus marcas» es nombre
const PRON_SUJ=new Set(['yo','tú','él','ella','usted','nosotros','nosotras','vosotros','vosotras',
'ellos','ellas','ustedes','no','me','te','nos','os','ya','siempre','nunca','también','tampoco',
'quién','cuándo','apenas','casi']);

// Ajusta el sentido según lo que rodea a la palabra
function sentidoContextual(pal, inf, frase){
  if(typeof SENTIDOS==='undefined') return null;
  const clave = SENTIDOS[inf] ? inf : (SENTIDOS[limpia(pal)] ? limpia(pal) : null);
  if(!clave || !frase) return null;
  for(const [re,fr,nota] of SENTIDOS[clave]) if(re.test(frase)) return {fr,nota};
  return null;
}

/* ═══════════ Feuille de consultation ═══════════ */
function abrirHoja(pal, frase, vec, bloq, bloqFr){
  let r=null, etiqueta=pal;
  // si un contenido está protegido (la respuesta del ejercicio), no se amplía a la expresión
  if(bloq) vec=null;
  if(vec){
    const cands=[[vec.p2,vec.p1,pal],[vec.p1,pal,vec.s1],[pal,vec.s1,vec.s2],[vec.p1,pal],[pal,vec.s1]];
    for(const c of cands){
      if(c.some(x=>!x)) continue;
      const fr=c.join(' '), hit=buscar(fr,true);
      if(hit){ r=hit; etiqueta=fr; break }
    }
  }
  const entorno = frase || [vec&&vec.p2,vec&&vec.p1,pal,vec&&vec.s1,vec&&vec.s2].filter(Boolean).join(' ');
  if(!r) r=buscar(pal, false, !!bloq);
  // el complemento decide el sentido: contar anécdotas ≠ contar dinero
  if(r){
    let cl=r.inf||r.base||r.clave||limpia(pal);
    // «Cuento contigo»: si una regla verbal encaja, el verbo gana al nombre
    if(r.tipo==='nom' && typeof SENTIDOS!=='undefined'){
      const v=desconjugar(pal);
      if(v && SENTIDOS[v.inf] && SENTIDOS[v.inf].some(x=>x[0].test(entorno||''))){
        r={tipo:'verbo',pal,fr:v.fr,inf:v.inf,tiempo:v.tiempo,refl:v.refl}; cl=v.inf;
      }
    }
    const sc=sentidoContextual(pal, cl, entorno);
    if(sc){ r={...r, fr:sc.fr, notaSentido:sc.nota} }
  }
  // ¿el contexto contradice la lectura elegida?
  if(r && vec && vec.p1){
    const antRaw=String(vec.p1).toLowerCase().trim();
    const ant=limpia(vec.p1), k0=limpia(pal);
    const nom = NOMBRES[k0] || NOMBRES[k0.replace(/es$/,'')] || NOMBRES[k0.replace(/s$/,'')]
             || NOMBRES[k0.replace(/ces$/,'z')];
    if(DETERM.has(ant) && !PRON_SUJ.has(antRaw) && r.tipo==='verbo' && nom){
      const pl = nom!==NOMBRES[k0];
      r = {...nom, tipo:'nom', pal, plural:pl};
    } else if(PRON_SUJ.has(antRaw) && r.tipo==='nom'){
      const vb=desconjugar(pal);
      if(vb && vb.tiempo!=='infinitivo')
        r = {tipo:'verbo',pal,fr:vb.fr,inf:vb.inf,tiempo:vb.tiempo,refl:vb.refl};
    }
  }
  // si aun así aparece la entrada protegida, se busca solo la palabra suelta
  if(r && bloq && limpia(r.frase||'')===limpia(bloq)) r=buscar(pal, false, true);
  // forma con pronombre pegado: se analiza antes para dar la categoría correcta
  const dc=descomponer(pal);
  if(dc && r && r.tipo==='verbo') r.tiempo=dc.forma;
  // ¿hay que ocultar la traducción? Sí cuando daría la respuesta del ejercicio
  let oculto=false;
  if(bloq){
    const ART=/^(el|la|los|las|un|una|unos|unas|al|del)$/;
    const trozos=limpia(bloq).split(' ').filter(Boolean);
    const clave=trozos.filter(w=>!ART.test(w));
    // (a) la tarjeta es una sola palabra: cualquier traducción sería la respuesta
    if(clave.length<=1 && trozos.includes(limpia(pal))) oculto=true;
    // (b) la entrada encontrada coincide exactamente con lo que hay que adivinar
    if(r && (limpia(r.es||'')===limpia(bloq) || limpia(r.frase||'')===limpia(bloq)
             || limpia(etiqueta)===limpia(bloq))) oculto=true;
    // (c) la traducción de la palabra cubriría toda la respuesta
    if(r && bloqFr && revela(r.fr, bloqFr)) oculto=true;
  }
  // pour un nom, on affiche la forme avec article : elle porte le genre
  const titulo = (r&&r.tipo==='nom') ? r.es : etiqueta;
  let h='<div class="hoja-tirador"></div><div class="hoja-pal">'+esc(titulo)+'</div>';
  if(r){
    if(r.tipo==='propio') h+='<div class="hoja-cat">nombre propio</div>';
    else if(r.tipo==='verbo'){
      // en una consigna, «Elige» es imperativo aunque coincida con el presente
      const esConsigna = CONSIGNAS.has(limpia(pal)) &&
        (/presente, 3/.test(r.tiempo) || r.tiempo==='presente') &&
        (!frase || new RegExp('^\\s*'+pal.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(frase) || /^[A-ZÁÉÍÓÚÑ]/.test(pal));
      h+='<div class="hoja-cat">verbo · '+(esConsigna?'imperativo (instrucción)':r.tiempo)+'</div>';
    }
    else if(r.tipo==='nom') h+='<div class="hoja-cat">nombre común · '+(GEN[r.g]||r.g)
      +(r.plural?' · forma plural':'')+'</div>';
    else if(r.cat) h+='<div class="hoja-cat">'+r.cat+'</div>';
    else if(r.tipo==='expr') h+='<div class="hoja-cat">expresión</div>';
    else if(tipoDe(pal)) h+='<div class="hoja-cat">'+tipoDe(pal)+'</div>';
    else if(r.tipo==='voc') h+='<div class="hoja-cat">vocabulario</div>';
    h+= oculto
      ? '<div class="hoja-fr" style="color:var(--suave);font-style:italic">Traducción oculta: es la respuesta de esta ficha. Dale la vuelta y podrás consultarla.</div>'
      : '<div class="hoja-fr">'+esc(r.fr)+'</div>';
    if(!oculto && r.tipo==='nom' && r.pl && limpia(r.pl)!==limpia((r.es||'').replace(/^\S+\s+/,'')))
      h+='<div class="hoja-bloque"><div class="hoja-et">Formas</div><div class="hoja-cuerpo">'
       +'singular <b>'+esc(r.es)+'</b><br>plural <b>'
       +esc((String(r.g).indexOf('femenino')===0?'las ':'los ')+r.pl)+'</b></div></div>';
    if(!oculto && r.tipo==='verbo')
      h+='<div class="hoja-bloque"><div class="hoja-et">Infinitivo</div><div class="hoja-cuerpo"><b>'
       +esc(r.inf)+'</b>'+(r.refl?' <span style="color:var(--suave)">— forma pronominal</span>':'')+'</div></div>';
    // una misma forma puede ser nombre y verbo: se indican las dos lecturas
    if(!oculto){
      const k0=limpia(pal);
      if(r.tipo==='nom'){
        const dg=DICN[k0];
        if(dg && /imperativo|pers\./i.test(dg.cat||''))
          h+='<div class="hoja-bloque"><div class="hoja-et">También puede ser un verbo</div>'
           +'<div class="hoja-cuerpo"><b>'+esc(dg.fr)+'</b>'
           +' <span style="color:var(--suave);font-size:.88em">('+dg.cat+')</span></div></div>';
        const vb=(dg && /imperativo|pers\./i.test(dg.cat||'')) ? null : desconjugar(pal);
        if(vb && vb.tiempo!=='infinitivo')
          h+='<div class="hoja-bloque"><div class="hoja-et">También puede ser un verbo</div>'
           +'<div class="hoja-cuerpo"><b>'+esc(vb.fr)+'</b> — '+esc(vb.inf)
           +' <span style="color:var(--suave);font-size:.88em">('+vb.tiempo+')</span></div></div>';
      } else if((r.tipo==='verbo'||(r.tipo==='dic'&&/imperativo|pers\.|verbo/i.test(r.cat||''))) && NOMBRES[k0]){
        const nb=NOMBRES[k0];
        h+='<div class="hoja-bloque"><div class="hoja-et">También puede ser un nombre</div>'
         +'<div class="hoja-cuerpo"><b>'+esc(nb.es)+'</b> — '+esc(nb.fr)
         +' <span style="color:var(--suave);font-size:.88em">(nombre '+(GEN[nb.g]||nb.g)+')</span></div></div>';
      }
    }
    // forma compuesta: verbo + pronombre(s)
    if(dc){
      h+='<div class="hoja-bloque"><div class="hoja-et">Palabra compuesta</div><div class="hoja-cuerpo">'
       +'<b>'+esc(pal)+'</b> = <b>'+esc(dc.base)+'</b>'
       +dc.pron.map(x=>' + <b>'+x+'</b>').join('')+'<br>'
       +'<span style="color:var(--suave)">'+esc(dc.base)+'</span> — '+esc(dc.fr)+' <span style="color:var(--suave);font-size:.88em">('+dc.forma+')</span><br>'
       +dc.pron.map(x=>'<span style="color:var(--suave)">'+x+'</span> — '+PRON[x][1]).join('<br>')
       +'</div></div>'
       +'<div class="hoja-bloque"><div class="hoja-et">Cuándo se pegan</div><div class="hoja-cuerpo">'+dc.cuando+'</div></div>';
    }
    // si le mot appartient à une expression du livre, on la donne comme emploi, pas comme traduction
    if(!oculto && (r.tipo==='nom'||r.tipo==='dic')){
      const ex=IDX[limpia(pal)];
      const mismo = ex && (limpia(ex.frase)===limpia(pal) || limpia(ex.frase)===limpia(r.es||''));
      if(ex&&ex.parcial&&!mismo)
        h+='<div class="hoja-bloque"><div class="hoja-et">Se usa en</div><div class="hoja-cuerpo"><b>'
         +esc(ex.frase)+'</b> — '+esc(ex.fr)+'</div></div>';
    }
    if(!oculto && r.base && limpia(r.base)!==limpia(etiqueta))
      h+='<div class="hoja-bloque"><div class="hoja-et">Forma base</div><div class="hoja-cuerpo">'+esc(r.base)+'</div></div>';
    // el bloque de uso se calla si menciona justamente lo que hay que adivinar
    const usoDelata = bloq && r.uso && limpia(r.uso).includes(limpia(bloq));
    // nota de uso propia de las expresiones
    if(!oculto && r.tipo==='expr' && typeof USO_EXPR!=='undefined' && USO_EXPR[limpia(etiqueta)])
      h+='<div class="hoja-bloque"><div class="hoja-et">Cuándo se usa</div><div class="hoja-cuerpo">'
       +USO_EXPR[limpia(etiqueta)]+'</div></div>';
    // expresiones corrientes sacadas del diccionario español-francés
    if(!oculto && typeof EXPRDIC!=='undefined'){
      const cl0 = EXPRDIC[limpia(r.inf||'')] ? limpia(r.inf) :
                  (EXPRDIC[limpia(r.base||'')] ? limpia(r.base) :
                  (EXPRDIC[limpia(pal)] ? limpia(pal) : null));
      if(cl0){
        h+='<div class="hoja-bloque"><div class="hoja-et">Expresiones corrientes</div>'
         +'<div class="hoja-cuerpo exp-l">'
         +EXPRDIC[cl0].map(x=>'<div class="exp"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')
         +'</div></div>';
      }
    }
    // acepciones de la Real Academia Española
    if(!oculto && typeof RAEDEF!=='undefined'){
      const nu=limpia((r.es||pal).replace(/^(el|la|los|las|un|una|el\/la)\s+/,'')).split(/[\s\/]/)[0];
      const cl=RAEDEF[nu]?nu:(RAEDEF[limpia(r.inf||'')]?limpia(r.inf):null);
      if(cl){
        h+='<div class="hoja-bloque"><div class="hoja-et">Acepciones (RAE)</div>'
         +'<div class="hoja-cuerpo rae-l">'
         +RAEDEF[cl].map((x,i)=>'<div class="rae"><span class="rae-n">'+(i+1)+'</span>'+esc(x)+'</div>').join('')
         +'</div></div>';
      }
    }
    // cómo se dicen en español las expresiones francesas del mismo campo
    if(!oculto && typeof EXPRFR!=='undefined' && r.fr){
      const nuc=String(r.fr).split(/[;,\/]/)[0].trim().toLowerCase()
        .replace(/^(le |la |les |l'|un |une |des |se |s')/,'').split(/\s+/)[0];
      if(nuc && EXPRFR[nuc]){
        h+='<div class="hoja-bloque"><div class="hoja-et">Del francés al español</div>'
         +'<div class="hoja-cuerpo exp-l">'
         +EXPRFR[nuc].map(x=>'<div class="exp fr"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>').join('')
         +'</div></div>';
      }
    }
    // un verbo polisémico muestra todos sus sentidos, no solo el del contexto
    if(!oculto && typeof SENTIDOS!=='undefined'){
      const cl = SENTIDOS[r.inf] ? r.inf : (SENTIDOS[limpia(pal)] ? limpia(pal) : null);
      if(cl && SENTIDOS[cl].length>1){
        const vistos=new Set();
        const filas=SENTIDOS[cl].filter(x=>{ if(vistos.has(x[1]))return false; vistos.add(x[1]); return true })
          .map(x=>'<div class="sen'+(r.fr===x[1]?' aqui':'')+'"><b>'+esc(x[1])+'</b>'
               +(x[2]?'<span>'+x[2].replace(/<[^>]*>/g,m=>m)+'</span>':'')+'</div>').join('');
        h+='<div class="hoja-bloque"><div class="hoja-et">Todos los sentidos de «'+esc(cl)+'»</div>'
         +'<div class="hoja-cuerpo sen-l">'+filas+'</div></div>';
      }
    }
    if(!oculto && r.notaSentido)
      h+='<div class="hoja-bloque"><div class="hoja-et">Sentido en este contexto</div>'
       +'<div class="hoja-cuerpo">'+r.notaSentido+'</div></div>';
    if(!oculto && !usoDelata && r.uso) h+='<div class="hoja-bloque"><div class="hoja-et">Cuándo se usa</div><div class="hoja-cuerpo">'+r.uso+'</div></div>';
    if(!oculto && r.tipo==='voc'&&r.parcial)
      h+='<div class="hoja-bloque"><div class="hoja-et">Se usa en</div><div class="hoja-cuerpo"><b>'+esc(r.frase)+'</b></div></div>';
    else if(!oculto && r.tipo==='voc'&&r.ctx)
      h+='<div class="hoja-bloque"><div class="hoja-et">Cómo se usa</div><div class="hoja-cuerpo"><i>'+esc(r.ctx)+'</i></div></div>';
  }else{
    h+='<div class="hoja-nada">'+(bloq
      ?'Esta palabra forma parte de lo que tienes que adivinar. Podrás consultarla en cuanto veas la respuesta.'
      :'No está en el diccionario de la aplicación. Prueba con el infinitivo o el singular.')+'</div>';
  }

function vecinas(sp){
  // on lit le texte réel du bloc, pas seulement les mots surlignés :
  // sinon « de niño » est illisible dès que « de » n'est pas surligné
  const cont = sp.closest('td,th,li,p,.frase,.ficha,.voc-fila,.hoja-cuerpo,.bloq,.aviso') || sp.parentElement;
  const txt = cont.textContent;
  let off=0;
  try{
    const r=document.createRange();
    r.selectNodeContents(cont);
    r.setEnd(sp, 0);
    off=r.toString().length;
  }catch(e){ off=txt.indexOf(sp.textContent) }
  const pal=[], re=/[A-Za-z\u00C0-\u024F]+/g;
  let m;
  while((m=re.exec(txt))) pal.push({w:m[0],i:m.index});
  let k=pal.findIndex(x=>x.i>=off);
  if(k<0) k=pal.length-1;
  // sécurité : on s'aligne sur le mot cliqué
  if(pal[k] && limpia(pal[k].w)!==limpia(sp.textContent)){
    const alt=pal.findIndex(x=>limpia(x.w)===limpia(sp.textContent) && x.i>=off-2);
    if(alt>=0) k=alt;
  }
  const g=j=>(j>=0&&j<pal.length)?pal[j].w:null;
  return {p2:g(k-2),p1:g(k-1),s1:g(k+1),s2:g(k+2)};
}

const CACHE_ES=new Map();
function esEspanol(w){
  const k=limpia(w);
  if(!k) return false;
  if(k.length<2 && !(GENN[k]||DICN[k]||EXPRN[k])) return false;
  if(FR_SOLO.has(k)) return false;
  if(modoFR && FR_AMBIG.has(k)) return false;
  const ck=(modoFR?'F|':'E|')+k;
  if(CACHE_ES.has(ck)) return CACHE_ES.get(ck);
  // même lógica que la búsqueda: así los plurales y las formas derivadas también valen
  const r = !!(EXPRN[k]||DICN[k]||NOMBRES[k]||IDX[k]||GENN[k]||TIPOS[k]||PROPN.has(k)||VERBN[k]||buscar(w));
  CACHE_ES.set(ck,r);
  return r;
}
function envolver(t,pegadoIzq,pegadoDer){
  const s=String(t);
  return s.replace(/[A-Za-z\u00C0-\u024F]+/g,(w,pos)=>{
    const antes  = pos>0 ? s[pos-1] : (pegadoIzq?'-':'');
    const despues= (pos+w.length<s.length) ? s[pos+w.length] : (pegadoDer?'-':'');
    // un fragment de mot ou de syllabe (jo-ven, ten<b>í</b>a) n'est pas un mot
    if(antes==='-'||despues==='-') return w;
    return esEspanol(w)?'<span class="pal">'+w+'</span>':w;
  });
}
function envolverHTML(html){
  // découpage en balises et fragments de texte, puis décision avec les voisins
  const partes=String(html).split(/(<[^>]*>)/);
  const idx=[];
  partes.forEach((x,i)=>{ if(!/^<[^>]*>$/.test(x) && x) idx.push(i); });
  // une balise de bloc coupe le mot : « azú-car<br>sin » ne colle pas « car » et « sin »
  const BLOQUE=/^<\/?(br|p|div|td|tr|th|li|ul|ol|table|tbody|thead|h\d)\b/i;
  const separados=(a,b)=>{ for(let k=a+1;k<b;k++) if(BLOQUE.test(partes[k])) return true; return false; };
  // se sigue la apertura de <i>: dentro va el ejemplo español, fuera la prosa francesa
  const dentroI=[]; let prof=0;
  partes.forEach((x,i)=>{
    if(/^<i[\s>]/i.test(x)) prof++;
    else if(/^<\/i>/i.test(x)) prof=Math.max(0,prof-1);
    dentroI[i]=prof>0;
  });
  idx.forEach((i,j)=>{
    const iPrev = j>0 ? idx[j-1] : -1;
    const iNext = j<idx.length-1 ? idx[j+1] : -1;
    const prev = (iPrev>=0 && !separados(iPrev,i)) ? partes[iPrev] : '';
    const next = (iNext>=0 && !separados(i,iNext)) ? partes[iNext] : '';
    const guardar=modoFR;
    if(dentroI[i]) modoFR=false;        // es un ejemplo: se trata como español
    partes[i]=envolver(partes[i], /[-A-Za-z\u00C0-\u024F]$/.test(prev), /^[-A-Za-z\u00C0-\u024F]/.test(next));
    modoFR=guardar;
  });
  return partes.join('');
}

  bP=mezclar(LIBRO[unidad.n]||[]);
  bI=0;bS=null;bTxt='';bRes=null;bPts=0;bFin=false;bPista=(nivel==='facil');
}
function vLibro(){
  if(!bP.length) return '<div class="tarjeta"><p class="intro" style="margin:0">No hay ejercicios del cuaderno para esta unidad.</p></div>';
  if(bFin) return resultado(bPts,bP.length,'initLibro');
  const [ref,q,resp,ops,pista]=bP[bI];
  const dif=nivel==='dificil';
  const conOps = ops && !dif;
  const ok=!!bS||!!bRes;
  let h=aviso()+barra(bI,bP.length)+'<p class="preg">'+ref+'</p>'
   +'<div class="frase" style="font-size:17px"'+CTX(ok?rellenar(q,resp):q.replace(/___/g,'…'),true)+'>'+E(q)+'</div>';
  if(conOps){
    if(bS||nivel==='facil'){ const t=tradDe(q,resp);
      h+='<div class="aviso pista">💡 '+E(pista)+(bS&&t?'<br><span class="tr-fr">« '+esc(t)+' »</span>':'')+'</div>'; }
    h+='<div class="ops">';
    ops.forEach(o=>{
      let c='op'+(o.length>16?' larga':'');
      if(bS){ if(o===resp)c+=' bien'; else if(o===bS)c+=' mal' }
      h+='<button class="'+c+'" onclick="bResp('+JSON.stringify(o).replace(/"/g,'&quot;')+')">'+ER(o,ok)+'</button>';
    });
    return h+'</div>'+tocar()+salir();
  }
  const mp=multiPartes(q,resp), etq=pideVerbo(q)?etiquetaVerbo(resp,q,pista):null;
  if(etq) h+='<div class="vb-et">🔤 '+E(etq)+'</div>';
  if(mp) h+='<div class="vb-nota">'+E('Este ejercicio tiene '+mp.length+' huecos: rellena uno por casilla.')+'</div>';
  if(bPista&&!bRes&&!dif) h+='<div class="aviso pista">💡 '+E(pista)+'</div>';
  if(mp) h+=camposMulti('campoB',mp,bTxt||[],!!bRes,bRes?bRes.e:'');
  else h+='<input class="campo'+(bRes?' '+bRes.e:'')+'" id="campoB" value="'+esc(bTxt||'')+'" placeholder="Escribe aquí…" '
   +'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"'+(bRes?' disabled':'')+'>';
  if(bRes){
    const t=bRes.e==='bien'?'✓ ¡Correcto!':bRes.e==='casi'?'≈ Casi — te lo doy por bueno':'✗ La respuesta es: <b>'+ER(resp,true)+'</b>';
    h+='<div class="aviso '+bRes.e+'">'+t+(bRes.nota?'<br>'+bRes.nota:'')
     +(bRes.e!=='bien'?'<br><span style="opacity:.85">💡 '+E(pista)+'</span>':'')+'</div>';
    const ex=pideVerbo(q)?explicaVerbo(resp,q,pista):null;
    if(ex) h+='<div class="vb-expl"><div class="vb-tit">Por qué este tiempo</div>'+ex+'</div>';
    const tr=tradDe(q,resp);
    if(tr) h+='<div class="vb-tr">« '+esc(tr)+' »</div>';
  }
  if(!bRes){
    h+='<div class="fila">'
     +(dif?'':'<button class="btn sec" style="width:auto;padding:13px 16px" onclick="bPista=!bPista;render()">'+(bPista?'Ocultar':'Pista')+'</button>')
     +'<button class="btn" onclick="bComp()">Comprobar</button></div>';
  }else{
    h+='<button class="btn" onclick="bSig()">'+(bI+1>=bP.length?'Ver resultado':'Siguiente ›')+'</button>';
  }
  return h+(ok?tocar():'')+salir();
}
function bResp(o){ if(bS)return; bS=o; const e=bP[bI];
  if(o===e[2]){bPts++;marcar(true)}else{marcar(false);anotarFallo(e[1],e[2],e[3],e[4],unidad&&unidad.n)}
  avanzar=bSig; render() }
function bComp(){
  const e0=$('campoB'); const v=e0?e0.value:'';
  if(e0 && !v.trim()) return;
  const mp=multiPartes(bP[bI][1],bP[bI][2]);
  if(mp){ const vals=leerMulti('campoB',mp.length);
    if(!vals.some(x=>x.trim())) return;
    bTxt=vals; bRes=evaluarMulti(vals,mp,nivel==='dificil');
  } else { bTxt=v; bRes=evaluar(v,bP[bI][2],nivel==='dificil') }
  if(bRes.e!=='mal'){bPts++;marcar(true)}else{marcar(false);anotarFallo(bP[bI][1],bP[bI][2],bP[bI][3],bP[bI][4],unidad&&unidad.n)} avanzar=bSig; render();
}
function bSig(){
  avanzar=null;
  if(bI+1>=bP.length)bFin=true; else{bI++;bS=null;bTxt=null;bRes=null;bPista=(nivel==='facil')}
  render();
}

/* ── Compartidos ── */
function barra(i,t){
  return '<div class="prog"><div class="prog-b"><div class="prog-f" style="width:'+(i/t*100)+'%"></div></div>'
   +'<span class="prog-t">'+i+'/'+t+'</span></div>';
}
function resultado(p,t,fn){
  const pc=Math.round(p/t*100);
  const m=pc===100?'¡Perfecto!':pc>=75?'¡Muy bien!':pc>=50?'Vas por buen camino':'Sigue practicando';
  return '<div class="res"><div class="res-circ">'+pc+'%</div><p class="res-msg">'+m+'</p>'
   +'<p class="res-sub">'+p+' de '+t+' respuestas correctas</p>'
   +'<button class="btn" onclick="'+fn+'();render()">Volver a intentarlo</button><div style="height:9px"></div>'
   +'<button class="btn sec" onclick="nivel=null;render()">Cambiar de nivel</button><div style="height:9px"></div>'
   +'<button class="btn sec" onclick="modo=null;nivel=null;render()">Elegir otro juego</button></div>';
}

// ¿El ejercicio pide conjugar un verbo? El infinitivo va entre paréntesis al final.
function pideVerbo(q){
  const m=String(q).trim().match(/\(([^)]+)\)\s*$/);
  if(!m) return false;
  // el primer elemento del paréntesis debe ser un infinitivo real
  const primero=m[1].split(/[,/]/)[0].trim().toLowerCase();
  return /(ar|er|ir)(se)?$/.test(primero) && primero.length>2;
}

// El tiempo anunciado en la pista del ejercicio es la fuente más fiable
const PISTA_T=[

 [/condicional/i,'condicional','condicional'],
 [/futuro/i,'futuro','futuro'],

function tiempoDePista(pista){
  if(!pista) return null;
  for(const [re,t,e] of PISTA_T) if(re.test(pista)) return {t,e};
  return null;
}
