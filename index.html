// Persona deducida de la terminación de un indefinido de raíz irregular
function personaIrregular(r){
  if(/imos$/.test(r)) return '1.ª persona del plural';
  if(/isteis$/.test(r)) return '2.ª persona del plural';
  if(/iste$/.test(r)) return '2.ª persona del singular';
  if(/(ieron|eron)$/.test(r)) return '3.ª persona del plural';
  if(/e$/.test(r)) return '1.ª persona del singular';
  if(/o$/.test(r)) return '3.ª persona del singular';
  return null;
}
function personaDeForma(r){
  const v=desconjugar(String(r).toLowerCase().replace(/^((?:me|te|se|nos|os|le|les|lo|la|los|las)\s+)+/,''));
  if(!v) return null;
  for(const k in PERSONAS) if(String(v.tiempo).indexOf(k)>=0) return PERSONAS[k];
  return null;
}
// Formas realmente ambiguas: se resuelven una por una
const EXCEPCIONES={
 'se viste':['presente','3.ª persona del singular','presente'],
 'te vistes':['presente','2.ª persona del singular','presente'],
 'me visto':['presente','1.ª persona del singular','presente'],
 'nos vestimos':['presente','1.ª persona del plural','presente'],
 'se visten':['presente','3.ª persona del plural','presente'],
 'viste':['presente','3.ª persona del singular','presente'],
 've':['presente','3.ª persona del singular','presente'],
 'vio':['pretérito indefinido','3.ª persona del singular','indefinido'],
 'fui':['pretérito indefinido','1.ª persona del singular','indefinido'],
 'fue':['pretérito indefinido','3.ª persona del singular','indefinido'],
 'di':['pretérito indefinido','1.ª persona del singular','indefinido'],
 'dio':['pretérito indefinido','3.ª persona del singular','indefinido'],
 'sé':['presente','1.ª persona del singular','presente'],
 'vi':['pretérito indefinido','1.ª persona del singular','indefinido']};
function analizaVerbo(resp, frase, pista){
  const r=String(resp).split('/')[0].trim();
  // formas compuestas: he comido, había llegado, está hablando…
  const m=r.match(/^((?:me|te|se|nos|os|le|les|lo|la|los|las)\s+)?(he|has|ha|hemos|habéis|han|había|habías|habíamos|habíais|habían|estoy|estás|está|estamos|estáis|están|estaba|estabas|estábamos|estaban)\s+(\S+)$/i);
  if(m){
    const aux=limpia(m[2]), part=m[3];
    if(/^(he|has|ha|hemos|habeis|han)$/.test(aux))
      return {t:'pretérito perfecto',p:null,expl:'perfecto'};
    if(/^habia/.test(aux)) return {t:'pretérito pluscuamperfecto',p:null,expl:'plusc'};
    if(/ando$|iendo$|yendo$/.test(limpia(part)))
      return {t:/^estaba/.test(aux)?'estar + gerundio (imperfecto)':'estar + gerundio (presente)',
              p:null,expl:/^estaba/.test(aux)?'estabagerundio':'estargerundio'};
  }
  // las tildes distinguen tiempos que limpia() confundiría (visito / visitó)
  const dePista=tiempoDePista(pista);
  const perPista=personaDePista(pista);
  const sinPron=r.toLowerCase().replace(/^((?:me|te|se|nos|os|le|les|lo|la|los|las)\s+)+/,'');
  const exc=EXCEPCIONES[sinPron];
  if(exc && !(dePista && dePista.e==='imperativo'))
    return {t:exc[0],p:exc[1],expl:exc[2]};
  if(dePista && dePista.e==='imperativo')
    return {t:'imperativo',p:perPista||'2.ª persona del singular',expl:'imperativo'};
  if(IRREG_F[sinPron]){ const [f,per]=IRREG_F[sinPron];
    return {t:{presente:'presente',indefinido:'pretérito indefinido',imperfecto:'pretérito imperfecto'}[f],p:per,expl:f}; }
  let forzado=null;
  // el orden importa: futuro y condicional se comprueban antes que el indefinido
  if(/r(ía|ías|íamos|íais|ían)$/.test(r))      forzado={t:'condicional',p:null,expl:'condicional'};
  else if(/r(é|ás|á|emos|éis|án)$/.test(r))    forzado={t:'futuro',p:null,expl:'futuro'};
  else if(/(aba|abas|ábamos|abais|aban)$/.test(r) || /(ía|ías|íamos|íais|ían)$/.test(r))
    forzado={t:'pretérito imperfecto',
      p:/mos$/.test(r)?'1.ª persona del plural':(/is$/.test(r)?'2.ª persona del plural'
        :(/n$/.test(r)?'3.ª persona del plural':(/s$/.test(r)?'2.ª persona del singular':'1.ª o 3.ª persona del singular'))),
      expl:'imperfecto'};
  else if(/^(estuv|tuv|pud|pus|sup|hub|quis|vin|hic|hiz|dij|traj|produj|conduj|anduv|mantuv|obtuv|compus|propus|repus|detuv)/i.test(sinPron))
    forzado={t:'pretérito indefinido',p:personaIrregular(sinPron),expl:'indefinido'};
  else if(/steis$/.test(r)) forzado={t:'pretérito indefinido',p:'2.ª persona del plural',expl:'indefinido'};
  else if(/ste$/.test(r))   forzado={t:'pretérito indefinido',p:'2.ª persona del singular',expl:'indefinido'};
  else if(/(aron|ieron|eron)$/.test(r)) forzado={t:'pretérito indefinido',p:'3.ª persona del plural',expl:'indefinido'};
  else if(/ó$/.test(r))     forzado={t:'pretérito indefinido',p:'3.ª persona del singular',expl:'indefinido'};
  else if(/é$/.test(r))     forzado={t:'pretérito indefinido',p:'1.ª persona del singular',expl:'indefinido'};
  else if(/í$/.test(r))     forzado={t:'pretérito indefinido',p:'1.ª persona del singular',expl:'indefinido'};
  // -amos (verbos -ar) y -imos (verbos -ir): presente e indefinido coinciden
  if(/[^í]amos$/.test(sinPron)||/[^í]imos$/.test(sinPron)){
    const m0=marcaDe(frase||'');
    if(m0&&m0.fam==='indefinido') return {t:'pretérito indefinido',p:'1.ª persona del plural',expl:'indefinido'};
    if(m0&&m0.fam==='imperfecto')
      return {t:'presente',p:'1.ª persona del plural',expl:'presente'};
    return {t:'presente o pretérito indefinido',p:'1.ª persona del plural',expl:'ambiguo'};
  }
  // comprobación de plausibilidad: la raíz debe corresponder a un verbo conocido
  if(forzado && forzado.expl==='indefinido' && /ste$/.test(sinPron)){
    const raiz=sinPron.replace(/(a|i)ste$/,'');
    const conocido=['ar','er','ir'].some(t=>VERBN[limpia(raiz+t)]);
    if(!conocido) forzado=null;
  }
  if(forzado){
    // el imperfecto en -ía / -aba no distingue 1.ª de 3.ª persona
    if(forzado.expl==='imperfecto' && /1\.ª o 3\.ª/.test(forzado.p||'') && frase){
      if(/\b(yo|a m[ií])\b/i.test(frase)) forzado={...forzado,p:'1.ª persona del singular'};
      else if(/\b(él|ella|usted)\b/i.test(frase)) forzado={...forzado,p:'3.ª persona del singular'};
    }
    return forzado;
  }
  const v=desconjugar(sinPron)||desconjugar(r);
  if(!v) return null;
  const t=String(v.tiempo);
  let fam=null;
  for(const k in TIEMPO_N) if(t.indexOf(k)===0||t.indexOf(k)>=0){ fam=k; break }
  let pers=null;
  for(const k in PERSONAS) if(t.indexOf(k)>=0){ pers=PERSONAS[k]; break }
  if(/^imperfecto$/.test(t)) pers='1.ª o 3.ª persona del singular';
  if(/subjuntivo/.test(t) && /3\.ª pers\. sing\./.test(t)) pers='1.ª o 3.ª persona del singular';
  if(/^(presente|indefinido)$/.test(t)) pers=null;
  return {t:TIEMPO_N[fam]||t.split(',')[0], p:pers, expl:fam};
}

// Marcadores que justifican el tiempo dentro de la frase
const MARCAS=[
 [/\b(ayer|anoche|anteayer|el otro d[ií]a|la semana pasada|el mes pasado|el a[nñ]o pasado|el s[aá]bado pasado|en (?:19|20)\d\d|hace \w+ (?:a[nñ]os|meses|d[ií]as|semanas)|de repente|de pronto|un d[ií]a|aquel d[ií]a|en ese momento)\b/i,'indefinido'],
 [/\b(antes|de ni[nñ]o|de ni[nñ]a|de joven|de peque[nñ]o|siempre|todos los d[ií]as|normalmente|a menudo|mientras|en aquella [eé]poca|en aquellos tiempos|cuando (?:era|ten[ií]a|viv[ií]a)|cada (?:d[ií]a|semana|verano))\b/i,'imperfecto'],
 [/\b(hoy|esta ma[nñ]ana|esta tarde|esta semana|este mes|este a[nñ]o|ya|todav[ií]a no|a[uú]n no|alguna vez|nunca|[uú]ltimamente)\b/i,'perfecto'],
 [/\b(ahora mismo|en este momento|ahora)\b/i,'estargerundio'],
 [/\b(ma[nñ]ana|pasado ma[nñ]ana|la semana que viene|el a[nñ]o que viene|dentro de)\b/i,'futuro']
];
function marcaDe(frase){
  for(const [re,fam] of MARCAS){ const m=String(frase).match(re); if(m) return {texto:m[0],fam} }
  return null;
}

// Explicación del empleo del tiempo, en francés
const EXPL={
 presente:"<b>Présent.</b> On l'emploie pour une habitude, un état actuel ou une vérité générale — tout ce qui vaut au moment où l'on parle.",
 indefinido:"<b>Prétérit (indefinido).</b> Action ponctuelle, achevée, située dans un moment terminé. C'est le temps qui fait avancer le récit.",
 imperfecto:"<b>Imparfait.</b> Description, habitude passée ou circonstance. Il n'avance pas le récit : il plante le décor autour des faits.",
 perfecto:"<b>Passé composé.</b> Expérience de vie, ou action située dans une période encore ouverte : aujourd'hui, cette semaine, cette année.",
 plusc:"<b>Plus-que-parfait.</b> Action antérieure à une autre action passée.",
 futuro:"<b>Futur.</b> Action à venir, ou hypothèse sur le présent.",
 condicional:"<b>Conditionnel.</b> Politesse, conseil ou hypothèse. Très employé pour demander poliment.",
 gerundio:"<b>Gérondif.</b> Employé avec <i>estar</i>, il marque l'action en train de se dérouler.",
 estargerundio:"<b>Estar + gérondif.</b> L'action est en cours au moment où l'on parle.",
 estabagerundio:"<b>Estaba + gérondif.</b> L'action était en cours dans le passé, souvent interrompue par une autre.",
 participio:"<b>Participe passé.</b> Invariable après <i>haber</i> ; il s'accorde après <i>estar</i> ou <i>ser</i>.",
 infinitivo:"<b>Infinitif.</b> Forme non conjuguée, employée après une préposition ou un autre verbe.",
 imperativo:"<b>Impératif.</b> Ordre, instruction ou conseil adressé à quelqu'un.",
 ambiguo:"<b>Deux lectures possibles.</b> Aux verbes en -AR et en -IR, la forme de <i>nosotros</i> est identique au présent et au prétérit : seul le contexte tranche. Ici, rien ne permet de choisir."
};
const POR_MARCA={
 indefinido:"Dans cette phrase, «&nbsp;<b>%s</b>&nbsp;» situe l'action dans un moment terminé : c'est ce qui impose le prétérit.",
 imperfecto:"Dans cette phrase, «&nbsp;<b>%s</b>&nbsp;» annonce une habitude ou une circonstance : c'est ce qui impose l'imparfait.",
 perfecto:"Dans cette phrase, «&nbsp;<b>%s</b>&nbsp;» ouvre une période qui n'est pas close : c'est ce qui appelle le passé composé.",
 estargerundio:"Dans cette phrase, «&nbsp;<b>%s</b>&nbsp;» indique que l'action se déroule à l'instant : d'où <i>estar</i> + gérondif.",
 futuro:"Dans cette phrase, «&nbsp;<b>%s</b>&nbsp;» projette dans l'avenir."
};
function explicaVerbo(resp, frase, pista){
  const a=analizaVerbo(String(resp).split('/')[0].trim(), frase, pista);
  if(!a) return null;
  let h = EXPL[a.expl] || '';
  const m=marcaDe(frase);
  if(m && POR_MARCA[m.fam] && (m.fam===a.expl || !h))
    h += (h?'<br>':'') + POR_MARCA[m.fam].replace('%s', m.texto);
  else if(m && POR_MARCA[m.fam] && m.fam!==a.expl)
    h += (h?'<br>':'') + POR_MARCA[m.fam].replace('%s', m.texto);
  return h||null;
}
// Etiqueta corta mostrada ANTES de responder
function etiquetaVerbo(resp, frase, pista){
  // varios huecos: una etiqueta por hueco
  const mp=multiPartes(frase||'',resp);
  if(mp && mp.length>1){
    const ls=mp.map((x,i)=>{
      const a=analizaVerbo(x,frase,pista);
      return a?((mp.length>1?(i+1)+') ':'')+a.t+(a.p?' · '+a.p:'')):null;
    });
    return ls.every(Boolean)?ls.join('  ·  '):null;
  }
  const a=analizaVerbo(resp, frase, pista);
  if(!a) return null;
  let t=a.t, p=a.p;
  const dp=tiempoDePista(pista);
  if(dp && dp.e!=='imperativo' && dp.t!==t && a.expl!=='ambiguo'){
    t=dp.t;
    // la persona venía de una regla que la pista acaba de invalidar
    p = personaDePista(pista) || personaDeForma(resp) || null;
  }
  const pp=personaDePista(pista);
  if(pp && (!p || /o 3\.ª/.test(p))) p=pp;
  return t + (p?' · '+p:'');
}

/* ═══════ Huecos múltiples ═══════ */
// ¿La respuesta corresponde a varios huecos? (tantas partes como huecos)
function multiPartes(q,resp){
  const g=(String(q).match(/___/g)||[]).length;
  if(g<2) return null;
  const p=String(resp).split('/').map(s=>s.trim()).filter(Boolean);
  return (p.length===g)?p:null;
}
// Campos separados, uno por hueco
function camposMulti(id, partes, vals, bloqueado, clase){
  let h='<div class="multi">';
  partes.forEach((_,i)=>{
    h+='<div class="multi-f"><span class="multi-n">'+(i+1)+'</span>'
     +'<input class="campo'+(clase?' '+clase:'')+'" id="'+id+'_'+i+'" value="'+esc(vals[i]||'')+'" '
     +'placeholder="Hueco '+(i+1)+'" autocomplete="off" autocapitalize="off" autocorrect="off" '
     +'spellcheck="false"'+(bloqueado?' disabled':'')+'></div>';
  });
  return h+'</div>';
}
function leerMulti(id,n){
  const v=[]; for(let i=0;i<n;i++){ const e=$(id+'_'+i); v.push(e?e.value:'') } return v;
}
// Evalúa cada hueco por separado y devuelve el peor estado
function evaluarMulti(vals, partes, estricto){
  const res=partes.map((p,i)=>evaluar(vals[i]||'',p,estricto));
  const mal=res.some(r=>r.e==='mal'), casi=res.some(r=>r.e==='casi');
  const notas=res.map((r,i)=>r.e==='bien'?null:('<b>'+(i+1)+'.</b> '+(r.e==='casi'?'≈ ':'✗ ')
     +(r.nota||'La respuesta es <b>'+esc(partes[i])+'</b>.'))).filter(Boolean);
  return {e:mal?'mal':(casi?'casi':'bien'), nota:notas.join('<br>'), detalle:res};
}

/* ═══════ Clave normalizada para buscar la traducción de una frase ═══════ */
// Rellena los huecos repartiendo la respuesta cuando hay varios
function rellenar(q,resp){
  let f=String(q);
  const g=(f.match(/___/g)||[]).length;
  if(g<=1) return f.replace(/___/g,String(resp));
  const porBarra=String(resp).split('/').map(s=>s.trim()).filter(Boolean);
  const porEspacio=String(resp).trim().split(/\s+/);
  const p = porBarra.length===g ? porBarra : (porEspacio.length===g ? porEspacio : null);
  if(!p) return f.replace(/___/g,String(resp));
  p.forEach(x=>{ f=f.replace('___',x) });
  return f;
}
function claveTrad(q,resp){
  return rellenar(q,resp).replace(/\s*\([^)]*\)\s*$/,'').replace(/\s+/g,' ').trim();
}
function tradDe(q,resp){ return (typeof TRAD!=='undefined') ? TRAD[claveTrad(q,resp)] : null }

/* ═══════════════ MODO SIN PARAR (feed infinito) ═══════════════ */
const META_DIARIA = 25;
let fdItem=null, fdSel=null, fdResp=null, fdRacha=0, fdMax=0, fdPuntos=0,
    fdHoy=0, fdTotal=0, fdCelebra=null, fdVistos=[], fdAnim='',
    fdVeloz=0, fdBase=0, fdUnid=[], fdT0=0, fdGanado=0, fdSubeRango=null,
    fdRachaHoy=0, fdVelozHoy=0, fdHist={}, fdExtra={}, fdSprint=0;

/* ── progreso compartido por toda la aplicación ── */
let fdDias=0, fdMetaDia='';
const HOY=()=>new Date().toISOString().slice(0,10);
const AYER=()=>new Date(Date.now()-864e5).toISOString().slice(0,10);
function fdCargar(){
  try{
    const g=JSON.parse(localStorage.getItem('aula2_feed')||'{}');
    fdPuntos=g.puntos||0; fdMax=g.max||0; fdTotal=g.total||0;
    fdDias=g.dias||0; fdMetaDia=g.metaDia||''; fdVeloz=g.veloz||0; fdBase=g.base||0; fdUnid=g.unid||[];
    fdHoy = (g.dia===HOY()) ? (g.hoy||0) : 0;
    fdRachaHoy = (g.dia===HOY()) ? (g.rachaHoy||0) : 0;
    fdVelozHoy = (g.dia===HOY()) ? (g.velozHoy||0) : 0;
    fdHist = g.hist||{}; fdExtra = g.extra||{};
    // la racha de días se rompe si el último día con meta no fue hoy ni ayer
    if(fdMetaDia && fdMetaDia!==HOY() && fdMetaDia!==AYER()) fdDias=0;
  }catch(e){ fdPuntos=0;fdMax=0;fdTotal=0;fdHoy=0;fdDias=0;fdMetaDia='' }
}
function fdGuardar(){
  try{ localStorage.setItem('aula2_feed',JSON.stringify({
    puntos:fdPuntos,max:fdMax,total:fdTotal,hoy:fdHoy,dias:fdDias,
    metaDia:fdMetaDia,veloz:fdVeloz,base:fdBase,unid:fdUnid,
    rachaHoy:fdRachaHoy,velozHoy:fdVelozHoy,hist:fdHist,extra:fdExtra,dia:HOY()})); }catch(e){}
}
// Llamado por TODOS los modos de la aplicación al responder
function marcar(bien,pts,extra){
  fdTotal++;
  const ho=new Date().getHours(), dw=new Date().getDay();
  fdExtra.horas=fdExtra.horas||[];
  const franja=ho<7?'madrugada':ho<12?'mañana':ho<18?'tarde':ho<24?'noche':'x';
  if(!fdExtra.horas.includes(franja)) fdExtra.horas.push(franja);
  if(bien && ho<7) fdExtra.madruga=true;
  if(bien && (ho>=0&&ho<5)) fdExtra.buho=true;
  if(extra&&extra.seg>30&&bien) fdExtra.tortuga=true;
  if(extra&&extra.tipo==='esc'&&bien) fdExtra.orto=(fdExtra.orto||0)+1;
  if(extra&&extra.tipo==='lb'&&bien) fdExtra.verbos=(fdExtra.verbos||0)+1;
  if(extra&&extra.seg<4&&bien){ fdSprint++; if(fdSprint>(fdExtra.sprint||0)) fdExtra.sprint=fdSprint }
  else if(!bien||!extra||extra.seg>=4) fdSprint=0;
  if(bien){
    fdHoy++;
    fdHist[HOY()]=(fdHist[HOY()]||0)+1;
    const cs=Object.keys(fdHist).sort(); while(cs.length>14) delete fdHist[cs.shift()];
    fdPuntos+=(pts||5);
    fdExtra.maxDia=Math.max(fdExtra.maxDia||0,fdHist[HOY()]||0);
    if(dw===0||dw===6){ if(fdHoy>=META_DIARIA) fdExtra.finde=true }
    if(fdHoy>=META_DIARIA && fdRachaHoy>=8 && fdVelozHoy>=6) fdExtra.triple=true;
    if(fdHoy>=META_DIARIA && fdMetaDia!==HOY()){
      fdDias = (fdMetaDia===AYER()) ? fdDias+1 : 1;
      fdMetaDia=HOY();
      return 'meta';           // la meta se acaba de alcanzar
    }
  }
  fdGuardar();
  return null;
}

/* ── generación de tarjetas ── */
// Variantes ortográficas verosímiles: tildes, b/v, ll/y, h, c/z/s
function trampear(p){
  const out=new Set(), A='áéíóú', S='aeiou';
  // quitar o añadir tilde
  if(/[áéíóú]/.test(p)) out.add(p.replace(/[áéíóú]/g,c=>S[A.indexOf(c)]));
  else { const m=p.match(/[aeiou]/g); if(m){ const i=p.lastIndexOf(m[m.length-1]);
    out.add(p.slice(0,i)+A[S.indexOf(p[i])]+p.slice(i+1)); } }
  const sw=[[/b/,'v'],[/v/,'b'],[/ll/,'y'],[/y/,'ll'],[/^h/,''],[/z/,'s'],[/c/,'z'],
            [/g/,'j'],[/j/,'g'],[/qu/,'c'],[/rr/,'r'],[/ñ/,'n'],[/s$/,'z']];
  sw.forEach(([re,to])=>{ if(re.test(p)){ const x=p.replace(re,to); if(x!==p) out.add(x) } });
  // duplicar o simplificar consonantes, permutar vocales contiguas
  const dup=[[/r(?!r)/,'rr'],[/l(?!l)/,'ll'],[/n(?!n)/,'nn'],[/c(?!c)/,'cc']];
  dup.forEach(([re,to])=>{ if(re.test(p)){ const x=p.replace(re,to); if(x!==p) out.add(x) } });
  for(let i=0;i<p.length-1;i++){
    if(/[aeiouáéíóú]/.test(p[i])&&/[aeiouáéíóú]/.test(p[i+1])&&p[i]!==p[i+1])
      out.add(p.slice(0,i)+p[i+1]+p[i]+p.slice(i+2));
  }
  if(!/h/.test(p)) out.add('h'+p);
  out.delete(p);
  return mezclar([...out]);
}
function fdUnidad(){ return UNIDADES[Math.random()*UNIDADES.length|0] }

function fdNuevo(){
  for(let intento=0;intento<50;intento++){
    const u=fdUnidad();
    const r=Math.random();
    let it=null;
    if(r<0.16){                                   // ⚡ relámpago: 200 palabras base, contrarreloj
      const v=BASE200[Math.random()*BASE200.length|0];
      const o=mezclar(BASE200.filter(x=>x[1]!==v[1])).slice(0,3).map(x=>x[1]);
      it={k:'rl',u:0,q:v[0],resp:v[1],ops:mezclar([v[1],...o]),pista:v[3],
          bloq:v[0],bloqFr:v[1],et:'⚡ Relámpago',reloj:6,base:true};
    } else if(r<0.28){                            // ✅ ¿verdadero o falso?
      const v=u.vocab[Math.random()*u.vocab.length|0];
      const miente=Math.random()<0.5;
      const otra=mezclar(u.vocab.filter(x=>x[1]!==v[1]))[0];
      if(!otra) continue;
      const dado=miente?otra[1]:v[1];
      it={k:'vf2',u:u.n,q:'<b>'+v[0]+'</b><br><span class="fd-eq">= '+dado+'</span>',
          resp:miente?'Falso':'Verdadero',ops:['Verdadero','Falso'],
          pista:'La traducción correcta es «'+v[1]+'».',bloq:v[0],bloqFr:v[1],
          et:'¿Verdadero o falso?',html:true};
    } else if(r<0.44){                            // 🔤 ¿cómo se escribe?
      const v=u.vocab[Math.random()*u.vocab.length|0];
      const pal=v[0].replace(/^(el|la|los|las|un|una)\s+/,'').split(/[\s/]/)[0];
      if(pal.length<4) continue;
      const trampas=trampear(pal);
      if(trampas.length<3) continue;
      it={k:'esc',u:u.n,q:'¿Cómo se escribe?<br><span class="fd-eq">'+v[1]+'</span>',
          resp:pal,ops:mezclar([pal,...trampas.slice(0,3)]),
          pista:'Se escribe <b>'+pal+'</b>.',et:'🔤 Ortografía',html:true,reloj:1};
    } else if(r<0.58){                            // español → francés
      const v=u.vocab[Math.random()*u.vocab.length|0];
      const o=mezclar(u.vocab.filter(x=>x[1]!==v[1])).slice(0,3).map(x=>x[1]);
      if(o.length<3) continue;
      it={k:'vf',u:u.n,q:v[0],resp:v[1],ops:mezclar([v[1],...o]),
          pista:v[2]||'',bloq:v[0],bloqFr:v[1],et:'¿Qué significa?'};
    } else if(r<0.72){                            // francés → español
      const v=u.vocab[Math.random()*u.vocab.length|0];
      const o=mezclar(u.vocab.filter(x=>x[0]!==v[0])).slice(0,3).map(x=>x[0]);
      if(o.length<3) continue;
      it={k:'fv',u:u.n,q:v[1],resp:v[0],ops:mezclar([v[0],...o]),
          pista:v[2]||'',fr:true,et:'¿Cómo se dice en español?'};
    } else {                                      // ejercicio del cuaderno
      const pool=LIBRO[u.n]||[];
      if(!pool.length) continue;
      const e=pool[Math.random()*pool.length|0];
      let ops=e[3];
      if(!ops){
        const pal=s=>String(s).trim().split(/\s+/).length, len=String(e[2]).length;
        const par=x=>!x[3]&&x[2]!==e[2]&&pal(x[2])===pal(e[2])&&Math.abs(String(x[2]).length-len)<=Math.max(4,len*0.6);
        let otras=[...new Set(mezclar(pool.filter(par)).map(x=>x[2]))].slice(0,3);
        if(otras.length<3) otras=[...new Set(mezclar(Object.values(LIBRO).flat().filter(par)).map(x=>x[2]))].slice(0,3);
        if(otras.length<3) continue;
        ops=mezclar([e[2],...otras]);
      }
      it={k:'lb',u:u.n,q:e[1],resp:e[2],ops,pista:e[4],
          bloq:e[1].includes('___')?null:e[1],et:'✏️ Completa',tr:tradDe(e[1],e[2])||null};
    }
    // ninguna opción puede repetirse
    if(it.ops){
      const vistas=new Set(), limpias=[];
      it.ops.forEach(o=>{ const c=limpia(o); if(!vistas.has(c)){vistas.add(c);limpias.push(o)} });
      if(limpias.length<Math.min(it.ops.length,3)) continue;
      it.ops=limpias;
      if(!it.ops.includes(it.resp)) continue;
      if(it.ops.length<2) continue;
    }
    const firma=it.k+'|'+it.q;
    if(fdVistos.includes(firma)) continue;
    fdVistos.push(firma); if(fdVistos.length>70) fdVistos.shift();
    return it;
  }
  return null;
}

function fdSiguiente(){
  avanzar=null;
  if(fdCelebra){ fdCelebra=null }
  fdItem=fdNuevo(); fdSel=null; fdResp=null; fdAnim='entra'; fdGanado=0;
  fdT0=Date.now();
  render(); setTimeout(()=>{fdAnim='';},420);
}

/* ── respuesta ── */
function fdResponder(o){
  if(fdSel) return;
  fdSel=o;
  const seg=(Date.now()-(fdT0||Date.now()))/1000;
  const bien = o===fdItem.resp;
  fdResp=bien;
  const rangoAntes=rango(fdPuntos)[1];
  if(bien){
    fdRacha++;
    if(fdRacha>fdMax) fdMax=fdRacha;
    if(fdRacha>fdRachaHoy) fdRachaHoy=fdRacha;
    let bonus = fdRacha>=10?15 : fdRacha>=5?10 : fdRacha>=3?7 : 5;
    if(seg<4){ fdVeloz++; fdVelozHoy++; bonus+=3 }               // bonificación por rapidez
    if(fdItem.base && fdBase<200) fdBase++;
    if(fdItem.u && !fdUnid.includes(fdItem.u)) fdUnid.push(fdItem.u);
    fdGanado=bonus;
    const ev=marcar(true,bonus,{seg,tipo:fdItem.k});
    if(rango(fdPuntos)[1]!==rangoAntes) fdSubeRango=rango(fdPuntos);
    if(ev==='meta') fdCelebra='meta';
    else if(fdRacha>0 && fdRacha%5===0) fdCelebra='racha';
  }else{
    fdRacha=0; marcar(false,0,{seg,tipo:fdItem.k});
    if(typeof anotarFallo!=='undefined' && fdItem.k!=='vf2')
      anotarFallo(fdItem.q.replace(/<[^>]+>/g,' ').trim(), fdItem.resp,
                  fdItem.ops, fdItem.pista||'', fdItem.u||0);
  }
  fdGuardar();
  if(fdSubeRango) fdCelebra='rango';
  render();

/* ═══════ Copia de seguridad: un código para llevarse el progreso ═══════ */
function progExportar(){
  const d={p:fdPuntos,m:fdMax,t:fdTotal,h:fdHoy,d:fdDias,md:fdMetaDia,v:fdVeloz,b:fdBase,
           u:fdUnid,rh:fdRachaHoy,vh:fdVelozHoy,hi:fdHist,ex:fdExtra,dia:HOY(),
           rp:(typeof RP!=='undefined'?RP:[])};
  try{ return 'AULA2-'+btoa(unescape(encodeURIComponent(JSON.stringify(d)))) }
  catch(e){ return null }
}
function progImportar(cod){
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(String(cod).trim().replace(/^AULA2-/,'')))));
    fdPuntos=d.p||0; fdMax=d.m||0; fdTotal=d.t||0; fdDias=d.d||0; fdMetaDia=d.md||'';
    fdVeloz=d.v||0; fdBase=d.b||0; fdUnid=d.u||[]; fdHist=d.hi||{}; fdExtra=d.ex||{};
    fdHoy = (d.dia===HOY()) ? (d.h||0) : 0;
    fdRachaHoy = (d.dia===HOY()) ? (d.rh||0) : 0;
    fdVelozHoy = (d.dia===HOY()) ? (d.vh||0) : 0;
    if(d.rp && typeof RP!=='undefined'){ RP=d.rp; rpGuardar() }
    fdGuardar(); return true;
  }catch(e){ return false }
}
let copiaAbierta=false, copiaMsg='';
function vCopia(){
  const cod=progExportar();
  let h='<div class="tarjeta"><div class="et">Llevarte tu progreso</div>'
   +'<p class="intro" style="margin:8px 0 12px">'
   +E('Copia este código y guárdalo donde quieras (una nota, un mensaje a ti mismo). Te devuelve tus puntos, tu racha y tu lista de repaso en cualquier móvil.')+'</p>'
   +'<textarea class="campo" id="codProg" rows="3" readonly style="font-family:ui-monospace,monospace;font-size:11px;resize:none">'
   +esc(cod||'')+'</textarea>'

   +'<div class="et" style="margin-top:20px">Restaurar</div>'
   +'<p class="intro" style="margin:8px 0 12px">'+E('Pega aquí un código guardado.')+'</p>'

   +'style="font-family:ui-monospace,monospace;font-size:11px;resize:none"></textarea>'

   +(copiaMsg?'<div class="aviso '+(copiaMsg[0]==='✓'?'bien':'mal')+'" style="margin-top:12px">'+copiaMsg+'</div>':'')
   +'</div>';
  return h;
}
function copiarCodigo(){
  const e=$('codProg'); if(!e) return;
  e.select(); e.setSelectionRange(0,99999);
  try{ navigator.clipboard.writeText(e.value); copiaMsg='✓ Código copiado.' }
  catch(x){ try{ document.execCommand('copy'); copiaMsg='✓ Código copiado.' }
            catch(y){ copiaMsg='Selecciona el texto y cópialo a mano.' } }
  render();
}
function restaurarCodigo(){
  const e=$('codPegar'); if(!e||!e.value.trim()) return;
  copiaMsg = progImportar(e.value) ? '✓ Progreso restaurado.' : '✗ El código no es válido.';
  render();
}

function b2Sig(){ avanzar=null; if(b2I+1>=b2P.length) b2Fin=true; else {b2I++;b2S=null} render() }

/* ═══════════════ REPASO — los fallos vuelven hasta dominarlos ═══════════════ */
let RP=[];                       // [{id,q,r,ops,pista,tr,u,n,vis}]
function rpCargar(){ try{ RP=JSON.parse(localStorage.getItem('aula2_repaso')||'[]') }catch(e){ RP=[] } }
function rpGuardar(){ try{ localStorage.setItem('aula2_repaso',JSON.stringify(RP.slice(0,300))) }catch(e){} }

// Registrado por TODOS los modos cuando se falla
function anotarFallo(q,r,ops,pista,u){
  if(!q||!r) return;
  const id=limpia(String(q)+'|'+String(r));
  const ya=RP.find(x=>x.id===id);
  if(ya){ ya.n=0; ya.vis=(ya.vis||0)+1 }
  else RP.unshift({id,q:String(q),r:String(r),ops:ops||null,pista:pista||'',u:u||0,n:0,vis:1});
  rpGuardar();
}
function rpQuitar(id){ RP=RP.filter(x=>x.id!==id); rpGuardar(); render() }
function rpVaciar(){ if(confirm('¿Vaciar toda la lista de repaso?')){ RP=[]; rpGuardar(); render() } }

/* ── lista ── */
function vRepaso(){
  rpCargar();
  let h=aviso();
  if(!RP.length) return h+'<div class="rp-vacio"><div class="rp-vacio-e">🧹</div>'
    +'<div class="rp-vacio-t">'+E('No hay nada que repasar')+'</div>'
    +'<div class="rp-vacio-d">'+E('Los ejercicios que falles aparecerán aquí hasta que los domines.')+'</div></div>';
  const listos=RP.filter(x=>x.n>=3).length;
  h+='<p class="intro">'+E('Aquí vuelven tus fallos. Cada uno hay que acertarlo tres veces, de formas distintas, antes de darlo por dominado.')+'</p>';
  h+='<div class="fila" style="margin-bottom:14px">'
   +'<button class="btn" onclick="rpEmpezar()">'+E('Repasar')+' ('+RP.length+')</button>'
   +'<button class="btn sec" style="width:auto;padding:13px 16px" onclick="rpVaciar()">'+E('Vaciar')+'</button></div>';
  if(listos) h+='<div class="aviso bien">✓ '+listos+' '+E('ya dominados. Puedes retirarlos.')+'</div>';
  h+='<div class="rp-lista">';
  RP.forEach(x=>{
    const pc=Math.min(100,Math.round((x.n||0)/3*100));
    h+='<div class="rp'+((x.n||0)>=3?' ok':'')+'">'
     +'<div class="rp-c"><div class="rp-q">'+E(x.q.replace(/___/g,'…'))+'</div>'
     +'<div class="rp-r">→ '+E(x.r)+'</div>'
     +'<div class="rp-b"><div class="rp-f" style="width:'+pc+'%"></div></div></div>'
     +'<button class="rp-x" onclick="rpQuitar('+JSON.stringify(x.id).replace(/"/g,'&quot;')+')" '
     +'title="Retirar de la lista">'+((x.n||0)>=3?'✓':'✕')+'</button></div>';
  });
  return h+'</div>';
}

/* ── sesión de repaso: tres formas distintas ── */
let rpP=[],rpI=0,rpSel=null,rpTxt='',rpRes=null,rpFin=false,rpModo=0;
function rpEmpezar(){ rpCargar(); rpP=mezclar(RP.filter(x=>(x.n||0)<3)); if(!rpP.length) rpP=mezclar(RP);
  rpI=0;rpSel=null;rpTxt='';rpRes=null;rpFin=false; seccion='repaso2'; rpPrepara(); render(); window.scrollTo(0,0) }
function rpPrepara(){
  const x=rpP[rpI]; if(!x) return;
  // la forma de repaso depende de cuántas veces ya se ha acertado
  rpModo = (x.n||0)===0 ? 0 : (x.n||0)===1 ? 1 : 2;   // 0 opciones · 1 primera letra · 2 escribir
  if(rpModo===0 && !x.ops){
    const otras=mezclar(RP.filter(y=>y.id!==x.id).map(y=>y.r)).slice(0,3);
    x.ops = otras.length>=3 ? mezclar([x.r,...otras]) : null;
    if(!x.ops) rpModo=1;
  }
}
function vRepaso2(){
  if(rpFin){
    const d=RP.filter(x=>(x.n||0)>=3).length;
    return '<div class="res"><div class="res-circ">✓</div>'
     +'<p class="res-msg">'+E('Repaso terminado')+'</p>'
     +'<p class="res-sub">'+d+' '+E('ejercicios ya dominados')+' · '+RP.filter(x=>(x.n||0)<3).length+' '+E('por trabajar')+'</p>'
     +'<button class="btn" onclick="rpEmpezar()">'+E('Otra vuelta')+'</button><div style="height:9px"></div>'
     +'<button class="btn sec" onclick="seccion=\'repaso\';render()">'+E('Ver la lista')+'</button></div>';
  }
  const x=rpP[rpI], ok=!!rpSel||!!rpRes;
  const etq=(typeof pideVerbo!=='undefined'&&pideVerbo(x.q))?etiquetaVerbo(x.r,x.q,x.pista):null;
  let h=aviso()+barra(rpI,rpP.length)
   +'<div class="rp-paso">'+E(['Con opciones','Con la primera letra','De memoria'][rpModo])
   +' · '+E('acierto')+' '+((x.n||0)+1)+'/3</div>'
   +'<div class="frase" style="font-size:17px"'+(ok?' data-frase="'+esc(rellenar(x.q,x.r))+'"':'')+'>'
   +E(x.q.replace(/___/g,'____'))+'</div>';
  if(etq) h+='<div class="vb-et">🔤 '+E(etq)+'</div>';
  if(rpModo===0 && x.ops){
    h+='<div class="ops">';
    x.ops.forEach(o=>{
      let c='op'+(o.length>16?' larga':'');
      if(rpSel){ if(o===x.r)c+=' bien'; else if(o===rpSel)c+=' mal' }
      h+='<button class="'+c+'" onclick="rpResp('+JSON.stringify(o).replace(/"/g,'&quot;')+')">'+esc(o)+'</button>';
    });
    h+='</div>';
  } else {
    if(rpModo===1) h+='<div class="aviso pista">💡 '+E('Empieza por')+' <b>'+esc(x.r.slice(0,Math.max(1,Math.ceil(x.r.length/3))))+'…</b></div>';
    h+='<input class="campo'+(rpRes?' '+rpRes.e:'')+'" id="campoRP" value="'+esc(rpTxt)+'" '
     +'placeholder="Escribe la respuesta…" autocomplete="off" autocapitalize="off" autocorrect="off" '
     +'spellcheck="false"'+(rpRes?' disabled':'')+'>';
    if(!rpRes) h+='<button class="btn" onclick="rpComp()">'+E('Comprobar')+'</button>';
  }
  if(ok){
    const bien = rpSel? rpSel===x.r : rpRes.e!=='mal';
    h+='<div class="aviso '+(bien?'bien':'mal')+'">'
     +(bien?'✓ '+E('¡Correcto!')+' — '+E('acierto')+' '+(x.n||0)+'/3'
           :'✗ '+E('Es')+' <b>'+esc(x.r)+'</b>'+(x.pista?'<br>💡 '+E(x.pista):''))+'</div>';
    const tr=(typeof tradDe!=='undefined')?tradDe(x.q,x.r):null;
    if(tr) h+='<div class="vb-tr">« '+esc(tr)+' »</div>';
    if((x.n||0)>=3) h+='<div class="aviso bien">🎉 '+E('¡Dominado! Ya puedes retirarlo de la lista.')+'</div>';
    h+='<button class="btn" onclick="rpSig()">'+(rpI+1>=rpP.length?E('Terminar'):E('Siguiente')+' ›')+'</button>';
    avanzar=rpSig;
  }
  return h;
}
function rpResp(o){
  if(rpSel) return; rpSel=o;
  const x=rpP[rpI];
  if(o===x.r){ x.n=(x.n||0)+1; marcar(true) } else { x.n=0; marcar(false) }
  const g=RP.find(y=>y.id===x.id); if(g) g.n=x.n;
  rpGuardar(); render();
}
function rpComp(){
  const e=$('campoRP'); if(!e||!e.value.trim()) return;
  const x=rpP[rpI];
  rpTxt=e.value; rpRes=evaluar(rpTxt,x.r,false);
  if(rpRes.e!=='mal'){ x.n=(x.n||0)+1; marcar(true) } else { x.n=0; marcar(false) }
  const g=RP.find(y=>y.id===x.id); if(g) g.n=x.n;
  rpGuardar(); render();
}
function rpSig(){
  avanzar=null;
  if(rpI+1>=rpP.length){ rpFin=true } else { rpI++; rpSel=null; rpTxt=''; rpRes=null; rpPrepara() }
  render();
}

/* ═══════════ Router ═══════════ */
function irFeed(){ seccion='feed'; fdCargar(); fdItem=null; fdSel=null; fdResp=null; fdRacha=0; fdCelebra=null; render(); window.scrollTo(0,0) }
function irUnidad(n){unidad=UNIDADES.find(u=>u.n===n);modo=null;nivel=null;filtro='';avanzar=null;render();window.scrollTo(0,0)}
function irModo(m){
  modo=m; nivel=null; avanzar=null;
  const def=MODOS.find(x=>x.id===m);
  if(def.sinNivel) nivel='unico';
  render(); window.scrollTo(0,0);
}
function irNivel(n){
  nivel=n; avanzar=null;
  if(modo==='fichas')initFichas();
  if(modo==='test')initTest();
  if(modo==='huecos')initHuecos();
  if(modo==='reto')initReto();
  if(modo==='libro')initLibro();
  render(); window.scrollTo(0,0);
}
function render(){
  cabecera();
  let h;
  if(seccion==='feed') h=vFeed();
  else if(seccion==='logros') h=vLogros();
  else if(seccion==='base') h=vBase();
  else if(seccion==='base2') h=vBase2();
  else if(seccion==='tiempos') h=vTiempos();
  else if(seccion==='aux') h=vAux();
  else if(seccion==='acentos') h=vAcentos();
  else if(seccion==='usted') h=vUsted();
  else if(seccion==='gram') h=vGram();

  else if(seccion==='masgram') h=vMasGram();
  else if(seccion==='repaso') h=vRepaso();
  else if(seccion==='repaso2') h=vRepaso2();
  else if(!unidad) h=vUnidades();
  else if(!modo) h=vModos();
  else if(!nivel) h=(NIVELES[modo]?vNiveles():(nivel='unico',render(),''));
  else if(modo==='lecciones') h=vLecciones();
  else if(modo==='vocabulario') h=vVocabulario();
  else if(modo==='fichas') h=vFichas();
  else if(modo==='test') h=vTest();
  else if(modo==='huecos') h=vHuecos();
  else if(modo==='reto') h=vReto();
  else if(modo==='libro') h=vLibro();
  vista.innerHTML=h;
  [['campoR',()=>rTxt,v=>rTxt=v,rComp,rRes],['campoB',()=>bTxt,v=>bTxt=v,bComp,bRes],
   ['campoT',()=>tTxt,v=>tTxt=v,tComp,tRes],['campoH',()=>hTxt,v=>hTxt=v,hComp,hRes],
   ['campoF',()=>fTxt,v=>fTxt=v,fComp,fRes]].forEach(([id,get,set,fn,res])=>{
    const el=$(id);
    if(el&&!res){ el.addEventListener('input',e=>set(e.target.value));
      el.addEventListener('keydown',e=>{if(e.key==='Enter')fn()}); }
  });
  const b2=$('buscaB2');
  if(b2){ b2.addEventListener('input',e=>{ b2Filtro=e.target.value; const pos=e.target.selectionStart;
    render(); const n=$('buscaB2'); if(n){n.focus();n.setSelectionRange(pos,pos)} }); }
  const bv=$('buscaVoc');
  if(bv){
    bv.addEventListener('input',e=>{
      filtro=e.target.value; const pos=e.target.selectionStart;
      render(); const n=$('buscaVoc'); if(n){n.focus();n.setSelectionRange(pos,pos)}
    });
  }
}
try{
  fdCargar(); rpCargar();
  render();
}catch(e){
  document.getElementById('vista').innerHTML =
    '<div style="padding:40px 24px;font-family:-apple-system,sans-serif;text-align:center">'
    +'<h2 style="margin-bottom:12px">Algo ha fallado al cargar</h2>'
    +'<p style="color:#666;line-height:1.5">Si estás viendo esto en la vista previa de Archivos (Quick Look), '
    +'ábrelo en Safari: mantén pulsado el archivo → Compartir → Abrir en Safari.<br><br>'
    +'Si ya lo has abierto en Safari, recarga la página. Si el problema sigue, este es el error técnico:</p>'
    +'<pre style="background:#f4f2ee;padding:12px;border-radius:8px;text-align:left;'
    +'font-size:12px;overflow:auto;color:#b3261e">'+String(e&&e.stack||e)+'</pre></div>';
}
</script>
</body>
